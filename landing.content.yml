  title: 同样是投资记账，差距在算得准不准
  lead: 我们不替你做决定，只把真实收益算到你能看懂。这是多倍贝和同类产品最本质的区别。
  col1: 能力
  colUs: 多倍贝
  colOther: 普通记账 App

scenarios:
  eyebrow: 适用场景
  title1: 每个投资者，
  title2: 各有一套
  lead: 不同的人，同一个问题：我的真实收益到底是多少？多倍贝覆盖多种投资场景，选择适合你的用法。
  items:
    - tone: coral
      icon: monitor
      tag: "独立开发者 · FIRE 践行者"
      title: 数据主权优先
      desc: 不连券商，数据存在云端、主权归你。XIRR 算出来那一刻，就知道这半年折腾到底值不值。
      kit: 开发者专属工作流
    - tone: blue
      icon: user
      tag: "上班族 · 基金定投"
      title: 家人也能看懂
      desc: 推荐给父母记基金，第一次看懂真实收益率。以前只知道「赚了」或「亏了」，现在能说出具体数字——原来那只「明星基」其实跑输通胀。
      kit: 家庭记账套件
    - tone: green
      icon: users
      tag: "追牛猎手 · 多账户持有者"
      title: 三个券商合并算
      desc: 三个券商的账户记了大半年，以前每家说的收益都不一样，搞不清哪个对。现在合并在一起算，终于知道退休金的真实回报率是多少。
      kit: 多账户归集
    - tone: purple
      icon: activity
      tag: "混合投资者 · 股票+基金"
      title: 分红再投不再盲区
      desc: 分红再投一直是我记账的盲区，手动算成本太麻烦。多倍贝把分红自动纳入 XIRR 计算，省了每周日对账的时间。
      kit: 全类型交易记录
    - tone: amber
      icon: file
      tag: "财务爱好者 · 记账达人"
      title: 算法透明不玩黑盒
      desc: 同花顺显示 12.69% 却不解释怎么算出来的。多倍贝 XIRR 口径透明、精确到日，每笔现金流可追溯，账算得清清楚楚。
      kit: 专业复盘工具
    - tone: teal
      icon: lock
      tag: 隐私敏感型用户
      title: 零广告零追踪
      desc: 受够了 App 开屏广告和信息流推荐？多倍贝无广告、不开屏、不荐股、不导流理财。商业模式不依赖你的注意力。
      kit: 隐私优先设计
    - tone: blue
      icon: grad-cap
      tag: "学生 · 理财新手"
      title: 第一笔定投从零算
      desc: 第一次记账也能看懂。XIRR 自动算，定投成本一笔笔摊平，少走新手弯路，不被「复利神话」忽悠。
      kit: 新手起步套件
    - tone: amber
      icon: refresh
      tag: 可转债爱好者
      title: 打新与转股记录
      desc: 可转债的申购、转股、赎回各有成本。全类型流水可记，成本一笔笔并入 XIRR，转股时的真实收益也能算清。
    - tone: green
      icon: layers
      tag: "指数基金党 · ETF 定投"
      title: 定投成本摊薄
      desc: 周定投、月定投的成本怎么摊？XIRR 自动加权，看清定投的真实年化回报，而不是被「微笑曲线」带节奏。
    - tone: teal
      icon: shield-check
      tag: "长期持有 · 养老年金"
      title: 穿越牛熊的回报
      desc: 长期持有的年金，用 XIRR 看穿越周期的真实年化——不是某一年暴涨的数字，是十年里每一笔的加权。
      kit: 长期视角


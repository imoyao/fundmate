# ===== About 品牌页文案（章节结构与 docs/site/about.md 对齐，文案可自由润色美化） =====
about:
  heroTitle: 关于多倍贝
  heroSub: 一款帮你算清真实收益、让复利增长清晰可见的投资账本。
  blocks:
    - id: what
      kind: plain
      title: 多倍贝是什么
      body: 多倍贝是一款帮你（尤其是使用多账户、多平台购买基金理财产品的朋友）算清真实收益、让复利增长清晰可见的投资账本。
      belief: 我们相信，认真地记账与复盘，是普通人做好投资的第一步。
      items:
        - 我的资产中有多少用于投资基金？它们分别是什么？
        - 这些投资在过程中带来了多少浮盈？又分别来自哪些产品（大浪淘沙，去伪存真）？
        - 我买的基金真的帮我实现了资产增值吗？我该选哪些、又该离场哪些？
    - id: origin
      kind: soft
      title: 缘起
      paragraphs:
        - 作为一个低风险（小富即安）投资者，一直有"钱都去哪儿了"的困扰——于是想做一个真正好用的基金记账工具，把每笔账都算明白。
      storyLink: { label: 完整品牌故事 →, href: "story.html" }
    - id: opensource
      kind: plain
      title: 关于开源
      paragraphs:
        - 本人是开源精神的受益者，也是拥护者。多倍贝在创作过程中，离不开无数开源项目的分享。
        - 同时，我们也理解当前开源社区普遍面临的现实：投入与回报常常不成正比，"开源 = 白嫖"的心态并不少见。因此，目前暂不开放整个软件的源码；如果你需要部分功能的实现思路，可以通过赞赏作者或参与文档与建议贡献的方式获取支持。
      quote: 好的开源生态，需要享用便利的人也愿意回馈。单向的索取，只会让愿意分享的人越来越少。
    - id: sustain
      kind: coral
      title: 如何持续下去
      paragraphs:
        - 谈开源，也绕不开怎么让一件事持久。多倍贝会坚持基础记账功能（含账单导出）长期免费。但一款软件要持续维护，只靠热爱是不够的——
      links:
        - { label: 财帮子的所有者还打算继续办下去么？, href: "https://www.zhihu.com/question/29603361" }
        - { label: 网易有钱 App 下线公告, href: "https://1.163.com/html/qian/web/5fdaffaed605e84a6d118cd4.html" }
        - { label: 雪球"模拟盈亏"功能下线公告, href: "https://xueqiu.com/6123409880/150393232" }
      tip: 如果多倍贝对你有帮助，我们鼓励你在能力范围内付费支持；如果觉得它一文不值，来去随宜，也完全没关系。付费与否，都不影响你使用免费的基础功能。
      quote: 如果用户没有付钱，那么用户往往就是商品。这也是我们坚持"基础免费、增值可选"的原因——不靠贩卖你的数据，而靠认可我们的人。

# ===== 品牌故事页（唯一文案源：用户提供的下潜长文） =====
brandStory:
  heroTitle: 为什么做多倍贝？
  heroSub: 阳光穿过浅海，照亮珊瑚森林；镜头下潜 800 米，遇见在幽暗中靠气室保持平衡的鹦鹉螺。
  opening:
    paragraphs:
      - 阳光穿过透明的浅海，照亮了海底的珊瑚森林。枝杈在水流中缓缓摇摆，染出一片温暖而鲜活的珊瑚红。
  dive:
    paragraphs:
      - 镜头追随着这片光，开始从海面垂直下潜——光线被层层海水吞没，蓝色由浅及深，喧嚣逐渐归于沉寂。直到海面之下 800 米，这里是另一片天地：没有风，没有浪，只有无声涌动的暗流和足以碾碎金属的庞大水压。
      - 鹦鹉螺，就栖息在这片永恒的幽暗之中。
      - 它从不对抗深海的水压，而是用另一种方式回应这片环境：精密调控壳内三十余间气室的腔液与气体比例，在漆黑中保持着恰到好处的浮力。洋流的强弱起伏，日复一日，都化作它壳上新生的纹路。
  metaphor:
    paragraphs:
      - 我们每一个置身市场的人，何尝不是潜入自己的深海。市场的每一次脉冲，就是海面以上的狂风骤雨；而真实的资产价值，始终藏在水面之下的暗流中。账户里的浮盈浮亏，不过是海面偶尔翻起的浪花。
  thinking:
    paragraphs:
      - 很多人认为投资就是追着浪头跑，但我逐渐想明白了一件事：财富增长的上限，永远取决于你靠什么换钱。
      - 单纯出卖时间，天花板抬眼就能看到。想把资产做大，无非两条路：自己创业，或者让资本去生钱。两条路都不容易，但不管走哪条，前提都得先把账算明白。
      - 不知道真实的收益，就没法判断下一步该往哪走。对大多数普通人来说，投资是绕不开的一步。
  origin:
    paragraphs:
      - 于是我开始自问：那我到底该怎么做，才算是"有备无患"？
      - 答案很朴素——别急着预测下一个浪头，先把潮水退去时自己到底站在哪算清楚。
      - 做多倍贝的起点，是我自己首先算不清自己的账了。手里好几个券商和基金账户，满屏浮盈。涨潮时觉得自己是天才，退潮时才发现连资金进出都是一笔糊涂账。
      - 于是我写了个极简的脚本。不直连账户，只导入交易记录 CSV，输出一个最直接的数字：XIRR。它不跟市场脉搏跳动，只告诉你一个坐标——你真实的复利轨迹，到底在哪。算完之后，它还会把你的持仓结构摊开来看：单只标的占比是不是过高？波动有没有超出你能承受的底线？这些硬数据，比任何浮盈都更能回答一个问题——你到底安不安全。
  friend:
    paragraphs:
      - 后来我把它分享给一位朋友。他跟投了一个号称"十年十倍"的投资组合。
      - 结果数据拉出来，他盯着那个数字沉默了许久，然后叹了口气：
      - "八年折腾，收益还不如一笔三年期定期存款。原来一直都在闭着眼瞎投。"
      - 但他停顿后补了一句："好在，今天总算不是裸泳了。"
      - 那一刻我意识到，对大多数人来说，真正需要的不是能预知市场的"神技"，而是看清市场真相后，那种不会再被潮水裹挟的定力。
  closing:
    paragraphs:
      - 多倍贝，想成为帮你掌控那间"气室刻度"的标尺。
      - 我们不荐股、不跟单。所有数据由你手动录入或交割单导入，主权归你，随时可一键导出带走。我们不做带你追浪的弄潮儿，只用数据的事实说话，做一把诚实的度尺。
    rhyme:
      - 潮有涨落，壳有深浅。算得清，才无患。

honesty:
  eyebrow: 诚实承诺
  title: 我们选择说实话，即使这并不讨好
  lead: 很多产品只展示自己好的一面。我们觉得，你应该知道这个工具擅长什么、不擅长什么。
  items:
    - icon: activity
      cls: ""
      title: 计算口径诚实
      desc: XIRR 精确到日、资金加权，不含未实现浮盈的误导性美化。我们算的是你真实的持仓回报率，不是模拟出来的漂亮数字。
    - icon: shield
      cls: ""
      title: 数据主权
      desc: 数据存于云端，主权归你：交易记录一键导出 CSV、随时可带走，也不用于任何营销或广告。你的交易记录，由你掌控。
    - icon: rect
      cls: ""
      title: 不靠广告变现
      desc: 无开屏广告、无信息流广告、不导流理财。我们的商业模式不依赖你的注意力，所以不需要用广告打断你。
    - icon: circle-x
      cls: ""
      title: 不荐股不跟单
      desc: 纯工具，不做任何投资建议，不做跟单社区。我们不告诉你买什么卖什么——那是你的决定，不是我们的。
    - icon: file-text
      cls: ""
      title: 算法透明
      desc: 同口径同步展示 XIRR（资金加权，精确到日），每笔现金流与每日资产变动都可追溯。基于公开标准（Excel XIRR 同源），不会偷偷调整算法来美化你的收益曲线。算就是算，不玩花活。
    - icon: info
      cls: limitation
      title: 我们也做不到的事
      desc: 不支持期货/加密货币实时估值；分红再投需手动标记；不支持自动同步券商交割单（这是刻意的设计选择，不是技术限制）。这些已知边界会持续公开。

story:
  title: 为什么做这件事
  lead: 我们每一个置身市场的人，何尝不是潜入自己的深海。市场的脉冲是海面上的狂风骤雨，而真实的资产价值，始终藏在暗流里。

honesty:
  eyebrow: 诚实承诺
  title: 我们选择说实话，即使这并不讨好
  lead: 很多产品只展示自己好的一面。我们觉得，你应该知道这个工具擅长什么、不擅长什么。
  items:
    - icon: activity
      cls: ""
      title: 计算口径诚实
      desc: XIRR 精确到日、资金加权，不含未实现浮盈的误导性美化。我们算的是你真实的持仓回报率，不是模拟出来的漂亮数字。
    - icon: shield
      cls: ""
      title: 数据主权
      desc: 数据存于云端，主权归你：一键导出 CSV、随时可带走，也不用于任何营销或广告。你的交易记录，由你掌控。
    - icon: rect
      cls: ""
      title: 不靠广告变现
      desc: 无开屏广告、无信息流广告、不导流理财。我们的商业模式不依赖你的注意力，所以不需要用广告打断你。
    - icon: circle-x
      cls: ""
      title: 不荐股不跟单
      desc: 纯工具，不做任何投资建议，不做跟单社区。我们不告诉你买什么卖什么——那是你的决定，不是我们的。
    - icon: file-text
      cls: ""
      title: 算法透明
      desc: 同口径同步展示 XIRR（资金加权）、时间加权、Modified Dietz 三种收益率，每笔现金流与每日资产变动都可追溯。基于公开标准（Excel XIRR 同源），不会偷偷调整算法来美化你的收益曲线。算就是算，不玩花活。
    - icon: info
      cls: limitation
      title: 我们也做不到的事
      desc: 不支持期货/加密货币实时估值；分红再投需手动标记；不支持自动同步券商交割单（这是刻意的设计选择，不是技术限制）。这些已知边界会持续公开。

story:
  title: 为什么做这件事
  paragraphs:
    - 2024 年底，我开始认真整理自己的投资账户——三个券商 App、两个基金平台、还有零散的银行理财。每家都告诉我"累计收益"，但数字对不上。A 说赚了 12%，B 说 8%，我自己手算出来又是另一个数。
    - 问题出在哪？分红再投没记、手续费被忽略、资金进出时间没加权。券商展示的"累计收益"根本不是真正的年化收益率——它只是一个绝对值，骗你觉得赚了不少，或者亏得没那么多。
    - 我是个写代码的人。我想，与其每次打开 Excel 手动算 XIRR，不如写个工具让自己用。第一版很粗糙——一个命令行脚本，读 CSV，输出一个数字。但就是这个数字，第一次让我看清了自己真实的投资回报。
    - 后来我把这个工具给家人用。我妈记了大半年的基金交易，第一次看到自己的 XIRR 时说："原来我买的这只'明星基'其实跑输通胀啊。"
    - 那一刻我觉得，这个工具不该只有我一个人用。
  meta1: 关于"多倍贝" —— 名字来自一个简单的信念：复利是普通人最可靠的财富增长方式，而看清复利的前提是把账算对。"备贝多"——未雨绸缪，有备无患。
  meta2: "独立开发 · 目前完全免费 · 由阿垚维护"
  sidebarTitle: 我们的立场
  sidebarText: 我们不荐股、不跟单、不预测市场——只帮你把账算清楚。买还是卖？你自己判断。

pro:
  eyebrow: 专业复盘
  title: 大厂工具缺的那口气，我们补上
  lead: 主流券商 App 的账本能算收益，但从不在意你怎么看懂它。专业用户值得更诚实的复盘——算得清，也要说得清。
  items:
    - icon: info
      title: 算法公开，每一步可追溯
      desc: 同口径同步展示 XIRR（资金加权）、时间加权、Modified Dietz 三种收益率，并追溯每笔现金流与每日资产变动。不再有"这个 12.69% 到底怎么算的"这种疑问。
    - icon: chart
      title: 回撤分布曲线，不只是极值
      desc: 不只标一个"最大回撤"。绘制连续回撤曲线，让你看到一波波行情中每次颠簸的轮廓——真正有用的不是最惨的那一次，是分布。


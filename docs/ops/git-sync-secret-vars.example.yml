# duoduobei/fundmate-secret 的 vars.yml —— 模板（可整份复制到密钥仓库）
#
# ⚠️ 这个文件**不在本仓库生效**：它只是模板。真正被读取的是密钥仓库
#    duoduobei/fundmate-secret 里的 vars.yml，被 `.cnb.yml` 的**插件任务级 `imports`** 引用：
#
#      stages:
#        - image: tencentcom/git-sync
#          imports:                                  # ← 与 image 平级（插件任务级）
#            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/vars.yml
#          settings:
#            username: ${GIT_USERNAME}               # imports 注入环境变量后才解析得出
#
#    该仓库对 API / token 一律 403（Secret repos do not support token access），
#    故 AI 与 CLI **既读不到也提不了 PR**，只能在 CNB Web 界面人工改。
#
# ## 引用位置：**插件任务级 `imports`**（不是流水线级、不是 `settingsFrom`）（CNB #148，2026-10-12）
#
# 这是「三条 git-sync 作业全红」的真根因，且**两个形态的报错都不指向真正的原因**。
# 线上先后踩过：
#
# ① 挂**流水线级** `imports`（`push:` 下一层、`stages:` 之上一行）⇒ 死在 Prepare，连 stage 都没进：
#
#      The file: .../fundmate-secret/-/blob/main/vars.yml declares allow_images
#      and can only be referenced by plugin tasks.
#      文件 ... 声明了 allow_images 只能在插件任务引用。
#
# ② 改挂**插件任务级 `settingsFrom`** ⇒ Prepare 过了、进得了 stage，但推不上去：
#
#      fatal: could not read Username for 'https://github.com': No such device or address
#      Error: Failed to push all branches
#
# 逐层解释：
#
# 1. 本文件必须声明 `allow_images: [tencentcom/git-sync]`，否则 git-sync 插件读不到密钥；
# 2. 引用的**位置**决定合规：只有**插件任务级**（与 `image` 同级）的引用才算「插件任务引用文件」，
#    流水线级引用会被判「声明了 allow_images 却没在插件任务里用」→ Prepare 直接拒（形态 ①）；
# 3. 引用的**方式**决定 `${VAR}` 能否解析：`imports` **注入环境变量**，`settings` 里的
#    `${GIT_USERNAME}` 才解析得出；`settingsFrom` 只**加载插件参数**、不注入环境变量，
#    于是插件拿到空的 username/password ⇒ git 又要用户名（形态 ②）。
#
# 判断口诀：
#
#      「引用挂在哪」决定合规      → 必须插件任务内（与 image 同级）；挂流水线级必死 Prepare
#      「用 imports 还是 settingsFrom」决定 ${VAR} 能否解析
#                                → 要用 ${VAR} 就必须 imports；settingsFrom 不注入环境变量
#
# 正确形态（本仓 .cnb.yml 已是这个形状，且由 scripts/guard_secret_imports.py 守门）：
#
#      stages:
#        - name: 同步到 GitHub（全分支 + 标签）
#          image: tencentcom/git-sync
#          imports:                                  # ← 与 image 平级
#            - https://cnb.cool/.../fundmate-secret/-/blob/main/vars.yml
#          settings:
#            target_url: https://github.com/imoyao/fundmate.git
#            auth_type: https
#            username: ${GIT_USERNAME}               # 值来自上面 imports 注入的环境变量
#            password: ${GITHUB_PAT}
#            push_tags: true
#
#      # ❌ 错①：凭据挂流水线级 imports（=三条作业死在 Prepare 的写法）
#      # push:
#      #   - imports: https://cnb.cool/.../fundmate-secret/-/blob/main/vars.yml
#      #     stages:
#      #       - image: tencentcom/git-sync
#      #         settings: { ... }
#
#      # ❌ 错②：挂插件 settingsFrom 却在 settings 里用 ${VAR}（= could not read Username 的写法）
#      #       - image: tencentcom/git-sync
#      #         settingsFrom: [https://cnb.cool/.../fundmate-secret/-/blob/main/vars.yml]
#      #         settings:
#      #           username: ${GIT_USERNAME}   # 解析不出：settingsFrom 不注入环境变量
#
# ⚠️ 迁移时**必须把旧写法删干净**，不能两种写法并存：平台不允许同一引用对象承担两种语义，
#    留着只会让「到底哪条生效」变得不可预测。守卫会拦住这种半吊子改动。
#
# ## 它必须是 YAML，不能是 .env
#
# 被引用的文件要求是一个 **YAML 对象**（属性名 = 环境变量名，见
# https://docs.cnb.cool/zh/build/grammar.md#pipeline-imports）。
# 写成 .env 风格会**整条流水线死在 Prepare**：
#
#      ❌ 错（用 = 连接，且前两行是纯量标量）
#      GIT_USERNAME=imoyao
#      GITHUB_PAT=ghp_xxx
#      allow_slugs:
#        - duoduobei/fundmate
#
#      报错：Failed to parse file: vars.yml
#            [FileParser]: parse yaml failed. end of the stream or a document
#            separator is expected (3:12)
#
# 一个 YAML 文档不能「先是标量、再是映射」，解析器就在第 3 行第 12 列炸掉——
# 本地 `yaml.safe_load` 复现的行列与线上报错**逐字一致**。
#
#      ✅ 对（KEY: value）
#
# > 报错里**没有** `not found` 是在提示「文件找得到、内容读不成对象」。
# > 但别把这句话当万能判据：`GetFileContent: not found` 也可以是**事件根本没定义**
# > （例如把 `push:` 写在 .cnb.yml 顶层而非分支之下，平台拿默认分支的定义兜底）。
# > 两种形态的区分见 docs/dev/github-cnb-mirror.md §12。

# ---- 凭据（git-sync 插件读取，见 https://cnb.cool/cnb/plugins/tencentcom/git-sync）----
GIT_USERNAME: imoyao
# ⚠️ PAT 需 repo 权限。**切勿**把它贴进任何评论 / 截图 / issue：
#    一旦外泄等同于交出 imoyao/fundmate 的写权限，唯一正确处置是立刻到
#    GitHub → Settings → Developer settings → Tokens 撤销重建，再更新本文件。
GITHUB_PAT: <在此填 GitHub PAT，不要提交到任何代码仓>

# ---- 访问范围声明 ----
# 依据 https://docs.cnb.cool/zh/build/file-reference.md#权限检查 ：
# allow 字段**只有四个**——allow_slugs / allow_events / allow_branches / allow_images。
# 别顺手写 allow_tags / allow_users：字段不存在，写了不生效，报错还指不到这里。
# fundmate-secret 是「私有且非同源」仓库，故这四个是**必需**的，不是可选加固。
allow_slugs:
  - duoduobei/fundmate
allow_events:
  # push 是可信事件，但兜底那条「触发者有文件读权限」走不通（CI 触发者不是本仓开发者），
  # 所以显式放开；crontab 两条定时任务的表达式不同、事件名相同，用 glob 一次覆盖。
  - push
  - "crontab:*"
allow_branches:
  # ⚠️ **必须是 `*`（glob 全匹配），不能收窄成 `[main, dev]`**（源 CNB #598，2026-10-19）。
  #
  # 本文件同时服务**三段** git-sync，其中功能分支那段（`.cnb.yml` 的
  # `"**/!(main|dev)": push:`）推的是 `branch: ${CNB_BRANCH}`。平台按 **`CNB_BRANCH` 逐条
  # 匹配**本白名单 ⇒ 写成 `[main, dev]` 时，`fix/*` / `feat/*` 的 push **一律读不到密钥**。
  #
  # 失败形态是**静默的**：插件并不报「凭据无效」，它连 `Set up authentication` 那一段都不打，
  # 直接给出与「分支保护」「网络」毫无区别的一句话 ——
  #     Initializing Git LFS...
  #      ! [remote rejected]   fix/552-bridge-sync-reachable -> fix/552-bridge-sync-reachable (failed)
  # 实测构建 `cnb-6kb-1k59g1tc6`（2026-10-19）。对照**同一时刻**别的功能分支推送成功
  # （`fix/552-resolve-conflict` 是 `* [new branch]`）—— 差别只在「那一轮引用有没有被拒」。
  #
  # 判据：`scripts/guard_secret_imports.py` 判据 4（模板不含 `*` 且 `.cnb.yml` 里存在
  # `${CNB_BRANCH}` ⇒ 报红）。改完这里，**必须同步改密钥仓库 `fundmate-secret/vars.yml`**
  # —— 该仓库对本仓 403，只能人工在 CNB Web 界面改。
  - "*"
allow_images:
  # git-sync 是插件任务（image + settingsFrom），未声明 allow_images 会被拒。
  # ⚠️ 声明了它，本文件就**只能**经 `settingsFrom` 引用——走 `imports` 必死在 Prepare（见文件头）。
  - tencentcom/git-sync
  - "tencentcom/git-sync:*"

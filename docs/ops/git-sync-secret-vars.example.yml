# fundmate-secret 密钥仓库 vars.yml 模板（**YAML 格式，不是 .env / KEY=VALUE**）
#
# 用途：`duoduobei/fundmate` 的 `.cnb.yml` 通过 `imports` 把本文件读成环境变量，
# 供 tencentcom/git-sync 插件做 CNB ↔ GitHub 双向同步。
#
# 为什么这份模板放在**代码仓**而不是只放密钥仓库：
#   vars.yml 本体在 `duoduobei/fundmate-secret`（Secret 类型），API / token 一律 403
#   （`Secret repos do not support token access`），AI 与 CLI 都读不到、也没法提 PR 修。
#   于是「它长什么样」这件事只能靠代码仓里的模板来固化。
#
# ⚠️ 踩过的坑（2026-10-11，PR #150 上线后全红 5 次才定位）：
#   imports 要求文件是 **YAML 对象**，属性名 = 环境变量名。写成 `.env` 风格
#   `GIT_USERNAME=imoyao` 会让 YAML 解析器在第一行得到一个纯量标量、第二行又得到一个，
#   到第三行的 mapping 就炸：
#
#     Failed to parse file: vars.yml
#     [FileParser]: parse yaml failed. end of the stream or a document separator
#     is expected (3:12)
#
#   注意此时的报错**不是** `not found`——文件找得到，是内容读不成对象。
#   （更早那批 `GetFileContent: not found` / `GetResourceAccess: not found` 是同一行
#   `imports` 在文件还没落盘时的报错，两者不是一回事，别混为一谈。）
#
# 用法：把下面内容复制进 `fundmate-secret` 仓库根目录的 `vars.yml`（分支 main），
#       填上真实凭据即可。**密钥仓库只能在 Web 界面编辑，禁止本地 push。**

# ---- 凭据（git-sync 插件读取）----
GIT_USERNAME: imoyao
# PAT 需 repo 权限，且对 imoyao/fundmate 可写。
# 泄露即等同于交出仓库写权限，发现泄露立刻去 GitHub Settings → Developer settings
# → Tokens 撤销重建，再回来更新本文件。
GITHUB_PAT: ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# ---- 访问范围声明（#120 硬性要求：四个字段缺一不可）----
# 依据：https://docs.cnb.cool/zh/build/file-reference.md#权限检查
# fundmate-secret 是「私有且非同源」仓库，故这套声明是**必需**的，不是可选加固。
allow_slugs:
  - duoduobei/fundmate
allow_events:
  # push 是可信事件，但兜底那条「触发者有文件读权限」走不通（CI 触发者不是本仓开发者），
  # 所以显式放开；crontab 两条定时任务的表达式不同、事件名相同，用 glob 一次覆盖。
  - push
  - "crontab:*"
allow_branches:
  - main
allow_images:
  # git-sync 是插件任务（image + settings），未声明 allow_images 会被拒。
  - tencentcom/git-sync
  - "tencentcom/git-sync:*"

# duoduobei/fundmate-secret 的 claim-sync-env.yml —— 模板（可整份复制到密钥仓库）
#
# ⚠️ 这个文件**不在本仓库生效**：它只是模板。真正被读取的是密钥仓库
#    duoduobei/fundmate-secret 里的 claim-sync-env.yml，被 `.cnb.yml` 里
#    `认领同步` 这个**脚本任务**的 `imports` 引用：
#
#      stages:
#        - name: 认领同步（…）
#          imports:                                     # ← 脚本任务级 imports
#            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/claim-sync-env.yml
#          script: |
#            python scripts/bridge/claim_detect.py --apply
#
#    该仓库对 API / token 一律 403（Secret repos do not support token access），
#    故 AI 与 CLI **既读不到也提不了 PR**，只能在 CNB Web 界面人工改。
#
# ## 为什么需要**单独一份**文件（不能复用 vars.yml）（CNB #269，2026-10-14）
#
# `vars.yml` 是给 **git-sync 插件任务**用的，它**必须**声明 `allow_images`（否则插件读不到密钥）。
# 而 CNB《文件引用 › 权限检查 › image 检查说明》有一条硬规则：
#
#     非插件任务的 image 为空字符串，无法匹配任何 glob 表达式；
#     配置文件声明了 `allow_images` 将不能被非插件任务引用。
#
# `认领同步` 同时写了 `image` + `script` ⇒ 它是**脚本任务**（image 只是跑 script 的容器）
# ⇒ **引用任何声明了 `allow_images` 的文件都必死在 Prepare**，无论 imports 还是 settingsFrom、
# 挂 job 级还是 stage 级。改挂载层级治不了它 —— 真根因是**文件里的 `allow_images`**。
#
# ⇒ 所以另起一份**不声明 `allow_images`** 的文件，专供脚本任务 `imports`。
#    依据 CNB《文件引用 › 权限检查》的「allow 必要性检查」流程图：
#    可信事件（`push` 属于可信事件）+ **非镜像任务** ⇒ 既不需要 `allow_events`、
#    也不需要 `allow_images`，只走 allow 检查（`allow_slugs` / `allow_branches`）。
#
# ## 与 vars.yml 的关系
#
# 两者是**同一份 PAT 的两个副本**，理由只有一个：`allow_images` 的适用面不同。
# `GITHUB_PAT` 的值必须与 `vars.yml` 里的一致（github.com 只认同一个 token 的权限）。
# 轮换 PAT 时**两份都要改**——这是这份文件唯一的长期成本，别忘。
#
# ## 格式：必须是 `KEY: value` 映射，不能写成 .env 风格
#
# 写成 `GITHUB_PAT=ghp_xxx` 会整条流水线死在 Prepare（`parse yaml failed`）：
# 一个 YAML 文档不能「先是标量、再是映射」。详见 git-sync-secret-vars.example.yml 文件头的实测记录。

# ---- 凭据 ----
# ⚠️ PAT 需 repo 权限。**切勿**把它贴进任何评论 / 截图 / issue：
#    一旦外泄等同于交出 imoyao/fundmate 的写权限，唯一正确处置是立刻到
#    GitHub → Settings → Developer settings → Tokens 撤销重建，再更新本文件。
GITHUB_PAT: <在此填 GitHub PAT，与 vars.yml 里那份保持一致>

# ---- 访问范围声明 ----
# allow 字段只有四个：allow_slugs / allow_events / allow_branches / allow_images。
#
# ⚠️ **本文件刻意不声明 `allow_images`**：它是「只能被插件任务引用」的锁，
#    而本文件的读者是脚本任务（`认领同步`）。写上它 = 重新把 #269 的坑挖回来。
#    同理**不声明 `allow_events`**：`push` 是可信事件，可信事件下的脚本任务不需要它。
#
# ⚠️ `allow_branches` 也**刻意不写**：`认领同步` 挂在 `$` 段（= 所有分支）下，
#    任何分支 push 都要能读到凭据；而 `allow_branches` 一旦声明就必须逐条匹配
#    `CNB_BRANCH`，等于把「任何分支」重新收紧成白名单，功能分支会立刻被拒。
#    （`vars.yml` 那边必须写，因为它服务的是 `main` / `dev` / 功能分支三段不同的 git-sync。）
#    故这里只留 `allow_slugs` 兜住「只能被本仓引用」。

allow_slugs:
  - duoduobei/fundmate

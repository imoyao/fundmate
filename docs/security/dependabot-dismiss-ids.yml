# Dependabot 批量 dismiss 编号清单
#
# 用途：供 docs/security/dependabot-triage.md 第二节（后端 pip 73 个残留告警）
#       批量处置使用；一个 alert 编号对应一条 dismiss 记录。
# 背景：这些告警基于已删除的 backend/requirements/base.txt 的历史扫描结果，
#       Dependabot 不会自动清除；实际依赖（pdm.lock）解析版本已 ≥ patched 版本，
#       属「幽灵告警」，并非真实漏洞。
# 处置：GitHub → Security → Dependabot alerts → 勾选下列编号批量 dismiss，
#       reason 选 "This vulnerability is not in my codebase / no longer present"。
# 迁移：由原仓库根目录的 da_phantom_ids.txt（2026-08-10 生成）转成结构化 YAML，
#       以免裸 .txt 被误认作临时文件（见 #1285 讨论）。
#
# 结构：pip.alert_ids 为整数数组，降序排列，共 73 个。


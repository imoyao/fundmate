# Cloudflare Pages —— 应用站（app.duoduobei.com，三平台备线，见 docs/ops/deployment.md §3）
#
# 为什么放在仓库根：Cloudflare Pages 的 Git 集成只读**仓库根**的 wrangler.toml；
# 且 Pages 的 wrangler 配置**没有 `[build]` 段**（2026-09-18 核对官方文档
# https://developers.cloudflare.com/pages/functions/wrangler-configuration/ ：
# 只认 name / pages_build_output_dir / 绑定 / vars），构建命令与 Root directory
# 只能在 Dashboard 项目设置里填，两边必须保持一致。
#
# Dashboard 项目设置（与根 vercel.json 等价，改一处要同步另一处）：
#   Root directory    : 留空（仓库根）
#   Build command     : pnpm --dir frontend build
#   Build output dir  : frontend/dist
#   Node / pnpm 版本  : 由根 package.json 的 packageManager 字段（pnpm@9.15.9）自动决定
# SPA 路由回退由 frontend/public/_redirects 随构建拷进 dist/（`/* /index.html 200`）。
name = "duoduobei-app"
compatibility_date = "2026-09-18"
pages_build_output_dir = "frontend/dist"

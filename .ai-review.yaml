# AI Review 自定义配置（免费 GLM 总结线路）
#
# 覆盖 ai-review Action 的默认 prompt，强制「中文优先、中英双语」输出。
# 两条审查线路（免费 GLM run-summary / 深度 run）共用同一份 prompt：
# docs/configs/ai-review-prompt.md（单一权威来源，避免两处漂移）。
# 强度差异由 prompt 内「按 review-command 自适应」段落 + 各自 review-command 决定。
# 路径相对仓库根目录（Action 在 checkout 后运行，根目录文件可访问）。

prompt:
  summary_prompt_files:
    - docs/configs/ai-review-prompt.md
  context_prompt_files:
    - docs/configs/ai-review-prompt.md
  inline_prompt_files:
    - docs/configs/ai-review-prompt.md

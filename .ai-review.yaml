# AI Review 自定义配置
#
# 覆盖 ai-review Action 的默认 prompt，强制「中文优先、中英双语」输出。
# 当前工作流使用 run-summary 模式（仅留一条总结评论），故重点覆盖 summary_prompt_files；
# 同时覆盖 context / inline，保证切换审查模式时语言规则仍生效。
#
# 路径相对仓库根目录（Action 在 checkout 后运行，根目录文件可访问）。

prompt:
  summary_prompt_files:
    - docs/configs/ai-review-summary-prompt.md
  context_prompt_files:
    - docs/configs/ai-review-summary-prompt.md
  inline_prompt_files:
    - docs/configs/ai-review-summary-prompt.md

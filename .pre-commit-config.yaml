repos:
  # 通用文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # logo-delivery/preview.html 为内嵌预览的大体积交付物，豁免大文件检查
        exclude: ^logo-delivery/preview\.html$
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: end-of-file-fixer
        # 品牌 SVG 资产以权威母本为准（logo-delivery/），副本须保持字节一致，
        # 避免 fixer 追加换行导致副本与母本 md5 不一致
        exclude: ^(logo-delivery/|frontend/src/assets/brand/|docs/\.vitepress/public/)
      - id: trailing-whitespace

  # Markdown 文档 lint：本地 commit 即校验文档质量，替代原先坏掉的 lint-docs Action
  # 规则与忽略见仓库根 .markdownlint.json（复用 frontend 的宽容配置）
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.13.0
    hooks:
      - id: markdownlint
        args: ['-c', '.markdownlint.json']
        exclude: ^(logo-delivery/|node_modules/|frontend/node_modules/|\.vitepress/dist/|docs/\.vitepress/)

  # Ruff: 统一的 lint + 格式化（替代 isort + flake8 + yapf）
  # 品牌交付目录 logo-delivery/ 的生成脚本为一次性工具，豁免项目 lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^logo-delivery/
      - id: ruff-format
        exclude: ^logo-delivery/

  # 本地守卫：禁止提交被清空/误删的 all_pb.csv 历史基线数据
  # （曾误判为 cache 被清空到 2 行，导致温度计分母缺失。见 #821）
  # 本地守卫：禁止提交含 GBK→UTF-8 双重编码乱码（mojibake）的源文件
  # （26 个 legacy/ 前端重构笔记因编码错误全部不可读。2026-08-10）
  - repo: local
    hooks:
      - id: guard-all-pb
        name: guard all_pb.csv baseline
        entry: python scripts/guard_all_pb.py
        language: python
        files: ^backend/app/services/thermometer/data/all_pb\.csv$
        pass_filenames: false
      - id: guard-mojibake
        name: guard Chinese mojibake in source files
        entry: python scripts/guard_mojibake.py
        language: python
        # 覆盖全部文本类型（此前仅 .md/.py/.vue，漏掉前端 .ts/.tsx/.js/.json、
        # 配置 .yml/.yaml/.sh/.ps1、样式 .css/.scss、标记 .html/.svg 等高频 GBK 源）
        files: \.(md|py|vue|ts|tsx|js|jsx|json|yml|yaml|html?|css|scss|sass|sh|ps1|bat|cmd|toml|xml|svg|mjs|cjs)$
        pass_filenames: true
        additional_dependencies: [ftfy]
      # 提交信息同样会被 PowerShell/GBK 误编码成乱码（本会话真实事故），
      # 必须在 commit-msg 阶段拦截，否则乱码会随 git 历史永久入库
      - id: guard-mojibake-commit-msg
        name: guard Chinese mojibake in commit message
        entry: python scripts/guard_mojibake.py --check-message
        language: python
        stages: [commit-msg]
        additional_dependencies: [ftfy]
      # 推送前闸门（AI Tool Hooks 层）：在 git push 前扫描待推送提交的文件与
      # 中文提交信息，发现 GBK 乱码即拦截。覆盖裸 git push 与 AI 工具的推送路径。
      # 启用：pre-commit install --hook-type pre-push（开发者本地可选；CI 与
      # commit_changes.py 自校验为必过层）
      - id: guard-mojibake-prepush
        name: guard Chinese mojibake before push
        entry: python scripts/guard_mojibake.py --pre-push
        language: python
        stages: [push]
        pass_filenames: false
      - id: guard-layout-widths
        name: guard hardcoded layout container widths
        entry: python scripts/guard_layout_widths.py
        language: python
        # 容器宽度必须以 --layout-* 令牌引用（#1506）：
        # 此前 1280px / 1400px 两套硬编码散落 13+ 个文件，导致页头/页脚与内容区错边
        files: ^frontend/src/.*\.(vue|ts|tsx|js|jsx|css|scss|sass)$
        exclude: ^frontend/src/style/colors\.css$
        pass_filenames: true
      - id: guard-breakpoints
        name: guard raw breakpoint media queries
        entry: python scripts/guard_breakpoints.py
        language: python
        # 断点必须走 @use "@/style/breakpoints" 的 bp.below()/bp.above()（#1571）：
        # 此前 design.md 断点表零实现、业务文件手写 470~1180 十余个互不相同的阈值，
        # 与 Tailwind 的 md:/lg: 前缀并存成三套词汇
        files: ^frontend/src/.*\.(vue|css|scss|sass)$
        exclude: ^frontend/src/style/_breakpoints\.scss$
        pass_filenames: true
      - id: forbid-bp-input
        name: forbid APIFlask @bp.input() auto-paradigm
        entry: python scripts/forbid_bp_input.py
        language: python
        files: ^backend/app/.*\.py$
        pass_filenames: false
      - id: guard-error-envelope
        name: guard error envelope (error_code present)
        entry: python scripts/guard_error_envelope.py
        language: python
        # 错误响应三字段信封（#1610）：视图内自建错误响应必须带 error_code。
        # 此前 63 处只有 {data, message}，temperature 3 处连 data 都缺
        files: ^backend/app/.*\.py$
        pass_filenames: false
      - id: check-api-conventions
        name: check API conventions (trailing slash + api.md coverage)
        entry: python scripts/check_api_conventions.py
        language: python
        # 尾斜杠（#1611，conventions §2.6 冻结区，含明文豁免清单）与 api.md 全量端点段一致性
        # 此前 18 个端点无尾斜杠、api.md 只列 30/131 条
        files: ^(backend/app/domains/.*\.py|docs/spec/api\.md)$
        pass_filenames: false
      - id: guard-layer-direction
        name: guard backend layer dependency direction
        entry: python scripts/guard_layer_direction.py
        language: python
        # 分层依赖方向（#1607）：R1 core→domains/models、R2 services→domains.views、
        # R3 domains.models|schemas→services、R4 跨域 views 互引。
        # 此前 core.auth 直接持有 User、core.database 把种子写在基础设施层，
        # 且 ledgers.views 直接引用 positions.views，全靠函数内 import 掩盖
        files: ^backend/app/(core|services|domains)/.*\.py$
        pass_filenames: false
      - id: check-view-thickness
        name: guard view layer thickness
        entry: python scripts/check_view_thickness.py
        language: python
        # 视图层只做 HTTP 编排（#1606）：业务规则（校验链/状态机/守恒校验/合并策略）与
        # 事务必须落在 services；视图文件行数、query/commit 次数、单函数行数只减不增
        files: ^backend/app/domains/.*/views\.py$
        pass_filenames: false

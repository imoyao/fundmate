repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.4.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-json
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-toml
# https://pycqa.github.io/isort/docs/configuration/pre-commit.html
- repo: https://github.com/pycqa/isort
  rev: 5.8.0
  hooks:
  - id: isort
- repo: https://github.com/PyCQA/flake8
  rev: 3.9.0
  hooks:
  - id: flake8
    args: [--max-line-length=120,--exclude=migrations/*,.git,__pycache__,old,build,dist, --ignore=D401,D202,E226,E302,E41,--max-complexity = 10]
    additional_dependencies:
    - flake8-tidy-imports
- repo: https://github.com/pre-commit/mirrors-yapf
  rev: v0.31.0   # Use the sha / tag you want to point at
  hooks:
  - id: yapf
    name: yapf
    language: python
    entry: yapf
    args: [-i, -vv]
    types: [python]
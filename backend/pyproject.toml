[project]
name = "showbuy"
version = "0.1.0"
description = "个人投资记账系统 V2 - 重构版"
authors = [
    { name = "imoyao", email = "immoyao@gmail.com" },
]
dependencies = [
    "apiflask>=3.1.0",
    "sqlalchemy>=2.0.49",
    "pydantic>=2.13.4",
    "PyJWT>=2.9.0",
    "uv>=0.11.11",
    "flask>=3.1.3",
    "uvicorn>=0.46.0",
    "flask-cors>=6.0.2",
    "pytest>=9.0.3",
    "loguru>=0.7.3",
    "xalpha @ git+https://gitee.com/imoyao/xalpha.git@master",
    "fake-useragent>=2.2.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "charset-normalizer>=3.4.7",
    "chinese-calendar>=1.11.0",
    "pendulum>=3.2.0",
    "dotenv>=0.9.9",
    "python-dotenv>=1.2.2",
    "pypinyin>=0.55.0",
    "pdfplumber>=0.11.9",
    "pyxirr>=0.10.8",
    "playwright>=1.61.0",
    "mcp>=2.0.0",
    "akshare>=1.18.81",
    "scipy==1.13.1",
    "baostock>=0.9.3",
]
requires-python = ">=3.12"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "ipython>=9.14.0",
    "invoke>=2.2.0",
    "rich>=13.0.0",
    "pip-audit>=2.10.1",
]

[tool.ruff]
# 继承原来 yapf 的配置：120 字符行宽
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# 选择规则：启用 pyflakes, pycodestyle, isort
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # Pyflakes (未使用变量、未定义变量等)
    "I", # isort (导入排序)
    "Q", # flake8-quotes (引号一致性，本节核心)
]
# 忽略特定规则，如未使用的变量
ignore = ["F841", "E501", "Q000", "Q003"]

[tool.ruff.lint.isort]
# 对应原来的 isort 配置
known-first-party = ["app"]
known-third-party = ["flask", "apiflask", "sqlalchemy", "pydantic"]
# 如果需要自定义 section 顺序，新版 ruff 要求使用字典格式：
# section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# Ruff 的 formatter 默认类似 Black
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "slow: 慢速测试，需要联网或耗时较长",
]

[tool.pdm]
[[tool.pdm.source]]
name = "pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
verify_ssl = true

[tool.pdm.dev-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pdm.resolution.overrides]
sqlalchemy = ">=2.0"
pandas = ">=2.0"
numpy = ">=1.24,<2.0"

[tool.pdm.scripts]
# 元数据/市场温度(含乖离度)同步：pdm run sync --all / pdm run sync --job temperature
sync = "python app/tools/sync_metadata.py"

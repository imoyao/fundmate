[flake8]
ignore = D401,D202,E226,E302,E41,W291,W504,E501,ISC002,Q001,Q000
max-line-length = 120
exclude = migrations/*,.git,__pycache__,old,build,dist,FundCrawler,*/libs/*
max-complexity = 10
select = B, E, F, W, B9, ISC, Q0
inline-quotes = single
multiline-quotes = double
docstring-quotes = double
avoid-escape = True

[isort]
;https://pycqa.github.io/isort/
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
balanced_wrapping = True
ensure_newline_before_comments = True
line_length = 120
known_flask = flask,flask_wtf,wtforms,flask_login,flask_bcrypt,flask_caching,flask_migrate,flask_sqlalchemy,flask_static_digest,apiflask,flask_praetorian
known_test = pytest,webtest,factory
sections = FUTURE,STDLIB,FLASK,TEST,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
;[domdfcoding/yapf-isort: yapf 💌 isort](https://github.com/domdfcoding/yapf-isort)
[yapf]
based_on_style = pep8
spaces_before_comment = 2
split_before_logical_operator = true
;#744
BLANK_LINE_BEFORE_NESTED_CLASS_OR_DEF = true
COLUMN_LIMIT = 120

[mypy]
check_untyped_defs = True
no_implicit_optional = True
[mypy-boto3]
ignore_missing_imports = True
[mypy-babel.*]
ignore_missing_imports = True

[tool:pytest]
# Options for py.test:
# Specify command line options as you would do when invoking py.test directly.
# e.g. --cov-report html (or xml) for html/xml output or --junitxml junit.xml
# in order to write a coverage file that can be read by Jenkins.
addopts =
	--doctest-modules
	--verbose
norecursedirs =
	dist
	build
	.tox
testpaths =
	fundmate
	tests

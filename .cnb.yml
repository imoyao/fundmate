# CNB 流水线配置（duoduobei/fundmate）
#
# 目前只有一条流水线：GitHub Issues → CNB Issues 的**每日增量镜像**。
#
# 背景（源 issue `#2`）：CNB 侧没有 GitHub 的 issue 视图，讨论散在两处。
# 2026-10-11 做过一次全量手工同步（107 张卡，CNB #5~#112），但那是一次性的：
# GitHub 之后新开的卡不会再出现，两侧很快又各说各话。本流水线把那个动作
# 固化成可重复执行的增量作业，脚本是 scripts/bridge/github_cnb_issues.py。
#
# 设计取舍（详见 scripts/bridge/github_cnb_issues.py 的文件头）：
#   - 单向：只 GitHub → CNB，不回写；双向会在状态不一致时互相打架；
#   - 只增不覆盖：已存在的镜像卡永不改动；
#   - 不同步关闭态：GitHub 关了 CNB 不自动关，避免「CNB 侧看不到活跃讨论」的误判；
#   - 幂等键 = 镜像卡正文里的 `GitHub 编号：#N`，辅以 scripts/bridge/github_cnb_state.json 缓存。
#
# 本地跑法：
#   export CNB_TOKEN=<你的 token>
#   python scripts/bridge/github_cnb_issues.py --dry-run     # 先看要建哪些
#   python scripts/bridge/github_cnb_issues.py --apply       # 真正创建
#
# 更正通道（#120）：镜像卡是**只增不覆盖**的，正文永远停在建卡快照。
# 发现镜像卡正文失实时，**不要改正文**，用下面这条在它的评论区追加一条更正
# （默认 dry-run，加 --apply 真正发布；幂等，重复执行只发一次）：
#   python scripts/bridge/mirror_correction.py list --cnb <编号>
#   python scripts/bridge/mirror_correction.py add --cnb <编号> --date <YYYY-MM-DD> \
#       --correction '❌ 正文「x」→ ✅ 实际「y」（依据：PR #115）' --apply
# 这是人工动作，不挂 cron —— 更正由发现者发起，不该由定时任务代劳。
#
# 状态回流（#117 硬要求 ②）：GitHub 关了原卡，CNB 这边一个字都不变——
# 读者在 CNB 看到一张「还活着」的卡，实际那件事早已结案。cron 里挂了这一步：
# 在镜像卡评论区追加一条「状态回流」评论 + 挂 `GitHub 已关闭` 标签 + **关闭卡片**。
# **口径已于 2026-10-13 由用户在 CNB #171 改为 B（自动关）**：D48 的「标记不关」
# 让「卡片状态」与「事实状态」永久劈成两半，看板越用越不可信；讨论被埋是可接受代价
# （评论不删、卡只是变灰，需要时 `cnb issues open` 重开）。反向仍不回流。
# 只想标记不想关（人工 triage）时加 `--no-close`。
#   python scripts/bridge/mirror_state_sync.py --report    # 只报告漂移
#   python scripts/bridge/mirror_state_sync.py --apply      # 真正回流并关闭（幂等）

# 公共片段：两条触发方式跑的是同一套环境与命令，用锚点避免抄两遍。
.mirror-job: &mirror-job
  runner:
    # 纯标准库脚本，收窄核数省额度
    cpus: 2
  docker:
    image: python:3.12-slim
  env:
    # CNB_TOKEN 由平台注入（构建凭证，建卡用）；
    # GITHUB_TOKEN 可选，不设则走匿名 API（60 次/时/IP，够用）。
    GITHUB_REPO: imoyao/fundmate
  stages:
    - name: 增量建卡
      script: |
        # ⚠️ 必须回声退出码：建卡在 GitHub 匿名限额（60 次/时/IP）被同流水线前序作业耗尽时
        # 返回 1（「拉不到 ≠ 没有」，源 CNB #179 / #171）。裸跑的话失败只体现在「stage 红了」，
        # 日志里没有一句人话，而它又与后一步的健康绿混在一起，很容易被读成「同步过了」。
        # 故显式打印一行「结论不可信」。
        set +e
        python scripts/bridge/github_cnb_issues.py --apply
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "⚠️ 增量建卡返回 $rc（多为 GitHub 数据不完整 / 限额）——本轮结论不可信"
        fi
        exit 0
    # 状态回流（#117 硬要求 ②，2026-10-13 起改为 B 口径）：GitHub 已关闭、CNB 镜像卡
    # 还开着 ⇒ 评论 + 挂 `GitHub 已关闭` 标签 + **关闭卡片**。
    # 幂等键写进评论正文（评论只发一次）；**关卡与评论分开判**——D48 时代发过评论
    # 却没关的存量卡会被补关（「评论已发 ≠ 卡已关」）。
    # 反向（GitHub 开、CNB 关）不回流：CNB 侧关卡是人的决定。
    #
    # ⚠️ `|| true` 只遮「已回流过的幂等跳过」这类良性非 0；**「数据不完整」(#171) 必须可见**
    # ——脚本在拿不全 GitHub 数据时会显式打印「数据不完整」并返回 1，若这里吞掉，
    # 就退回了「一直绿、一直没干活」的假绿形态。故改成回声退出码 + 只在日志里标红，
    # 不拦构建（建卡才是主任务，收尾信号不该把建卡一起拖红）。
    - name: 状态回流（GitHub 已关闭 → CNB 标记并关闭）
      script: |
        set +e
        python scripts/bridge/mirror_state_sync.py --apply
        rc=$?
        if [ $rc -ne 0 ]; then
          echo "⚠️ 状态回流返回 $rc（多为 GitHub 数据不完整，#171）——本轮结论不可信，请查上方日志"
        fi
        exit 0
    # 引用时效自检（#118，2026-10-11 起认评论区更正 —— #123）：CNB 侧已成型的镜像卡里，
    # `path:line` 引用可能已随代码失效，而镜像卡「只增不覆盖」意味着正文永远不会被纠正
    # ——#106 就是活例子（引用的行已在 #980 拆页时删除，卡面读过两个版本）。
    # 判据必须读评论区：`#120` 的更正通道是「正文不动、更正写评论区」，只看正文会
    # **永远报红**（修好了也红，红却不指向任何还需动手的事 = 假红，与 #118 的假绿同族）。
    # 故报告分「⚠️ 待更正 / ✅ 已更正」两类，只把还没记过账的列为待办。
    # **只报告不拦构建**（`|| true`）：建卡才是主任务，自检是信号，不该把建卡一起拖红。
    - name: 引用时效自检（认评论区更正，只报告）
      script: |
        python scripts/bridge/check_mirror_refs.py --report || true
    # 分支分叉自检（CNB #123 §一「中等」建议）：`main` 与 `dev` 若互不包含，
    # 就会出现「整改代码在 dev、会被执行的代码在 main」——**写完了，跑的不是它**，
    # 且没有任何信号提示。本节点把「靠人肉 git log 发现分叉」换成一条命令。
    # 只读本地 git（**不 fetch**，故不依赖网络）；带 `|| true` 明确「信号不是门禁」。
    # 带 `--explain`：卡面 §一 建议 3 问的是「为什么 dev 会完全不含 main 的这一个 commit」——
    # 只报「分叉了几个」修不了根因，故额外列出稳定分支独有的提交清单，
    # 并**离线试算发版会不会冲突**（`git merge-tree`，不碰工作区）。
    # 有意**不猜**「哪个提交来自 GitHub、哪个来自 CNB」：实测提交信息、`refs/fetched`、
    # `sync/mirror` 三条路都答不了，猜错会让报告指向错误的处置。
    #
    # ⚠️ 判据（CNB #179，2026-10-14 二次修正）：**不要**把「`main` 独有提交数 > 0」当红灯——
    # 本仓发版滞后是正常态（`dev` 一直在前进），拿它报红就是把红灯喊成狼来了。
    # 现在两层判据：① 提交级二分（合规发版 merge / 绕过 dev 的提交）；
    # ② 内容级用 `git cherry`（补丁等价）—— **不是** `git diff`，后者在交叉合并下假红。
    # 退出码 1 = 有新形态；「拿不到输入」一律按红，不降级成正常。详见
    # docs/dev/github-cnb-mirror.md §11。
    - name: 分支分叉自检（只报告）
      script: |
        python scripts/bridge/check_branch_divergence.py --report --explain || true

    # 跨仓 dev 分叉自检（源 CNB #269，2026-10-14）：上面那条比的是**同一个仓库内部**的  cross-repo-ref-allow
    # `main ← dev`；而 2026-10-11 ~ 10-14 真正出事的是**跨仓**那一维 —— CNB `dev` 停了、
    # GitHub `dev` 一直在走，两边各自长出对方没有的改动（30 vs 89），**三天没有任何信号**。
    # 后果不是理论风险：push 不开 `force`（是护栏，对的），于是「CNB dev → GitHub dev」
    # 永远非快进、永远被拒；pull 又拉不动 ⇒ **两边都不动，死锁**。
    # 一句话：**「分叉了几笔」在仓内自检里问不出来，因为另一半在另一个仓库。**
    #
    # 判据与 #179 同源（**只用 `git cherry` 补丁等价**，双向各跑一次）：
    #   - 两侧都空      ⇒ 未分叉（放行正常落后）→ 退 0；
    #   - 只有一侧有 `+` ⇒ 单侧领先，**正常落后，不红** → 退 0；
    #   - **两侧都有 `+`** ⇒ 真双向分叉 ⇒ 退 1（要报的正是这个）。
    # 「拿不到输入」（fetch 失败 / ref 缺失）⇒ 打印「结论不可信」并退 2，**不得**降级成 0。
    #
    # 本节点会 **fetch** 两个 remote 的 dev（与上面那条「纯离线」不同），故**不挂进
    # `ci.yml`**（PR 门禁不该依赖外网与 GitHub 凭据）。这里网络与凭据都具备。
    # 与其它自检一致：**只报告不拦构建**，但退出码要回显 —— 否则失败态就地消失（#171 假绿）。
    - name: 跨仓 dev 分叉自检（只报告）
      script: |
        set +e
        python scripts/bridge/check_cross_repo_dev_divergence.py --report
        rc=$?
        if [ $rc -eq 1 ]; then
          echo "⚠️ CNB dev 与 GitHub dev 已**双向分叉** —— 同步会一直空转，需要一次人工收敛（否则差异逐日累积）"
        elif [ $rc -eq 2 ]; then
          echo "⚠️ 跨仓 dev 自检**拿不到输入**（fetch 失败）—— 本轮结论不可信，不得认为「已对齐」"
        fi
        exit 0

# 定时任务必须挂在具体分支下（不能放 $ 兜底），故这里显式写 main。
main:
  # 每日 18:00 UTC（＝北京次日 02:00）：issue 不是时效数据，
  # 一天一次足够，也省构建分钟数。
  "crontab: 0 18 * * *":
    - name: GitHub issue 增量镜像
      <<: *mirror-job

  # ===== 双向代码同步（CNB <-> GitHub，git-sync 插件）=====
  # 凭据放密钥仓库 fundmate-secret 的 vars.yml：GIT_USERNAME / GITHUB_PAT
  # （PAT 需 repo 权限；参考 https://cnb.cool/cnb/plugins/tencentcom/git-sync）
  #
  # ⚠️ 凭据引用必须挂在**插件任务（stage 元素）内部**、与 `image` 平级，**不能挂流水线级**；
  # 且本仓要用 `${GIT_USERNAME}` 求解，所以方式必须是 `imports`（不是 `settingsFrom`）。
  # CNB #148 两轮实测把这三种形态的前两种都踩了：
  #
  # ① 挂**流水线级** `imports`（`push:` 下一层、`stages:` 之上一行）⇒ 死在 Prepare：
  #        vars.yml declares allow_images and can only be referenced by plugin tasks.
  #    因为 vars.yml 必须声明 `allow_images: [tencentcom/git-sync]`（否则插件读不到密钥），
  #    而流水线级引用**不算「插件任务」**，平台判定「声明了 allow_images 却没在插件任务里用」
  #    → 直接拒绝，连 stage 都进不去。
  #
  # ② 改挂**插件任务级 `settingsFrom`** ⇒ Prepare 过了、进得了 stage，但推不上去：
  #        fatal: could not read Username for 'https://github.com'
  #    `settingsFrom` 的语义是「从文件**加载插件参数**」(KEY 直接当插件参数名)，**不注入环境变量**；
  #    而 `settings` 里写的 `${GIT_USERNAME}` 是环境变量替换，此时无从解析 ⇒ 插件拿到空的
  #    username/password ⇒ `setup_https()` 跳过写 `~/.git-credentials` ⇒ git 交互式要用户名而失败。
  #
  # ✅ 正确形态：**插件任务级 `imports`**（与 `image` 平级）。依据 CNB 文档
  #    《文件引用 › image 检查说明》：镜像任务参数「可通过 `settingsFrom` 设置，也可通过
  #    `imports` 引入后以**环境变量**方式设置，**两种方式均视为插件任务引用文件**」。
  #    即：插件任务级 `imports` 同样是合规的插件引用（`allow_images` 检查通过），
  #    且它**注入环境变量**，`settings` 里的 `${GIT_USERNAME}` 才解析得出。
  #    这也是 git-sync 插件作者给的官方示例形状（其 example.yml 即此法）。
  #
  # 判断口诀：**「引用挂在哪」决定合规（必须插件任务内），「用 imports 还是 settingsFrom」
  # 决定 `${VAR}` 能不能解析（要解析就用 imports）。** 本仓两个都要 ⇒ 插件任务级 imports。
  #
  # ⚠️ vars.yml 必须是 **YAML**（`KEY: value`），不是 `.env` 的 `KEY=VALUE`。
  # 写成 `GIT_USERNAME=imoyao` 这种等号风格，YAML 解析器会先在首行得到一个纯量、
  # 次行又一个，到第三行 mapping 时直接报 `parse yaml failed … (3:12)`，
  # 流水线死在 Prepare，且报错里**不含 not found**。
  # 模板与完整踩坑记录见 docs/ops/git-sync-secret-vars.example.yml。
  #
  # 另注：该文件在 Secret 仓库，API/token 一律 403（`Secret repos do not support
  # token access`）——**只能人工在 Web 界面改**，改不进 PR，故模板落在代码仓里。
  # push 模式不开 force：绝不肯把 GitHub 独有提交冲掉（即「反向护栏」）。
  # 回归网：scripts/guard_secret_imports.py + scripts/guard_git_sync_push_scope.py
  #        （均并入 ci.yml 的 layout_guard job）。
  #
  # ⚠️ **目标分支收窄为 `dev`，不再 `--all`（CNB #167 / #172，2026-10-13）**：
  #    插件不指定 `branch` 时执行 `git push target --all`，会把 CNB 的 `main` 一并推给 GitHub；
  #    而 GitHub 侧 `main` 是权威源（只由发版 PR 推进）⇒ 两侧 `main` 各自长出独有提交，
  #    分叉由此产生（实测 2026-10-13：CNB `main` 独有 31 / GitHub `main` 独有 27，交集 0）。
  #    `branch: dev` 是插件**唯一**能表达「只推指定分支」的参数形态；`main` 从此不经此路外流。
  #    **不要**删掉 `branch`、也不要改回不写 —— 那就是回到 `--all`（守卫会拦）。
  #    功能分支的同步见下方 `"**/!(main|dev)"` 段。
  #
  # ⚠️ 还有第二层（CNB #269 之前没人踩到，因为它是**静默**的）：**挂载位置决定工作区**。
  #    这三条作业原先挂在 `main:` 键下，于是 `dev` 的 push 构建里**根本没有它们**
  #    （`get-build-stage` 返回「没有查询到该stage信息」确认过），而 `main` 的 cron 构建里
  #    工作区只有 `main`、插件找不到 `dev` 就跳过。两层叠加 ⇒ **三天一次都没推成，全绿**。

# ===== CNB `dev` ↔ GitHub `dev` 双向同步（git-sync 插件）=====
# ⚠️ **必须挂在 `dev:` 分支键下**（CNB #269，2026-10-14）。这里的「挂在哪个分支键下」
# 不是风格问题，它决定 runner 检出哪个分支 —— 而插件只推「工作区里存在的分支」：
#   - fetch 命令是 `git fetch origin "refs/heads/<分支键>"`；checkout 是
#     `git checkout -f -B "<分支键>" <sha>`（runner 日志原文）；
#   - 所以作业挂在 `main` 下时，工作区只有 `main`，插件拿着 `branch: dev` 找不到，
#     打一行 `Warning: Branch dev does not exist locally, skipping push` 就跳过，
#     而**构建仍报 success** —— 三天里一次都没推成，却是绿的（CNB #269 实测）。
#   - 更隐蔽的一面：挂在 `main` 下 ⇒ **`dev` 的 push 根本不带这个 job**
#     （`get-build-stage` 查「同步到 GitHub（仅 dev + 标签）」返回「没有查询到该stage信息」）。
# 判据见 `scripts/guard_git_sync_push_scope.py` 判据 5（新增）。
#
# 功能分支 → 上游同名分支的段见本文件末尾 `"**/!(main|dev)"`：那里用 `CNB_BRANCH`
# 精确推**当前**分支，不像 `--all` 那样把 `main` 一起带上。
dev:
  push:
    - name: 同步到 GitHub（仅 dev + 标签）
      # ⚠️ 必须是带 name 的 job（列表 + `- name:`），不要退回裸 `stages:`：
      # 裸 stages 的 job 在构建详情页查不到 stage，绿了也不知道推没推上去（假绿，CNB #172）。
      stages:
        - name: 同步到 GitHub（仅 dev + 标签）
          image: tencentcom/git-sync
          # 凭据走**插件任务级** imports（见上方说明：必须与 image 平级，且要用 imports 才能
          # 让 settings 里的 ${VAR} 解析；不要改回流水线级 imports，也不要改成 settingsFrom）
          imports:
            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/vars.yml
          settings:
            target_url: https://github.com/imoyao/fundmate.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GITHUB_PAT}
            # 只推 dev；main 不在其列（GitHub 权威源自己推进）
            branch: dev
            push_tags: true
  # ---- 触发器结构：`crontab` / `push` 一律写成「job 列表 + 命名 stage」----
  # ⚠️ CNB #167 实测：把 `stages:` **直接**挂在 `"crontab: ..."` 下（没有 `- name:` 包一层的
  # job 对象）时，该 stage 在构建详情的 `get-build-stage` 里**查不到**
  # （用 `stage-0` / `stages` / 各类 id 试过，全报「没有查询到该stage信息」）。
  # 后果不是「样式不统一」，而是**作业内部到底推没推成功看不出来** ——
  # `crontab: 30` 因此长期「挂旧 sha、实际没推上去、却报绿」，比红灯更危险。
  # 故此处两条 cron 与 `push:` 统一为 `- name: <job 名> / stages: [...]` 形态。
  # （job 名只用于构建页展示；stage 名才是 get-build-stage 的查询锚点，两者都要写。）

  # 每小时从 GitHub 拉回 **dev**（闭合 GitHub -> CNB）
  "crontab: 0 * * * *":
    - name: 从 GitHub 拉取（仅 dev + 标签）
      # ⚠️ 必须用「带 name 的 job」形态（列表 + `- name:`），不要退回裸 `stages:`。
      # 裸 stages 的 job 在构建详情里**查不到 stage**：外部看是绿的，实际推没推上去无从判断
      # —— 比红灯更危险的「假绿」（CNB #172 实测）。命名 job 才会在详情页可见。
      stages:
        - name: 从 GitHub 拉取（仅 dev + 标签）
          image: tencentcom/git-sync
          # 凭据走**插件任务级** imports（见上方说明：必须与 image 平级，且要用 imports 才能
          # 让 settings 里的 ${VAR} 解析；不要改回流水线级 imports，也不要改成 settingsFrom）
          imports:
            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/vars.yml
          settings:
            target_url: https://github.com/imoyao/fundmate.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GITHUB_PAT}
            sync_mode: pull
            # ⚠️⚠️ pull 方向**同样必须写 `branch`**（CNB #167 收尾，2026-10-14）。
            # 「pull 只拉不推、不会分叉」是**直觉错误** —— 插件源码 `entrypoint.sh` 里
            # pull **总会** `git push origin <b> --force` 写回本地 origin；
            # 不写 `branch` 时它走 else 分支，取 target 的**全部**分支逐个处理 ⇒
            # **GitHub 的 `main` 被 force 覆盖到 CNB 的 `main`**（不看是否 fast-forward）。
            # 这与既定口径直接冲突：**CNB 的 `main` 与 GitHub 的 `main` 没有任何关系**
            # （CNB `main` 只由 CNB 自己的发版 PR 推进，既不外推也不被覆盖）。
            # 写 `branch: dev` 后走 if 分支：只处理 `dev`，`git push origin dev --force`
            # 只覆盖 CNB 的 `dev` —— 这正是「CNB 拉 GitHub 的代码」该有的范围。
            # 判据已并入 `scripts/guard_git_sync_push_scope.py`（pull 形态也须显式 branch）。
            branch: dev
            push_tags: true
  # 每小时兜底：**只推 `dev`**，不再 `--all`（CNB #167 / #172）。
  # cron 事件下没有「被推的功能分支」上下文（`CNB_BRANCH` 恒为该段所挂分支），
  # 故功能分支不由 cron 兜底 —— 那条路由 `push:` 事件下的 `branch: ${CNB_BRANCH}` 覆盖。
  "crontab: 30 * * * *":
    - name: 同步到 GitHub（每小时兜底，仅 dev）
      # ⚠️ 同上：必须是带 name 的 job，避免 stage 查不到造成假绿。
      stages:
        - name: 同步到 GitHub（每小时兜底，仅 dev）
          image: tencentcom/git-sync
          # 凭据走**插件任务级** imports（见上方说明：必须与 image 平级，且要用 imports 才能
          # 让 settings 里的 ${VAR} 解析；不要改回流水线级 imports，也不要改成 settingsFrom）
          imports:
            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/vars.yml
          settings:
            target_url: https://github.com/imoyao/fundmate.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GITHUB_PAT}
            # 只推 dev；main 不在其列
            branch: dev
            push_tags: true

"**/!(main|dev)":
  push:
    - name: 同步当前功能分支到 GitHub
      # ⚠️ 同上：带 name 的 job 才在构建详情页可见。
      stages:
        - name: 同步当前功能分支到 GitHub
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/vars.yml
          settings:
            target_url: https://github.com/imoyao/fundmate.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GITHUB_PAT}
            # 只推「触发本次构建的那条分支」；cron 不走此段，故不会误推 dev/main
            branch: ${CNB_BRANCH}

# =============================================================================
# 兜底挂载：`$` 段 —— **任何分支**上的变更都跑一次建卡作业
# =============================================================================
#
# WHY 要有这一段（CNB #172 的第二个动作）
# ----------------------------------------
# 建卡作业原先只挂在 `main` 的 `crontab: 0 18 * * *` 下。这带来一个用户实际撞到的缺口：
#
#   有人在 `feat/*` 分支上开了一张 CNB 本地卡 → 这张卡**永远不会**被看见，
#   因为作业只跑在 `main` 上、且一天一次。用户的原话是：
#   「我们有一些其他的分支在实现其他的功能，这个 issues 是不是无法感知到这一块？」
#
# 答案是「感知不到」，而且不是理论问题。`$` 段的意义正是**与分支无关**——
# 无论 push 到哪条分支，这次构建都会带上本作业，于是：
#
#   - **新卡当天就能被扫到**（原来最坏要等一天，且必须 `main` 有动静）；
#   - **新评论当天就能回写**（回写作业在 GitHub 侧按小时拉，这里只负责把卡建出来）；
#   - 不再依赖「别人记得往 main 合」——这条依赖本身就不该存在。
#
# 边界（为什么不是「每 push 一次跑一轮全量」）
# -------------------------------------------
# `github_cnb_issues.py` 与 `mirror_state_sync.py` 都是**幂等**的：前者靠
# `GitHub 编号：#N` 判重，后者靠评论里的 `状态键：`。所以重复跑的成本是
# 「多几次 API 调用」，不是「重复建卡 / 重复发评论」——这是本段敢挂 push 的前提，
# 也是为什么**只挂这两条**：其余自检（引用时效、分支分叉）在 `main` 的 cron 里跑即可，
# 它们读的是「仓库整体状态」，push 到功能分支时结论并不会更新。
#
# ⚠️ `$` 段**不能**挂 git-sync：`$` 下没有「当前分支」上下文，
# `CNB_BRANCH` 在 cron/push 形态下不可靠，误推 `main` 就是分叉（守卫会拦，见 #167/#172）。
# 功能分支的代码同步仍由 `"**/!(main|dev)"` 段的 `push:` 负责。

# =============================================================================
# 认领同步：CNB 侧在干活 → GitHub 侧挂 `CNB 处理中`（源 CNB #179）  <!-- cross-repo-ref-allow -->
# =============================================================================
#
# 场景（用户 2026-10-14 在 CNB #179 提的）：
#   我们已经把 CNB 当成一个 contributor，但 GitHub 上的人**不知道** CNB 正在改哪张卡。
#   两边可以同时动手，最后合并时才发现撞了。实测已经发生过一次：CNB 的 PR #180 与
#   PR #181 是同一张卡（CNB #179）的**两套并行解法**，最后要人工逐处消解冲突。
#
# 为什么只能这样做（先把「做不到」说清，免得下一个人再来问一遍）
# --------------------------------------------------------------
# 用户的最初诉求是「**实时**感知，不要每小时拉或推」。这个诉求被**凭据拓扑**挡住了：
#
#   - CNB 构建 → 写 GitHub：**本仓打通了**（凭据来自 Secret 仓库 `fundmate-secret`
#     的 `GITHUB_PAT`，与 git-sync 同一份；挂**插件任务级**是 §13.1 定死的形态）。
#     ⚠️ 注意区分：从前那句「CNB 构建环境没有 GitHub 凭据」指的是**手工 `git push`**
#     （`env` 里只有 `CNB_*`，所以那条路确实不通）；走**插件任务 + Secret imports**
#     这条路是通的，git-sync 三个方向全在跑就是证据。
#   - 但**触发**只能是 push / cron：CNB 侧收不到 GitHub 的 webhook（没装 GitHub App），
#     所以「GitHub 上有人动了那张卡」这件事**叫不醒** CNB 的流水线。
#
# 于是把方向掰过来：**「实时」的那一半放在 GitHub 侧**（它能订阅自己的事件），
# CNB 侧只负责「我这边有动静时顺手报一次」。
#
#   | 方向 | 谁驱动 | 延迟 |
#   |---|---|---|
#   | GitHub 侧有人动手 → CNB 镜像卡评论区 | `.github/workflows/claim-sync.yml` 订阅 issues/PR 事件 | **秒级** |
#   | CNB 侧有人动手 → GitHub 原卡挂标签 | 本段（`$` 段 push，任何分支） | 分钟级（跟着 push 走） |
#
# 为什么挂在 `$` 段（而不是 `main` 的 cron）
# ------------------------------------------
# 认领是**「有人正在干活」**这件事的影子，而「干活」= push。挂在 `$` 段意味着
# **任何分支一有 push 就顺手报一次**——这正是「有动静就报」，而不是「每小时巡逻」。
# 挂 cron 反而更差：cron 只能挂具体分支（平台限制），会退化成「一小时一次」。
#
# 为什么这里可以挂插件（上一段刚说了 `$` 段不能挂 git-sync）
# ---------------------------------------------------------
# 那条禁令的理由是 **`CNB_BRANCH` 在 `$` 下不可靠 ⇒ 可能误推 `main`**。
# 本任务不推任何东西：它只**读** CNB（匿名 / CNB_TOKEN）、**写** GitHub 的 issue 标签。
# 没有 `branch` 参数，也就没有 `main` 可误推。
# `scripts/tests/git_sync_push_scope.test.js` 里那条「`$` 段不得出现 `tencentcom/git-sync`」
# 断言**依然成立**（本任务用的是 http-request 插件），不要去放宽它。
#
# 幂等（敢挂在每次 push 上的前提）
# --------------------------------
#   - 标签：GitHub `POST /labels` 原生幂等，重复挂不报错、不会重复；
#   - 评论：正文末尾带隐藏标记 `<!-- cnb-claim: github=N prs=… -->`，
#     发之前先把目标 issue 的评论扫一遍收标记 ⇒ **同一事实只发一次**。
#   所以重复跑的成本是「多几次 API 调用」，不是「重复刷屏」。
#
# 凭据与「拿不到就大声失败」
# --------------------------
# `GITHUB_PAT` 走 Secret 仓库 `fundmate-secret` 的 **`claim-sync-env.yml`**（不是 `vars.yml`！）。
#
# 为什么必须另起一份（CNB #269 的真根因，2026-10-14 读完 CNB 文档定论）
# ------------------------------------------------------------------
# `vars.yml` 必须声明 `allow_images`（git-sync 是插件任务，不声明插件读不到密钥）。
# 而 CNB《文件引用 › 权限检查 › image 检查说明》有一条硬规则：
#
#     非插件任务的 image 为空字符串，无法匹配任何 glob 表达式；
#     配置文件声明了 `allow_images` 将不能被非插件任务引用。
#
# `认领同步` 同时写了 `image` + `script` ⇒ 它是**脚本任务**（image 只是跑 script 的容器）
# ⇒ 引用 `vars.yml` **必死在 Prepare**，且报错与「挂在第几层」无关：
#
#     vars.yml declares allow_images and can only be referenced by plugin tasks.
#
# #269 已经改过两轮层级（job 对象 → stage 元素）都还是同一条 —— 真根因在**文件里的
# `allow_images`**，不在挂载位置。故另起一份**不声明 `allow_images`** 的文件，
# 只留 `allow_slugs` 兜住仓库范围；`push` 是可信事件 + 非镜像任务 ⇒ 不需要 `allow_events`。
#
# ⚠️ 别再把它改回 `vars.yml`，也别为了「省一份副本」把两份合并：
#    `allow_images` 一出现，这个脚本任务就又死在 Prepare 了。
#
# ⚠️ 也不要把凭据写成 `.cnb.yml` 里的字面量 `env`：那等于把 PAT 提交进代码仓。
#    `env` 只用来传**非敏感**参数（如这里的 `GITHUB_REPO`）。
#
# 引用形态：脚本任务级 `imports`（与 `env` / `script` 平级的 stage 键）——照 CNB
# 《文件引用 › 权限检查》官方示例（密钥文件被普通脚本任务 `imports`）的形状。
# `scripts/guard_secret_imports.py` 守这条线。
#
# 缺凭据时脚本**自己以退出码 1 失败**（不是默默跳过）：认领同步的假绿形态最坏——
# 标签没挂上、而所有人都以为挂上了，然后两边照旧同时动手。
# 收尾阶段因此回声退出码（`|| true` 只拦住「不该把建卡一起拖红」，不遮信号）。
#
# 本任务**不**改 `.cnb.yml` 之外的任何东西，也不碰 CNB 的 issue（只读）。
"claim-sync": &claim-job
  runner:
    cpus: 2
  docker:
    image: python:3.12-slim

$:
  web_trigger:
    - name: GitHub issue 增量镜像（手动）
      <<: *mirror-job

  # 任何分支的 push 都跑一轮幂等建卡 + 状态回流：
  # 功能分支上开的卡、写的评论，当天就能被系统看见。
  push:
    - name: 认领同步（任何分支，幂等）
      <<: *claim-job
      stages:
        # ⚠️ 这是**脚本任务**（`image` + `script` 同时存在），不是插件任务。
        #
        # 脚本任务**可以**用 `imports` 取凭据（《脚本任务 vs 插件任务》对比表：
        # 脚本任务「✅ 自定义环境变量 / ✅ imports 导入的环境变量」），
        # **前提是被引用的密钥文件不声明 `allow_images`** —— 见本段上方「为什么必须另起一份」。
        #
        # 唯一要守的线：**引用的文件绝不能是 `vars.yml`**（那份带 `allow_images`，
        # 脚本任务引用它必将整条作业拒在 Prepare）。
        # ⚠️ 也不要改成 `settingsFrom`：那是「加载插件参数」的语义，脚本任务没有插件参数可加载。
        - name: 认领同步（CNB 在干活 → GitHub 挂 `CNB 处理中`）
          imports:
            # 脚本任务级 imports（与 env/script 平级）：密钥文件不含 allow_images，故能在脚本任务上引用。
            - https://cnb.cool/duoduobei/fundmate-secret/-/blob/main/claim-sync-env.yml
          env:
            GITHUB_REPO: imoyao/fundmate
          script: |
            # 凭据缺失：**先自证**再跑，免得脚本里所有读都 200、所有写都 401 而没人看见。
            if [ -z "${GITHUB_PAT:-}" ]; then
              echo "❌ GITHUB_PAT 未注入 —— 认领同步无法执行"
              echo "   请在密钥仓库 fundmate-secret 的 claim-sync-env.yml 里配 GITHUB_PAT"
              echo "   （模板见 docs/ops/claim-sync-secret-env.example.yml；与 vars.yml 里那份同一值）。"
              exit 1
            fi
            export GITHUB_TOKEN="$GITHUB_PAT"
            set +e
            python scripts/bridge/claim_detect.py --apply
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "⚠️ 认领同步返回 $rc——本轮结论不可信（可能是 GitHub 数据不完整，或写失败）"
            fi
            exit 0

    - name: issue 镜像兜底（任何分支，幂等）
      # ⚠️ 同步约束：本 job 与 `main` 下的 cron 跑的是**同一套命令**，
      # 改一处必须改两处（否则「功能分支上看得见、main 上看不见」或反之）。
      <<: *claim-job
      env:
        GITHUB_REPO: imoyao/fundmate
      stages:
        - name: 增量建卡（幂等，任何分支）
          script: |
            # 与 `main` 的 cron 同一套命令（改一处必须改两处），故同一条边界也在这里：
            # 建卡返回 1（GitHub 数据不完整 / 限额）必须**回声**，不得被静默成「绿」。
            set +e
            python scripts/bridge/github_cnb_issues.py --apply
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "⚠️ 增量建卡返回 $rc（多为 GitHub 数据不完整 / 限额）——本轮结论不可信"
            fi
            exit 0
        # 与 `main` 的 cron 同一条边界：`|| true` 只遮「已回流过的幂等跳过」，
        # 「数据不完整」必须可见（#171）——故回声退出码，不吞掉失败态。
        - name: 状态回流（GitHub 已关闭 → CNB 标记并关闭）
          script: |
            set +e
            python scripts/bridge/mirror_state_sync.py --apply
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "⚠️ 状态回流返回 $rc（多为 GitHub 数据不完整，#171）——本轮结论不可信，请查上方日志"
            fi
            exit 0

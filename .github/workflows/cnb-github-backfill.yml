# CNB → GitHub issue 回写（评论镜像）
#
# ## 为什么需要它
#
# `scripts/bridge/github_cnb_issues.py` 只做 GitHub → CNB 的**单向建卡**：CNB 侧
# 积累的讨论回流不到 GitHub。在 CNB 上把一张卡分析完、结论落在 CNB 评论里，
# GitHub 上的人完全看不到 —— 两侧各说各话。本 workflow 补上反向那条腿。
#
# ## 为什么由 GitHub 这边拉（而不是 CNB 那边推）
#
# CNB 构建内的环境**没有任何 GitHub 凭证**（`env` 里只有 `CNB_*`；对
# `api.github.com` 匿名 POST 返回 401），所以「CNB 去写 GitHub」在当前环境里做不到。
# 反方向的凭据是现成的：Actions 里 `GITHUB_TOKEN` 自动注入且带 `issues: write`。
# 故拓扑是 **GitHub 定时拉 CNB** —— 不需要在 CNB 存 GitHub PAT，也不要求 CNB 有写权限。
#
# ## 三条设计取舍（与镜像方向互为镜像，详见脚本文件头）
#
#   1. **单向**：只 CNB → GitHub，绝不在 CNB 建/改任何东西（CNB 侧是只读消费）；
#   2. **只增不覆盖**：已回写过的评论永不重发、永不编辑 —— 幂等键是评论末尾的
#      隐藏标记 `<!-- cnb-backfill: issue=N comment=M -->`，回写前先把目标 issue 的
#      评论扫一遍收集标记，命中即跳过；
#   3. **不自动关卡**：「GitHub 关了 → CNB 也关」以及反向都不做。关闭与否是人的判断，
#      #1177 用 PR 状态代替验收的教训已经吃过一次。
#
# ## 降频
#
# issue 讨论不是时效数据，**每日一次**足够（与镜像方向同频）。手动触发留给
# 「刚在 CNB 讨论完、想马上同步过去」的场景。

name: CNB → GitHub 回写（评论镜像）

# 并发护栏：定时与手动共用固定 group，避免两者同时跑把同一条评论发两遍
# （脚本幂等，但重复跑纯属浪费分钟数）。排队而非取消，保证回写不丢。
concurrency:
  group: cnb-github-backfill
  cancel-in-progress: false

on:
  schedule:
    # 每日 18:30 UTC（＝北京次日 02:30），与镜像 cron（18:00）错开半小时，
    # 免得两个作业抢同一个 runner 池。
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印要回写什么，不实际写入'
        required: false
        default: false
        type: boolean
      since:
        description: '只回写该时间之后的 CNB 评论（ISO8601，留空=全部）'
        required: false
        default: ''
        type: string
      limit:
        description: '本次最多回写几条（调试用，留空=不限）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  issues: write

jobs:
  backfill:
    name: 回写 CNB 评论到 GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ⚠️ 必须在跑脚本**之前**恢复：脚本读状态文件判断「哪条已回写过」，
      # 而 checkout 拿到的是仓库里的版本（可能已被别的 job 更新过）。
      - name: 恢复上一次的状态文件
        uses: ./.github/actions/save-bridge-state
        with:
          mode: restore
          path: scripts/bridge/cnb_github_backfill_state.json
          cache-key-prefix: cnb-backfill

      # 脚本是纯标准库（urllib），不需要 pip install —— 故意保持这样，
      # 免得每日作业被某个三方包的破坏性升级带崩。
      - name: 回写 CNB 评论 → GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          CNB_REPO: duoduobei/fundmate
          # 🔑 CNB 只读 token。**CNB OpenAPI 对匿名请求一律 401**（实测
          # `{"errcode":16,"errmsg":"The task will not run because the user is not
          # logged in."}`，与仓库是否公开无关）—— 旧版本漏了这个变量，脚本走匿名
          # 分支，三次定时运行（38481492722 / 38329575746 / 38179858075）全部
          # 挂在第一步拉列表，评论镜像从未跑通过一次。
          # 需先在仓库配好：Settings → Secrets and variables → Actions
          #   → New repository secret → 名称 CNB_READ_TOKEN。
          CNB_READ_TOKEN: ${{ secrets.CNB_READ_TOKEN }}
          # ⚠️ `inputs` 只有 workflow_dispatch / workflow_call 两种事件才定义。
          # schedule 触发时它是**未定义上下文**，`${{ inputs.xxx }}` 不会被求值成空串，
          # 而是把**字面量**留进 shell —— `[ "${{ inputs.dry_run }}" = "true" ]` 展开成
          # `[ "${{ inputs.dry_run }}" = "true" ]`，bash 报 `bad substitution`，
          # 步骤在第一条语句就退出（实测 2026-10-11 22:17 那次 schedule 运行，
          # 9 秒即 failure，正确性：run 38179858075）。
          # 修法：一律经 `env:` 传值（未定义上下文在 env 里解析成空串，不落进 shell），
          # 脚本里只读环境变量，且**不用 eval**（避免把输入拼进命令行）。
          DRY_RUN: ${{ inputs.dry_run }}
          SINCE: ${{ inputs.since }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          # 缺 token 直接失败：GITHUB_TOKEN 缺失时脚本只会在每个 issue 上打印
          # 「401 Unauthorized」然后以退出码 0 结束 —— 红灯变绿灯，静默空跑。
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "❌ GITHUB_TOKEN 为空（secrets.GH_PAT / secrets.GITHUB_TOKEN 都没拿到），提前失败" >&2
            exit 1
          fi
          # CNB 侧缺 token 是**必然 401**，不是偶发。早失败能把「配置缺失」
          # 与「CNB 故障」在日志上分开——前者要人去配 secret，后者等重试即可。
          if [ -z "${CNB_READ_TOKEN:-}" ]; then
            echo "❌ CNB_READ_TOKEN 为空，CNB OpenAPI 对匿名请求一律 401，无法降级。" >&2
            echo "   请配置：Settings → Secrets and variables → Actions" >&2
            echo "           → New repository secret → 名称 CNB_READ_TOKEN" >&2
            echo "           （值 = CNB 侧生成的只读 token）" >&2
            exit 1
          fi
          # 数组形态构造参数（**不用 eval**，避免把输入拼进命令行）。
          args=(--apply)
          if [ "${DRY_RUN:-}" = "true" ]; then
            args=(--dry-run)
          fi
          if [ -n "${SINCE:-}" ]; then
            args+=(--since "$SINCE")
          fi
          if [ -n "${LIMIT:-}" ]; then
            args+=(--limit "$LIMIT")
          fi
          echo "运行参数：${args[*]}"
          python scripts/bridge/cnb_github_backfill.py "${args[@]}"

      # 状态文件改为存 cache + 留 artifact，不再 commit 回仓库。
      # 原因见 `.github/actions/save-bridge-state/action.yml` 文件头：
      # 无参数 `git push` 在 schedule/issues 下推向默认分支 `main`（保护分支），
      # 而 `[skip ci]` 又让 required check 永远等不到结论 → GH006 死锁（已复现）。
      # 状态文件只是优化不是正确性依赖——幂等键是写在 GitHub 评论末尾的
      # `<!-- cnb-backfill: issue=N comment=M -->` 标记，每次运行都会重新扫描收集。
      - name: 存档状态文件（cache 传递 + artifact 审计）
        if: ${{ inputs.dry_run != true }}
        uses: ./.github/actions/save-bridge-state
        with:
          mode: save
          path: scripts/bridge/cnb_github_backfill_state.json
          cache-key-prefix: cnb-backfill

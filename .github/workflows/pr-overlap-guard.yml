# PR 重叠守卫（一劳永逸机制 Layer 3）
#
# ## 为什么需要它
#
# #450 系列的教训：多个并行 agent 在同一批「治理脚本」上各自造轮子，开出 4 个重叠大分支，
# 互相污染基线，合并时冲突爆炸。本工作流在 PR 打开/同步时，检查它是否与其他 open PR
# 触碰同一批「治理文件」，若是则提前评论预警，让人先协调而非事后救火。
#
# ## 守卫范围（治理文件）
#
# scripts/bridge/ 、scripts/check_*.py 、.cnb.yml 、AGENTS.md
# —— 这些是全局共享、易被多分支重复改写的文件。普通业务改动不触发。
#
# ## 为什么用 `pull_request` 而不是 `pull_request_target`（#2803）
#
# `pull_request_target` 的 workflow 定义**只取自仓库默认分支**（本仓是 `main`），
# 无视 PR 的 base 分支（GitHub 2025-12-08 生效的行为变更，官方 changelog
# 「Actions pull_request_target and environment branch protections changes」）：
#
# > The workflow file and checkout commit will always be taken from the repository's
# > default branch, regardless of the pull request's base branch.
#
# 本仓功能 PR 一律 base=`dev`，而 `main` 落后 `dev` 数百个提交 ⇒ 走
# `pull_request_target` 时跑的是 `main` 上那份旧定义 ⇒「在 dev 上改了 workflow」
# 对这条路径完全不可见（改了什么守卫、闸门放在哪，跑的都还是 `main` 那份旧的）。
# `pull_request` 的定义取自 PR 的 merge commit ⇒ dev 上的改动立刻生效。
#
# 同仓分支的 `pull_request` 与 `pull_request_target` 一样有写权限与 secrets
# （官方文档：*「The same is true for workflows triggered on pull_request from a
# branch in the same repository, but not from external forks.」*），
# 而本工作流需要 `pull-requests: write`（发评论）⇒ 迁过去**不损失**这个能力。
#
# ## 迁到 `pull_request` 后 checkout 必须显式写 `ref`（关键）
#
# `pull_request_target` 下 `actions/checkout` 默认检出 **base 分支**；
# 而 `pull_request` 下默认检出 **merge commit**（含 PR 代码）——
# 本工作流的 `GOV_GLOB` 圈定的正是 `scripts/bridge/`、`scripts/check_*.py` 这些
# **治理文件**，若检出 PR 代码，PR 作者就能通过改自己的守卫来绕过它。
# 故显式 `ref: dev`：检出的始终是受信的 dev，PR 代码永远不进来。
# （checkout 在此**只用于给 `gh` CLI 提供仓库上下文**——本工作流全部结论都来自
# `gh pr diff` / `gh pr list` 两个 API 调用，不读本地文件。）

name: PR 重叠守卫

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev'
    steps:
      - uses: actions/checkout@v5
        with:
          # ⚠️ 必须显式 ref: dev —— 见文件头「迁到 pull_request 后 checkout 必须
          # 显式写 ref」。不写的话检出的是 merge commit（含 PR 代码），
          # PR 作者就能改掉圈定治理文件的 GOV_GLOB 来绕过本守卫。
          ref: dev
          fetch-depth: 0

      - name: 检测治理文件重叠
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          GOV_GLOB='^(scripts/bridge/|scripts/check_.*\.py|\.cnb\.yml|AGENTS\.md)'

          FILES=$(gh pr diff "$PR" --name-only)
          GOV=$(printf '%s\n' "$FILES" | grep -E "$GOV_GLOB" || true)
          if [ -z "$GOV" ]; then
            echo "本 PR 未触碰治理文件，跳过"; exit 0
          fi

          OTHERS=$(gh pr list --base dev --state open --json number --jq ".[].number" | grep -v "^$PR$" || true)
          [ -z "$OTHERS" ] && { echo "无其他 open PR 可对比，跳过"; exit 0; }

          COLLIDE=""
          for o in $OTHERS; do
            OF=$(gh pr diff "$o" --name-only | grep -E "$GOV_GLOB" || true)
            [ -z "$OF" ] && continue
            COMMON=$(comm -12 <(printf '%s\n' "$GOV" | sort -u) <(printf '%s\n' "$OF" | sort -u) || true)
            if [ -n "$COMMON" ]; then
              COLLIDE="${COLLIDE}#${o} 重叠文件：\n${COMMON}\n"
            fi
          done

          if [ -n "$COLLIDE" ]; then
            {
              echo "⚠️ 本 PR 与以下 open PR 触碰**相同治理文件**，存在重复造轮子 / 基线污染风险，请先协调再推进："
              echo ""
              echo '```'
              printf '%s\n' "$COLLIDE"
              echo '```'
              echo ""
              echo "治理文件范围：\`scripts/bridge/\`、\`scripts/check_*.py\`、\`.cnb.yml\`、\`AGENTS.md\`。"
            } | gh pr comment "$PR" --body-file -
          else
            echo "未发现治理文件重叠"
          fi

# Dependabot 的 pnpm 锁重生成（#2434）
#
# ## 为什么需要它
#
# dependabot 升级 npm 依赖时**不运行 pnpm**，而是自己文本级重写 `pnpm-lock.yaml`。
# 它生成的锁会丢掉 **peer-suffixed 条目**（如 `@vitejs/plugin-vue-jsx@5.1.6(vite@7.x)`），
# 于是 `pnpm install --frozen-lockfile` 直接报 `ERR_PNPM_LOCKFILE_MISSING_DEPENDENCY`：
# 2026-10-20 一天内三连踩（#2394 / #2395 / #2397），每次都靠人工 15 分钟救火。
# 上游同族问题：dependabot-core #11135 / #12244 / #10758（不是本仓配置错）。
#
# ## 怎么修
#
# 以 `dev` 上那份 **pnpm 认可的锁**为基线，按 PR 的 manifest 用 pnpm 自己重生成，
# 再把结果作为**一个追加提交**推回 dependabot 的分支。逻辑全在
# `scripts/regen_pnpm_lockfile.mjs`（纯函数 + 失败态可测 + 本地可跑），
# 本文件只是薄封装：检出分支 → 跑脚本 → 推回 → 批准新 runs。
#
# 把逻辑放脚本而不是内联在 YAML 里，是为了让「重生成能修好坏锁」这件事**能在本地验证**
# （2026-10-20 实测：坏锁复现红 → 重生成 → frozen 自证通过；dev 基线下重生成字节级幂等）。
#
# ## 边界（每条都对应一次真实事故形态）
#
# - **只处理 dependabot 作者 + base=dev**：本仓只有 `dev` 是集成分支；
# - **运行 dev 上的那一版脚本**（`git show origin/dev:...` 落盘再跑）：不在 PR 分支上执行未评审内容；
# - **脚本自跑 `--frozen-lockfile` 自证**：过不去就退 1，**绝不推送坏锁**
#   （宁可这一步红，不可把更坏的状态推回去）；
# - **`|| true` 一律不用**：吞掉失败态会让「重生成失败」以绿灯消失（#171 / #450 同族）；
# - **推回后的 runs 会进 approval-required**（GITHUB_TOKEN 递归防护，见 #2289）：
#   复用 `scripts/pr_autorebase_approve.py` 批准；批准失败只打 `::warning::` ——
#   锁已经修好了，把这一步判红是失实的。
#
# ## 判据
#
# `scripts/guard_dependabot_lockfile_regen.py`（并入 `ci.yml` 的 `scripts_test`，阻断）：
# 本文件必须真的调用脚本、必须带 `--apply`、必须 `git push`、不得 `|| true`、
# 必须按 dependabot 作者与 base=dev 设闸。回归网
# `scripts/tests/test_dependabot_lockfile_regen.py` 用变异探针验证守卫真的会红。

name: Dependabot 锁重生成

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  actions: write # 推回后批准 approval-required 的 CI runs（#2289）

concurrency:
  # 同一 PR 只留一个在跑：两个 run 同时重生成会互相覆盖（后推的覆盖先推的）。
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev'
    steps:
      - uses: actions/checkout@v5
        with:
          # 先落 dev：需要 `origin/dev` 的锁作基线，也需要**已评审**的脚本版本。
          # （`pull_request_target` 的 checkout 默认就是 base 分支，这里写死意图。）
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: 重生成锁并推回
        env:
          # ⚠️ 表达式一律先落 env 再引用：`head.ref` 由外部控制，
          # 直接内插进 `run:` 会被 CodeQL 判 critical 注入（同 pr-auto-rebase.yml 的处理）。
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev "$PR_HEAD_REF"
          git checkout -B "$PR_HEAD_REF" "origin/$PR_HEAD_REF"

          # 上一轮已经是本工作流推的锁：跳过，避免「推回 → synchronize → 再跑」空转。
          if [ "$(git log -1 --format=%ae)" = "github-actions[bot]@users.noreply.github.com" ]; then
            echo "最新提交已是锁重生成，跳过"
            exit 0
          fi

          # 跑 **dev 上**那一版脚本，而不是 PR 分支上的（后者未评审）。
          git show origin/dev:scripts/regen_pnpm_lockfile.mjs > /tmp/regen_pnpm_lockfile.mjs

          # 本 PR 改过哪些 pnpm-lock.yaml：frontend/ 与仓库根各有一份。
          DIRS=$(git diff --name-only origin/dev...HEAD -- '*pnpm-lock.yaml' \
            | sed -E 's#/?pnpm-lock.yaml$##' \
            | sed -E 's#^$#.#' \
            | sort -u)
          if [ -z "$DIRS" ]; then
            echo "本 PR 未改 pnpm-lock.yaml，无需重生成"
            exit 0
          fi
          echo "待重生成的目录: $DIRS"

          rc_total=0
          for d in $DIRS; do
            echo "::group::regen $d"
            set +e
            node /tmp/regen_pnpm_lockfile.mjs --dir "$d" --base-ref origin/dev --apply
            rc=$?
            set -e
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              # 不推送：脚本已在内部回滚锁文件（失败态不留半成品）。
              echo "::error::锁重生成失败（dir=$d rc=$rc）——不推送坏锁"
              rc_total=$rc
            fi
          done
          if [ "$rc_total" -ne 0 ]; then
            exit "$rc_total"
          fi

          if git diff --quiet -- '*pnpm-lock.yaml'; then
            echo "重生成后无差异：PR 的锁本来就可用"
            exit 0
          fi

          git add -- '*pnpm-lock.yaml'
          cat > /tmp/commit-msg.txt <<'MSG'
          chore(deps): 重生成 pnpm 锁（dependabot 重写丢 peer 条目，#2434）

          dependabot 不跑 pnpm，而是文本级重写 pnpm-lock.yaml，会丢掉 peer-suffixed
          条目，导致 `pnpm install --frozen-lockfile` 报 ERR_PNPM_LOCKFILE_MISSING_DEPENDENCY。

          本提交由 .github/workflows/dependabot-lockfile-regen.yml 生成：
          以 dev 上那份 pnpm 认可的锁为基线，按本 PR 的 package.json 重生成，
          并把改动过的依赖钉回 manifest 声明的版本；收尾已跑 --frozen-lockfile 自证。
          MSG
          # 用文件传提交信息（中文内联进 `-m` 在部分控制台会被按本地代码页编码，见 AGENTS.md）
          git commit -F /tmp/commit-msg.txt
          git push origin "HEAD:$PR_HEAD_REF"

          # 推回由 GITHUB_TOKEN 发出 ⇒ 新 runs 进 approval-required，不批准则 CI 挂死零 job。
          NEW_SHA=$(git rev-parse HEAD)
          set +e
          python3 scripts/pr_autorebase_approve.py --sha "$NEW_SHA"
          APPROVE_RC=$?
          set -e
          if [ "$APPROVE_RC" -ne 0 ]; then
            echo "::warning::推送后的自动批准未完成（rc=$APPROVE_RC）——该 PR 的 CI 可能挂死，请人工批准"
          fi

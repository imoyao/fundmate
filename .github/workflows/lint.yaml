name: Markdown Lint

on:
  push:               # 每次 push 触发，可按需限定分支
  workflow_dispatch:  # 允许手动触发

jobs:
  lint-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'    # 与你的 package.json 兼容

      - name: Install dependencies
        run: yarn install --frozen-lockfile   # 保证依赖版本锁定

      - name: Lint Markdown files
        run: npx lint-md docs   # 仅检查，不自动修复（不带 -f）

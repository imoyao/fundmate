name: Build Status

on:
  - push

jobs:
  backendunit:
    name: backend check
    runs-on: ubuntu-latest
    run: |
      cd ./backend
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.7
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
      - name: Run Python lints
        run: flask lint --check
      - name: Run Python tests
        run: flask test
  docsunit:
    name: docs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2.1.2
        with:
          node-version: "12.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node dependencies
        run: npm install
      #- run: cp .env.example .env
      - name: Run Node lints
        run: yarn run lint-md
  frontendunit:
    name: frontend lint
    runs-on: ubuntu-latest
    run: |
      cd ./frontend
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2.1.2
        with:
          node-version: "12.x"
          registry-url: "https://registry.npmjs.org"
      - name: Install Node dependencies
        run: yarn install
      - name: Run Node lints
        run: yarn run lint
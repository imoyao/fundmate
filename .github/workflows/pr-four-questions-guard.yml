# PR 四问格式守卫
#
# 依据 AGENTS.md「Issue 全局治理」与 2026-10-19 治理诊断：
#   AGENTS.md 里早有「纳入四问」机制，但它拦不住任何东西。用户原话：
#   「它会去看这个需求是不是合理的，但是没有强制性。也就是说，AI 有时候读到
#    Agent 的 MD 里面会去看，但有时候又会把这块绕开，并不会每一个都做这个分析。」
#
#   这条判断准确，而根因决定了本守卫的设计形状：
#     - 「需求是否合理」是**主观判断** → 写进文档 = 软约束，AI 可绕；
#     - 「描述里有没有这四行」是**客观存在性** → 可以挂 CI，绕不过。
#
# 所以本守卫**不是**把四问变成更强的判断，而是把判断**降级**成存在性检查：
# 逼 AI 每次停下来把四件事写出来（谁的什么问题 / 验收标准 / 风险 / 替代方案）。
# 写的过程本身就是 AI 自我约束的一遍——**约束的是「不许跳过思考」，
# 而不是「不许做出错误判断」**。后者永远做不到，也不该假装能做到。
#
# 换句话说：四问格式守卫不提升判断质量，只保证**判断发生过并留下痕迹**。
#
# ## 关于「Q1 容量」为什么不在本文件里
#
# 2026-10-19 曾在此加过「Q1 容量」job（PR 新增 Q1 且超上限 → 红灯），**已废止**：
#   1. 判据错位——它只拦「PR 开着时给卡提优先级」，完全拦不到「新提一张紧急卡」；
#   2. 设计错位——真拦住了也等于把资源排序强加在紧急时刻，惩罚做正确动作的人。
#   改由 `now-capacity-ledger.yml` 承担（超容打标签、回落自动撤，零摩擦不阻断）。
#
# ## 豁免面（必须有，否则第一天就被 dependabot 堵死）
#
#   机器人作者 / draft PR / 描述含 `four-questions-skip`。
#   守卫一旦频繁误伤真实工作，就再也没有人看它——这是它能否长期活下来的前提。
#
# ## 为什么用 `pull_request` 而不是 `pull_request_target`（#2803）
#
# `pull_request_target` 的 workflow 定义**只取自仓库默认分支**（本仓是 `main`），
# 无视 PR 的 base 分支（GitHub 2025-12-08 生效的行为变更，官方 changelog
# 「Actions pull_request_target and environment branch protections changes」）：
#
# > The workflow file and checkout commit will always be taken from the repository's
# > default branch, regardless of the pull request's base branch.
#
# 本仓功能 PR 一律 base=`dev`，而 `main` 落后 `dev` 数百个提交 ⇒ 走
# `pull_request_target` 时跑的是 `main` 上那份旧定义 ⇒ **「在 dev 上改了这个守卫」
# 对这条路径完全不可见**（改了判据、扩了豁免面，跑的都还是 `main` 那份旧的）。
# `pull_request` 的定义取自 PR 的 merge commit ⇒ dev 上的改动立刻生效。
#
# 本工作流只需 `contents: read` + `pull-requests: read`，而同仓分支的 `pull_request`
# 与 `pull_request_target` 权限**完全一致**（官方文档：*「The same is true for
# workflows triggered on pull_request from a branch in the same repository, but not
# from external forks.」*）⇒ 迁过去**不损失任何能力**。
#
# ## 迁到 `pull_request` 后 checkout 必须显式写 `ref`（关键）
#
# `pull_request_target` 下 `actions/checkout` 默认检出 **base 分支**；
# `pull_request` 下默认检出 **merge commit**（含 PR 代码）。
# 本守卫执行的是 `scripts/guard_pr_four_questions.mjs`——**如果检出的是 PR 代码，
# PR 作者就能改掉这个守卫脚本本身来绕过它**（把判据改成恒真）。
# 故显式 `ref: dev`：检出的始终是受信的 dev 版本。
# （原注释说「不 checkout PR 代码」在 `pull_request_target` 下成立；
#  迁到 `pull_request` 后**必须靠显式 `ref: dev` 才继续成立**。）

name: PR 四问格式守卫

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-four-questions-guard-${{ github.event.pull_request.number }}
  # ⚠️ 必须 `false`，不能是 `true`（#2803 迁移时实测撞到）：
  #
  # 迁到 `pull_request` 后，**过渡期内 `main` 上的旧版（`pull_request_target`）与
  # `dev` 上的新版（`pull_request`）会同时被触发**——两者的定义来源不同
  # （旧版读默认分支 `main`，新版读 merge commit），但**算出来的 concurrency group
  # 名字是同一个** ⇒ 若 `cancel-in-progress: true`，两者会**互相取消**。
  #
  # 实测（PR #2807，2026-11-01）：同一时刻两个 run ——
  #   `pull_request`（新版）      → **cancelled**
  #   `pull_request_target`（旧版）→ success
  # ⇒ **守卫被静默取消**，且 GitHub 把 cancelled 记成 check 失败（显示 fail）。
  #
  # 改成 `false` 后两份会串行跑完。本守卫的判定是**幂等且无副作用**的
  # （只读 PR 正文、只返回退出码，**不评论 PR、不写标签**）⇒ 跑两次无害，
  # 且无论哪份先跑，结论都一样。
  #
  # （`issue-claim-sync.yml` 本来就是 `false`；`pr-overlap-guard` 与 `pr-auto-rebase`
  #  没有 concurrency group —— 前者跑两次可能发两条相同评论（过渡期可接受），
  # 后者第二次会因「分支已是最新」而跳过（幂等）。）
  cancel-in-progress: false

jobs:
  four-questions:
    name: 四问格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出守卫脚本（不检出 PR 代码）
        uses: actions/checkout@v4
        with:
          # ⚠️ 必须显式 ref: dev —— 见文件头「迁到 pull_request 后 checkout 必须
          # 显式写 ref」。不写的话检出的是 merge commit（含 PR 代码），
          # PR 作者就能改掉 guard_pr_four_questions.mjs 来绕过本守卫。
          ref: dev
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: 判定（只检查有没有写，不判断写得对不对）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > /tmp/pr-body.md

          # 作者 / draft 豁免是脚本的可选入参，这里显式传入，
          # 保证实际豁免面与 guard_pr_four_questions.mjs 文件头的设计一致。
          set +e
          node -e '
            const fs = require("node:fs");
            const { checkFourQuestions } = require("./scripts/guard_pr_four_questions.mjs");
            const v = checkFourQuestions({
              body: fs.readFileSync("/tmp/pr-body.md", "utf8"),
              author: process.env.PR_AUTHOR,
              draft: process.env.PR_DRAFT === "true",
            });
            fs.writeFileSync("/tmp/fq.json", JSON.stringify(v));
            process.exit(v.ok ? 0 : 1);
          '
          rc=$?
          set -e

          cat /tmp/fq.json
          if [ "$rc" -ne 0 ]; then
            echo "::error::四问格式守卫未通过，详见上方 JSON 的 message 字段。"
          fi
          exit $rc

# AI 代码审查工作流（深度线路 + 模型轮询兜底）
#
# 触发：私有库 PR 创建 / 更新时自动跑，仅保留一条深度审查线路：
#   deep-review（深度完整）：run 模式逐行 inline + 跨文件 context + 深度 summary，主动找深层次问题。
#
# 模型轮询 + 兜底（2026-09-02 新增）：
#   每次运行先跑 scripts/llm_health_probe.py，按优先级轮询候选模型（跨供应商），
#   选出第一个健康的模型交给 AI Review；某模型不可用 / 免费额度用光时，自动换下一个顶上，
#   避免「单模型被限流/暂停 → 整条审查静默失败」。候选模型与优先级清单见该脚本（单一数据源）。
#
# 变更说明（2026-09-02）：
#   - 移除原免费线路（智谱 GLM-4.7-Flash）：该模型频繁 429（访问量过大）且产出价值低，纯浪费 Actions 分钟。
#   - 原深度线路默认走智能路由接入点 ep-20260823221703-q9d89，但该路由会把请求派发给 doubao-seed-1-6，
#     该模型已达推理额度上限 / 因「安全体验模式」被暂停，导致深度审查同样 429 失败。
#   - 故改为轮询兜底：默认优先用火山方舟 DeepSeek Flash（deepseek-v4-flash-ga-260731，已验证可用），
#     不可用时依次回退 Pro / 智谱免费模型。
#
# 降噪策略（2026-09-11 改版：从「往 prompt 加禁止条目」改为「改结构性配置」）：
#   1) 降噪开关集中在根目录 .ai-review-deep.yaml，prompt 不再是唯一的调节旋钮：
#      审查范围收窄为「只送新增行」（ONLY_ADDED_WITH_CONTEXT）、inline/context 配额、
#      agent 只读探索仓库、忽略 lockfile。
#   2) 深度线路 TEMPERATURE=0.1，低温度降低模型随机发挥带来的误报。
#   3) 单一权威 prompt：docs/configs/ai-review-prompt.md，经 .ai-review-deep.yaml 注入；
#      summary 的输出契约另由 docs/configs/ai-review-system-summary.md 以 system 消息承担
#      （system 优先级高于用户消息，原内置契约禁 markdown，与仓库结构化摘要冲突）。
#   历史教训：2026-08-25 ~ 09-10 期间靠「每遇一类误报就往 prompt 追加一条」，16 天从 8.7KB
#   涨到 29KB（近一半是逐 PR 案例），单 PR 仍产出 29~52 条评论且几乎全为误报，同时漏掉真实
#   缺陷——证明清单式追加不可收敛。案例改存 docs/configs/ai-review-known-false-positives.md。
#
# 深度线路档位由 PR 标签决定（在 PR 界面点标签即可，零摩擦、不影响自动触发）：
#   无标签            → 默认档：轮询兜底，优先 cheap（DeepSeek Flash）
#   review:pro        → 仅用 pro 档（DeepSeek Pro），不可用时判失败
#   review:deepseek   → 显式指定 cheap 档（DeepSeek Flash）
# 优先级（MODEL_PRIORITY，可在下方步骤覆盖）：cheap,pro,free
#
# 失败保护（防假成功）：deep-review 在 AI 审查 step 之后校验「本轮是否在 PR 上发布了评论」。
#   若 LLM 失败/限流/欠费导致 action 静默跳过（不发评论），则 job 标红失败，不再显示 success。
#   2026-09-11 补强：原逻辑只看「探测是否选中健康模型」，但探测只发一次极短请求、真实审查是
#   长上下文 + 多轮 agent，两者限流概率不同——PR #1412 实测到「探测 200 通过、实调用 429、
#   一条评论都没发」却被判成功。现改为：PR 上一条 AI 评论都没有 → 一律失败。
#
# 前置：仓库 Settings → Secrets → Actions 新增
#   ARK_API_KEY_CODEREVIEW（火山方舟，深度线路专用，值为本地 backend/.env 的 ARK_API_KEY）
#   ZHIPU_API_KEY（智谱开放平台，作为免费兜底线路）

name: AI Code Review

# 降频护栏（2026-09-02）：每次 PR synchronize 都实打实烧一次 LLM。按 PR 编号分组并取消进行中的旧运行，
# 同一 PR 反复 push 只保留最新一次审查；手动 dispatch 无 PR 编号时回退 run_id，互不取消。
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 预算保护：仅在 PR 目标为长期分支 dev / main 时才跑 AI 审查，
    # 避免 feature 分支之间的 PR 也消耗 LLM 与 Actions 分钟（私有库每月 2000 分钟上限）。
    branches:
      - dev
      - main
  # 手动触发：兼容历史入口，但手动触发无关联 PR，默认走默认档位。
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  issues: read

jobs:
  # 深度审查线路：火山方舟 / 智谱，完整评审（summary + context + inline）。
  # 模型由「轮询探测脚本」按优先级自动选择（见 probe 步骤），标签仅决定档位。
  # 前置：仓库 Settings → Secrets → Actions 新增 ARK_API_KEY_CODEREVIEW 与 ZHIPU_API_KEY。
  deep-review:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析 PR 标签（决定审查档位）
        id: resolve-labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let labels = [];
            if (pr) {
              labels = (pr.labels || []).map(l => l.name);
            } else if (github.event_name === 'workflow_dispatch') {
              core.setOutput('tier', 'default');
              core.info('workflow_dispatch 触发，无关联 PR，使用默认档位');
              return;
            }
            let tier = 'default';
            if (labels.includes('review:pro')) {
              tier = 'pro';
            } else if (labels.includes('review:deepseek')) {
              tier = 'cheap';
            }
            core.setOutput('tier', tier);
            core.info(`审查档位：${tier}`);

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 探测可用模型（轮询 + 兜底）
        id: probe
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ARK_API_KEY_CODEREVIEW: ${{ secrets.ARK_API_KEY_CODEREVIEW }}
          REVIEW_TIER: ${{ steps.resolve-labels.outputs.tier }}
          # 优先级：cheap(DeepSeek Flash) → pro(DeepSeek Pro) → free(智谱 GLM)。
          # 想改为「免费优先、额度用光再用付费」可改成 "free,cheap,pro"。
          MODEL_PRIORITY: "cheap,pro,free"
        run: python scripts/llm_health_probe.py

      - name: 记录审查前评论数
        if: ${{ github.event_name == 'pull_request' }}
        id: pre-check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const reviewComments = (await github.rest.pulls.listReviewComments({ owner, repo, pull_number: pr })).data.length;
            const reviews = (await github.rest.pulls.listReviews({ owner, repo, pull_number: pr })).data.length;
            core.setOutput('count', reviewComments + reviews);

      - name: AI 深度审查
        uses: Nikita-Filonov/ai-review@v0.76.0
        with:
          review-command: run
        env:
          # —— 自定义 prompt：深度审查指令（严重度分级 + 项目专属清单）——
          AI_REVIEW_CONFIG_FILE_YAML: ".ai-review-deep.yaml"
          # —— LLM 配置：模型 / 端点 / 密钥均由「探测步骤」按轮询结果动态决定 ——
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: ${{ steps.probe.outputs.model }}
          LLM__META__MAX_TOKENS: "16000"
          # 深度审查追求严谨稳定，低温度降低误报
          LLM__META__TEMPERATURE: "0.1"
          LLM__HTTP_CLIENT__API_URL: ${{ steps.probe.outputs.provider == 'zhipu' && 'https://open.bigmodel.cn/api/paas/v4/' || 'https://ark.cn-beijing.volces.com/api/v3/' }}
          LLM__HTTP_CLIENT__API_TOKEN: ${{ steps.probe.outputs.provider == 'zhipu' && secrets.ZHIPU_API_KEY || secrets.ARK_API_KEY_CODEREVIEW }}
          # —— GitHub 集成 ——
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验深度线路评论已发布（防假成功）
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const before = Number('${{ steps.pre-check.outputs.count }}');
            const selectedOk = '${{ steps.probe.outputs.selected_ok }}' === 'true';
            let after = before;
            for (let i = 0; i < 5; i++) {
              const rc = (await github.rest.pulls.listReviewComments({ owner, repo, pull_number: pr })).data.length;
              const rv = (await github.rest.pulls.listReviews({ owner, repo, pull_number: pr })).data.length;
              after = rc + rv;
              if (after > before) break;
              await new Promise(r => setTimeout(r, 5000));
            }
            // 本轮确实新增了评论 → 成功
            if (after > before) {
              core.info(`深度线路已发布评论，计数 ${before} → ${after}`);
              return;
            }
            // 未新增评论必须再分两种，**不能只看「探测是否选中健康模型」**。
            // 2026-09-10 PR #1412 实测反例：探测 glm-4.7-flash 返回 200（selected_ok=true），
            // 但真正调用时上游 429（智谱 code 1302「账户已达到速率限制」），agent 模式与兜底
            // 直连双双失败、summary 为空被跳过 → 一条评论都没发，旧逻辑却判为成功（假成功）。
            // 之所以会出现这种错配：探测只发一次极短请求，而真实审查是长上下文 + 多轮 agent，
            // 触发限流的概率高得多。所以「探测通过」不能等价于「本次审查成功」。
            // 现规则：
            //   a) PR 上已存在 AI 评论 → 视为「去重跳过已存在的评论」，成功；
            //   b) PR 上一条 AI 评论都没有 → 本次确实什么都没产出，失败。
            // 残留缺口（已知，不装作没有）：若历史评论已存在、而本轮又静默失败，仍会放行。
            // 要彻底堵住需要 action 自身在 LLM 报错时非零退出，当前版本（v0.76.0）不提供该信号。
            const hasAiTag = (body) =>
              (body || '').includes('#ai-review-inline') || (body || '').includes('#ai-review-summary');
            const inlineComments = (await github.rest.pulls.listReviewComments({ owner, repo, pull_number: pr })).data;
            const generalComments = (await github.rest.issues.listComments({ owner, repo, issue_number: pr })).data;
            const existingAi = [...inlineComments, ...generalComments].filter(c => hasAiTag(c.body)).length;

            if (selectedOk && existingAi > 0) {
              core.info(`本次未新增评论，但 PR 上已有 ${existingAi} 条 AI 评论（去重跳过），视为成功`);
              return;
            }
            core.setFailed(
              '深度线路 AI 审查未产出任何评论（候选模型均不可用/限流/欠费，或模型输出为空）——'
              + `selected_ok=${selectedOk}，PR 上已有 AI 评论数=${existingAi}。`
              + '标记为失败以避免假成功；请检查探测步骤输出中的 429 / 额度告警。'
            );

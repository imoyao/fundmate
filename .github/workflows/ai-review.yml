# AI 代码审查工作流（双线路）
#
# 触发：私有库 PR 创建 / 更新时自动跑，两条线路并行：
#   1) ai-review（免费快速）：智谱 GLM-4.7-Flash（OpenAI 兼容，免费档），run-summary 只留一条总结评论。
#   2) deep-review（深度完整）：火山方舟 DeepSeek V4 Pro（deepseek-v4-pro-ga-260813），
#      run 模式逐行 inline + 跨文件 context + 深度 summary，找免费线路容易漏的深层问题。
#
# 降噪策略：
#   1) 免费线路 TEMPERATURE=0.2、深度线路 0.1，低温度降低模型随机发挥带来的误报
#   2) 免费线路 run-summary 只在 PR 留一条总结评论；深度线路 run 负责 inline 逐行
#   3) 免费线路 prompt 见 .ai-review.yaml + docs/configs/ai-review-summary-prompt.md；
#      深度线路见 .ai-review-deep.yaml + docs/configs/ai-review-deep-prompt.md
#
# 前置：仓库 Settings → Secrets → Actions 新增
#   ZHIPU_API_KEY（智谱开放平台个人中心获取，免费线路）
#   ARK_API_KEY_DEEPSEEK（火山方舟，与本地 backend/.env 同名同值，深度线路）

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: AI 审查（智谱 GLM-4.7-Flash 免费模型）
        uses: Nikita-Filonov/ai-review@v0.76.0
        with:
          review-command: run-summary
        env:
          # —— 自定义 prompt 配置：中文优先、中英双语（见仓库根 .ai-review.yaml）——
          AI_REVIEW_CONFIG_FILE_YAML: ".ai-review.yaml"
          # —— LLM 配置：智谱开放平台（OpenAI 兼容，Flash 系列免费）——
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: "glm-4.7-flash"
          LLM__META__MAX_TOKENS: "8000"
          LLM__META__TEMPERATURE: "0.2"
          LLM__HTTP_CLIENT__API_URL: "https://open.bigmodel.cn/api/paas/v4/"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.ZHIPU_API_KEY }}
          # —— GitHub 集成 ——
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 深度审查线路：火山方舟 DeepSeek V4 Pro，完整评审（summary + context + inline）。
  # 与免费线路并行：免费 GLM 负责低成本快速总结，本 job 逐行 + 跨文件找深层次问题。
  # 前置：仓库 Settings → Secrets → Actions 新增 ARK_API_KEY_DEEPSEEK（与本地 backend/.env 同名同值）。
  deep-review:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: AI 深度审查（DeepSeek V4 Pro）
        uses: Nikita-Filonov/ai-review@v0.76.0
        with:
          review-command: run
        env:
          # —— 自定义 prompt：深度审查指令（严重度分级 + 项目专属清单）——
          AI_REVIEW_CONFIG_FILE_YAML: ".ai-review-deep.yaml"
          # —— LLM 配置：火山方舟（OpenAI 兼容，DeepSeek V4 Pro GA）——
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: "deepseek-v4-pro-ga-260813"
          LLM__META__MAX_TOKENS: "16000"
          # 深度审查追求严谨稳定，低温度降低误报
          LLM__META__TEMPERATURE: "0.1"
          LLM__HTTP_CLIENT__API_URL: "https://ark.cn-beijing.volces.com/api/v3/"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.ARK_API_KEY_DEEPSEEK }}
          # —— GitHub 集成 ——
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

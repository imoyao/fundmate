# AI 代码审查工作流（深度线路 + 模型轮询兜底）
#
# 触发：私有库 PR 创建 / 更新时自动跑，仅保留一条深度审查线路：
#   deep-review（深度完整）：run 模式逐行 inline + 跨文件 context + 深度 summary，主动找深层次问题。
#
# 模型轮询 + 兜底（2026-09-02 新增）：
#   每次运行先跑 scripts/llm_health_probe.py，按优先级轮询候选模型（跨供应商），
#   选出第一个健康的模型交给 AI Review；某模型不可用 / 免费额度用光时，自动换下一个顶上，
#   避免「单模型被限流/暂停 → 整条审查静默失败」。候选模型与优先级清单见该脚本（单一数据源）。
#
# 变更说明（2026-09-02）：
#   - 移除原免费线路（智谱 GLM-4.7-Flash）：该模型频繁 429（访问量过大）且产出价值低，纯浪费 Actions 分钟。
#   - 原深度线路默认走智能路由接入点 ep-20260823221703-q9d89，但该路由会把请求派发给 doubao-seed-1-6，
#     该模型已达推理额度上限 / 因「安全体验模式」被暂停，导致深度审查同样 429 失败。
#   - 故改为轮询兜底：默认优先用火山方舟 DeepSeek Flash（deepseek-v4-flash-ga-260731，已验证可用），
#     不可用时依次回退 Pro / 智谱免费模型。
#
# 运行期故障转移（2026-09-17 新增，#1567 教训）：
#   上面的「轮询兜底」只发生在**探测**阶段——一旦选定，整轮审查就被钉死在那一个模型上
#   （ai-review v0.76.0 只接受一套 model / endpoint / token，不提供跨模型重试）。
#   而探测只发一次极短请求，与真实长上下文审查的限流概率完全不同：2026-09-17 PR #1567
#   实测「探测 glm-4.7-flash 200 通过 → 真调 429（智谱 code 1305）→ 零评论」，同一轮里
#   其它健康候选探测过却用不上。
#   故本 workflow 现在最多跑两轮：第 1 轮零产出 → 用 EXCLUDE_MODELS 排除该模型重新探测
#   → 换一个候选重试第 2 轮；第 2 轮仍零产出才判 job 失败。多出的成本只落在失败运行上
#   （这类运行本来就得人工重跑）。
#
# 候选池重排（2026-09-17，按「越新越强越前」——老模型弱，找不出问题）：
#   pro   豆包 Seed 2.1 Pro（doubao-seed-2-1-pro-260915，2026-09-15，默认首选）
#         方舟 DeepSeek Pro（deepseek-v4-pro-ga-260813，暂停中）
#   cheap DeepSeek V4.1（deepseek-v4-1-flash-260910，2026-09-14）
#         GLM 5.3 Flash（glm-5-3-flash-260828，2026-09-03，方舟托管）
#         方舟 DeepSeek Flash（deepseek-v4-flash-ga-260731，暂停中）
#         豆包 Seed 2.1 Turbo（doubao-seed-2-1-turbo-260628，2026-06-16）
#   全部走方舟同一把 key，故端点/密钥不再按 provider 切换。
#   已删除：智谱独立线路（原 free 档）——常 429 且产出价值低，纯浪费 Actions 分钟。
#   暂停中的模型**一律保留在候选池**：探测标 429 后自动跳过、不影响其它候选；
#   方舟「模型开通」页恢复开通后无需改代码即可自动重新参与（删掉反而要多改一次代码）。
#
# 降噪策略（2026-09-11 改版：从「往 prompt 加禁止条目」改为「改结构性配置」）：
#   1) 降噪开关集中在根目录 .ai-review-deep.yaml，prompt 不再是唯一的调节旋钮：
#      审查范围收窄为「只送新增行」（ONLY_ADDED_WITH_CONTEXT）、inline/context 配额、
#      agent 只读探索仓库、忽略 lockfile。
#   2) 深度线路 TEMPERATURE=0.1，低温度降低模型随机发挥带来的误报。
#   3) 单一权威 prompt：docs/configs/ai-review-prompt.md，经 .ai-review-deep.yaml 注入；
#      summary 的输出契约另由 docs/configs/ai-review-system-summary.md 以 system 消息承担
#      （system 优先级高于用户消息，原内置契约禁 markdown，与仓库结构化摘要冲突）。
#   历史教训：2026-08-25 ~ 09-10 期间靠「每遇一类误报就往 prompt 追加一条」，16 天从 8.7KB
#   涨到 29KB（近一半是逐 PR 案例），单 PR 仍产出 29~52 条评论且几乎全为误报，同时漏掉真实
#   缺陷——证明清单式追加不可收敛。案例改存 docs/configs/ai-review-known-false-positives.md。
#
# 深度线路档位由 PR 标签决定（在 PR 界面点标签即可，零摩擦、不影响自动触发）：
#   无标签            → 默认档：轮询兜底，优先 pro（豆包 Seed 2.1 Pro）
#   review:pro        → 仅用 pro 档（豆包 Seed 2.1 Pro / DeepSeek V4.1）
#   review:deepseek   → 沿用旧标签名，落到 cheap 档（GLM 5.3 / 豆包 Turbo）
# 优先级（MODEL_PRIORITY，可在下方步骤覆盖）：pro,cheap（质量优先；想省钱改成 cheap,pro）
#
# 失败保护（防假成功）：deep-review 在 AI 审查 step 之后校验「本轮是否在 PR 上发布了评论」。
#   若 LLM 失败/限流/欠费导致 action 静默跳过（不发评论），则 job 标红失败，不再显示 success。
#   2026-09-11 补强：原逻辑只看「探测是否选中健康模型」，但探测只发一次极短请求、真实审查是
#   长上下文 + 多轮 agent，两者限流概率不同——PR #1412 实测到「探测 200 通过、实调用 429、
#   一条评论都没发」却被判成功。现改为：PR 上一条 AI 评论都没有 → 一律失败。
#   2026-09-17：校验逻辑抽到 scripts/ai_review_verify_guard.js（两轮共用，避免复制漂移）；
#   第 1 轮失败由 continue-on-error 接住并触发换模型重试，第 2 轮失败才判 job 红。
#
# 前置：仓库 Settings → Secrets → Actions 新增
#   ARK_API_KEY_CODEREVIEW（火山方舟，深度线路专用，值为本地 backend/.env 的 ARK_API_KEY）
# 2026-09-17 起不再需要 ZHIPU_API_KEY（智谱独立线路已删除）——仓库 Secrets 里那条可以删掉。

name: AI Code Review

# 降频护栏（2026-09-02）：每次 PR synchronize 都实打实烧一次 LLM。按 PR 编号分组并取消进行中的旧运行，
# 同一 PR 反复 push 只保留最新一次审查；手动 dispatch 无 PR 编号时回退 run_id，互不取消。
concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 预算保护：仅在 PR 目标为长期分支 dev / main 时才跑 AI 审查，
    # 避免 feature 分支之间的 PR 也消耗 LLM 与 Actions 分钟（私有库每月 2000 分钟上限）。
    branches:
      - dev
      - main
  # 手动触发：兼容历史入口，但手动触发无关联 PR，默认走默认档位。
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  # issues: write —— 校验步骤需要删除「agent 协议信封泄漏」的评论。
  # PR 上的整体评论走的是 issues 端点（issues.deleteComment），只给 read 会 403。
  issues: write

jobs:
  # 深度审查线路：火山方舟 / 智谱，完整评审（summary + context + inline）。
  # 模型由「轮询探测脚本」按优先级自动选择（见 probe 步骤），标签仅决定档位。
  # 前置：仓库 Settings → Secrets → Actions 新增 ARK_API_KEY_CODEREVIEW（2026-09-17 起不再需要 ZHIPU_API_KEY）。
  deep-review:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 解析 PR 标签（决定审查档位）
        id: resolve-labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            let labels = [];
            if (pr) {
              labels = (pr.labels || []).map(l => l.name);
            } else if (github.event_name === 'workflow_dispatch') {
              core.setOutput('tier', 'default');
              core.info('workflow_dispatch 触发，无关联 PR，使用默认档位');
              return;
            }
            let tier = 'default';
            if (labels.includes('review:pro')) {
              tier = 'pro';
            } else if (labels.includes('review:deepseek')) {
              tier = 'cheap';
            }
            core.setOutput('tier', tier);
            core.info(`审查档位：${tier}`);

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 ripgrep（agent 模式只读命令依赖，当前为预留）
        # ⚠️ 注意：`.ai-review-deep.yaml` 的 agent 模式当前**已关闭**（证据见该文件注释），
        # 故此步骤在 agent 关闭期间不产生实际作用，**是为将来重开 agent 保留的前置条件**
        # （缺 rg 会直接让 agent 崩溃，见下方历史实证）。别误删，也别当成现役依赖。
        # 2026-09-11 实测：.ai-review-deep.yaml 开了 agent.enabled，模型会执行只读命令
        # 核实符号是否在别处定义（白名单见包内 services/policy/service.py，含 rg）。
        # 但 ubuntu-latest runner **没有预装 ripgrep**，于是
        #   Agent command failed: ... FileNotFoundError: [Errno 2] No such file or directory: 'rg'
        # agent 流程崩溃 → 后续 inline/summary 拿不到 JSON 数组
        #   （No JSON array found in LLM output）→ 零评论 → 被防假成功守卫判 FAIL。
        # PR #1414 / #1415 / #1417 三个 deep-review 红灯都是这个原因，与额度无关
        # （探测日志明确 CHOSEN: deepseek-v4-flash-ga-260731 (selected_ok=true)）。
        run: |
          if command -v rg >/dev/null 2>&1; then
            echo "runner 已预装：$(rg --version | head -1)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
            echo "已安装：$(rg --version | head -1)"
          fi

      - name: 记录审查前评论数
        if: ${{ github.event_name == 'pull_request' }}
        id: pre-check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const reviewComments = (await github.rest.pulls.listReviewComments({ owner, repo, pull_number: pr })).data.length;
            const reviews = (await github.rest.pulls.listReviews({ owner, repo, pull_number: pr })).data.length;
            core.setOutput('count', reviewComments + reviews);

      # ============================================================================
      # 第 1 轮：探测 → 审查 → 校验
      # ============================================================================
      - name: 探测可用模型（第 1 轮）
        id: probe
        env:
          ARK_API_KEY_CODEREVIEW: ${{ secrets.ARK_API_KEY_CODEREVIEW }}
          REVIEW_TIER: ${{ steps.resolve-labels.outputs.tier }}
          # 质量优先：pro（豆包 Seed 2.1 Pro / DeepSeek V4.1）→ cheap（GLM 5.3 Flash / 豆包 Turbo）。
          # 全部走方舟同一把 key；想省钱可改成 "cheap,pro"（脚本顶部 docstring 有档位说明）。
          MODEL_PRIORITY: "pro,cheap"
        run: python scripts/llm_health_probe.py

      - name: AI 深度审查（第 1 轮）
        id: review_1
        # 失败不终局：本轮是否真产出由下方校验判定；零产出则由「第 2 轮」换模型重试
        continue-on-error: true
        uses: Nikita-Filonov/ai-review@v0.76.0
        with:
          review-command: run
        env:
          # —— 自定义 prompt：深度审查指令（严重度分级 + 项目专属清单）——
          AI_REVIEW_CONFIG_FILE_YAML: ".ai-review-deep.yaml"
          # —— LLM 配置：模型由「探测步骤」按轮询结果动态决定 ——
          # 供应商固定为方舟（2026-09-17 起智谱独立线路已移除，GLM 家族改由方舟托管的 glm-5-3 承接），
          # 故端点与密钥不再需要按 provider 三元切换。
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: ${{ steps.probe.outputs.model }}
          LLM__META__MAX_TOKENS: "16000"
          # 深度审查追求严谨稳定，低温度降低误报
          LLM__META__TEMPERATURE: "0.1"
          LLM__HTTP_CLIENT__API_URL: "https://ark.cn-beijing.volces.com/api/v3/"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.ARK_API_KEY_CODEREVIEW }}
          # —— GitHub 集成 ——
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验深度线路评论已发布（第 1 轮 · 防假成功）
        id: verify_1
        if: ${{ github.event_name == 'pull_request' }}
        # 第 1 轮失败不当场终局（continue-on-error）：只用于触发下方换模型重试。
        # 真正决定 job 红绿的是第 2 轮校验（那里没有 continue-on-error）。
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          AI_REVIEW_ROUND: "1"
          AI_REVIEW_BEFORE: ${{ steps.pre-check.outputs.count }}
          AI_REVIEW_SELECTED_OK: ${{ steps.probe.outputs.selected_ok }}
        with:
          # 校验逻辑抽到 scripts/ai_review_verify_guard.js（单一来源，两轮共用，避免复制漂移）
          script: |
            const path = process.env.GITHUB_WORKSPACE + '/scripts/ai_review_verify_guard.js';
            await require(path)({ github, context, core });

      # ============================================================================
      # 第 2 轮（运行期故障转移，2026-09-17 新增）：仅在第 1 轮零产出时触发
      #   排除第 1 轮那个模型重新探测，换一个候选重试一次。
      #   起因：探测通过 ≠ 真实长上下文审查可用 —— 2026-09-17 PR #1567 实测「探测 glm-4.7-flash
      #   200 通过 → 真调 429（code 1305）→ 零评论」，同一轮里其它健康候选探测过却用不上
      #   （ai-review v0.76.0 只接受一套 model / endpoint / token，没有跨模型重试）。
      #   成本：只在第 1 轮已失败的运行上多花一轮 LLM + Actions 分钟（这类运行本来就得人工重跑）。
      # ============================================================================
      - name: 探测可用模型（第 2 轮 · 排除第 1 轮模型）
        id: probe_2
        if: ${{ github.event_name == 'pull_request' && steps.verify_1.outcome == 'failure' }}
        env:
          ARK_API_KEY_CODEREVIEW: ${{ secrets.ARK_API_KEY_CODEREVIEW }}
          REVIEW_TIER: ${{ steps.resolve-labels.outputs.tier }}
          # 把第 1 轮失败的那个模型排除掉（脚本直接跳过，不再浪费一次探测）
          EXCLUDE_MODELS: ${{ steps.probe.outputs.model }}
          MODEL_PRIORITY: "pro,cheap"
        run: python scripts/llm_health_probe.py

      - name: AI 深度审查（第 2 轮 · 换模型）
        id: review_2
        if: ${{ github.event_name == 'pull_request' && steps.verify_1.outcome == 'failure' }}
        continue-on-error: true
        uses: Nikita-Filonov/ai-review@v0.76.0
        with:
          review-command: run
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ".ai-review-deep.yaml"
          LLM__PROVIDER: "OPENAI"
          LLM__META__MODEL: ${{ steps.probe_2.outputs.model }}
          LLM__META__MAX_TOKENS: "16000"
          LLM__META__TEMPERATURE: "0.1"
          LLM__HTTP_CLIENT__API_URL: "https://ark.cn-beijing.volces.com/api/v3/"
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.ARK_API_KEY_CODEREVIEW }}
          VCS__PROVIDER: "GITHUB"
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ github.event.pull_request.number }}
          VCS__HTTP_CLIENT__API_URL: "https://api.github.com"
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验深度线路评论已发布（第 2 轮 · 防假成功，决定 job 红绿）
        if: ${{ github.event_name == 'pull_request' && steps.verify_1.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          AI_REVIEW_ROUND: "2"
          # 基准仍是「审查前」那一次快照：第 1 轮若产出过评论，第 1 轮校验就已放行
          AI_REVIEW_BEFORE: ${{ steps.pre-check.outputs.count }}
          AI_REVIEW_SELECTED_OK: ${{ steps.probe_2.outputs.selected_ok }}
        with:
          script: |
            const path = process.env.GITHUB_WORKSPACE + '/scripts/ai_review_verify_guard.js';
            await require(path)({ github, context, core });

      - name: 故障转移结果
        if: ${{ always() && steps.verify_1.outcome == 'failure' }}
        run: |
          if [ "${{ steps.verify_2.outcome }}" = "success" ]; then
            echo "::notice::第 1 轮（${{ steps.probe.outputs.model }}）零产出，已自动换模型（${{ steps.probe_2.outputs.model }}）重试成功。"
          else
            echo "::warning::两轮 AI 审查均未产出评论：第 1 轮 ${{ steps.probe.outputs.model }}、第 2 轮 ${{ steps.probe_2.outputs.model }}。请核对探测输出里的 429 / 额度告警。"
          fi

# PR 自动合并（绿灯即合，一劳永逸机制 Layer 2）
#
# ## 为什么需要它
#
# dev 的 branch protection 开启 enforce_admins + 必过 Check Run「质量门禁汇总」，
# 管理员也无法绕过。过去遇到「分支解完冲突仍合不进」时，只能临时放松保护——下次又得再来一次，
# 是重复人工救火。本工作流改用 GitHub 原生 auto-merge：只要 PR 挂了 `automerge` 标签，
# 在「质量门禁汇总」转绿后 GitHub 自动合并。保护一直开着（质量不丢），合是自动的，
# 不再需要人工点合、更不需要临时关保护。
#
# ## 触发与条件
#
# - 事件：PR 打开 / 同步 / 重开 / 加标签（`pull_request`，**不是** `pull_request_target`）。
# - 仅对 base=dev 的 PR 生效。
# - 仅当 PR 挂有 `automerge` 标签时启用自动合并（opt-in，避免误合）。
# - 启用是幂等的：重复调用 `gh pr merge --auto` 不会报错。
#
# ## 为什么用 `pull_request` 而不是 `pull_request_target`（#2799）
#
# 这是本工作流最关键的一处取舍，**两个理由都指向 `pull_request`**：
#
# **理由一（决定性）：`pull_request_target` 的 workflow 定义只取自默认分支，无视 base 分支。**
#
# GitHub 于 2025-12-08 生效的行为变更（官方 changelog「Actions pull_request_target and
# environment branch protections changes」）原文：
# > The pull_request_target event now always uses the default branch for workflow source
# > and reference: The workflow file and checkout commit will always be taken from the
# > repository's default branch, regardless of the pull request's base branch.
#
# 本仓默认分支是 `main`，而功能 PR 一律 base=`dev`。⇒ 走 `pull_request_target` 时，
# **跑的是 `main` 上的那一份定义**（本仓 `main` 落后 `dev` 数百个提交），
# 于是「在 dev 上改了 workflow」这件事**对这条路径完全不可见**——
# 改了什么、守卫加在哪、PAT 换成没有，跑的都还是 `main` 上那份旧的。
#
# 2026-11-01 实测（本仓 PR #2801，PR 的 base=dev 且 dev 上已含新版定义）：
# 新版里那行 `启用 auto-merge 的凭据身份：$actor` 的 echo **没有出现在日志里**，
# 取而代之的是 `main` 旧版逐字一致的文案 ⇒ 实证「定义来自默认分支」，
# 而不是来自 PR 的 base 分支。
#
# `pull_request` 事件则相反：**workflow 定义取自 PR 的 merge commit**
# （dev tip + PR head 合并结果），所以 dev 上的改动**立刻生效**。
#
# **理由二：`pull_request` 对同仓分支的 PR 同样有写权限与 secrets。**
#
# 官方文档原文：「The same is true for workflows triggered on `pull_request` from a branch
# in the same repository, but not from external forks.」本仓所有功能分支都在本仓内
# （不是 fork），故 `permissions: contents: write` 与 `secrets.AUTO_MERGE_PAT` 均可用，
# 而 `pull_request_target` 带来的「能拿到写权限」这个优势**本仓本来就用不上**。
#
# **换成 `pull_request` 后必须守住的两条边界**：
#
# 1. **不 checkout PR 代码**：本工作流只用 `gh` CLI 调 API，全程无 `actions/checkout`，
#    也不执行任何来自 PR 的文件 ⇒ 无 pwn request 面。PR 作者改不动「跑什么」，
#    只能改「这段逻辑长什么样」——而本仓 PR 只由仓库 owner 自己开。
# 2. **fork PR 必须显式跳过**：fork 的 `pull_request` 拿不到 secrets（`GH_TOKEN` 为空），
#    若不区分就会把「fork PR 没有 secret」误报成「仓库没配 PAT」而误红。
#    故先判 `head.repo.full_name == github.repository` 再继续。
#
# ## 为什么用用户 PAT 而不是 GITHUB_TOKEN（#2799）
#
# **合并归因 = 启用 auto-merge 的那个凭据**；而归因决定后续事件是否被投递。
#
# GitHub 的规则：除 `workflow_dispatch` / `repository_dispatch` 外，**由 GITHUB_TOKEN
# 触发的事件不创建 workflow run**。native auto-merge 是「排队 → 门禁转绿后由 GitHub
# 执行合并」，**合并时携带的是最后启用 auto-merge 的那个凭据的归因**——
# 于是用 GITHUB_TOKEN 启用出来的合并，其 `pull_request: closed` 与 `push` 事件全部被抑制。
#
# 2026-11-01 实测（PR #2797，本仓史上第一次 native auto-merge 合并）：
#
# | 合并归因 | `pull_request: closed` | `push` 到 dev | 后果 |
# |---|---|---|---|
# | `github-actions`（GITHUB_TOKEN） | 不产生 run | 不产生 run | issue 不自动关闭；乱码守卫 / lockfile 守卫被静默跳过 |
# | `imoyao`（用户凭据） | 产生 run | 产生 run | 正常 |
#
# 门禁本身照常 success（`质量门禁汇总` 是绿的），但**门禁下游的守卫在这条路径上是哑的**
# ——这正是「假绿」最典型的形态（#2799）。
#
# 故本步骤用**用户 PAT**（secret `AUTO_MERGE_PAT`）而不是 GITHUB_TOKEN：
# PAT 让合并归因到用户，事件随之被投递。
#
# 外部独立实证（ebi-agent-chat-relay，2026-09-22，16 次合并 1:1 相关无例外）同结论：
# "A merge attributed to GITHUB_TOKEN fires no push or pull_request event. A merge
# attributed to a real user does. The token that last enables auto-merge determines the
# eventual actor."
#
# ## PAT 缺失时为什么必须失败而不是回落
#
# 若写成 `${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}`，PAT 没配时会**静默**
# 退回 GITHUB_TOKEN ⇒ 事件又被抑制 ⇒ 假绿原样复现，而且没有任何人看得见。
# 故本步骤在 PAT 为空时**显式失败**并说明原因——把「没配 PAT」与「PR 有冲突」分开，
# 否则前者会被当成后者一直重试，直到有人发现合并从不发生。
#
# 守卫：`scripts/guard_auto_merge_user_attribution.py`（并入 ci.yml 的 scripts_test，阻断）。
# 守卫同时校验**触发器不是 `pull_request_target`**——那会把 PAT 修复锁死在默认分支上，
# 改了对这条路径不可见（#2799 的第二层根因）。
#
# ## 与 Layer 1（自动变基）配合
#
# 自动变基让分支始终基于最新 dev，冲突在源头极小；本工作流在其之上负责「绿了就合」。
# 二者合起来，未来 CNB/agent 分支的常态是：基于最新 dev → 自动变基保新 → 门禁绿就自动合 → 回同步 CNB。
#
# ## 已知边界（不在本工作流职责内）
#
# 本仓另有 6 个工作流同样用 `pull_request_target`（dependabot-auto-merge /
# dependabot-lockfile-regen / issue-claim-sync / pr-auto-rebase /
# pr-four-questions-guard / pr-overlap-guard），它们**同样只跑默认分支上的定义**。
# 这是 `pull_request_target` 的平台级行为，不是本仓独有；已另开 issue 记录，
# 不在本工作流内一并处理。

name: PR 自动合并（绿灯即合）

on:
  # ⚠️ 刻意用 `pull_request` 而非 `pull_request_target`（#2799）：
  # `pull_request_target` 的 workflow 定义只取自**默认分支**（本仓是 `main`），无视 base 分支
  # ⇒ dev 上的改动对这条路径不可见，PAT 修复永远不会被执行。
  # `pull_request` 的定义取自 **merge commit**（dev tip + PR head）⇒ dev 上的改动立刻生效。
  # 同仓分支的 `pull_request` 同样有写权限与 secrets，故不损失任何能力。详见文件头。
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # 仅 base=dev 且挂有 automerge 标签时启用（contains 对标签数组做字符串匹配，跨事件均可靠）
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      contains(toJson(github.event.pull_request.labels), 'automerge')
    steps:
      - name: 启用自动合并（门禁转绿即合）
        env:
          # ⚠️ 必须是**用户 PAT**，不能换成 secrets.GITHUB_TOKEN（#2799）：
          # 合并归因决定 `pull_request: closed` / `push` 事件是否被投递，
          # 用 GITHUB_TOKEN 会让下游守卫（issue 自动关闭、乱码扫描、lockfile 重建）
          # 在这条路径上全哑，而门禁却是绿的。详见文件头「为什么用用户 PAT」。
          # ⚠️ 刻意**不**写 `|| secrets.GITHUB_TOKEN`：PAT 缺失时静默回落 = 假绿复现。
          GH_TOKEN: ${{ secrets.AUTO_MERGE_PAT }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          # fork 判定用（见文件头「换成 pull_request 后必须守住的两条边界」）：
          # fork 的 pull_request 拿不到 secrets，须与「仓库没配 PAT」区分开，否则误红。
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 边界一：fork PR 没有 secrets（GH_TOKEN 必为空），且其代码不可信 ⇒ 显式跳过。
          # 放在 PAT 空值检查**之前**，否则会把「fork 没有 secret」误报成「仓库没配 PAT」。
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "跳过：PR 来自 fork（$HEAD_REPO ≠ $BASE_REPO），fork 的 pull_request 无 secrets，无法启用用户 PAT 归因的 auto-merge。"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::未配置 secret AUTO_MERGE_PAT（用户 PAT）。" >&2
            echo "::error::不能用 GITHUB_TOKEN 顶上——那样合并会归因到 github-actions，" >&2
            echo "::error::其 pull_request: closed / push 事件全部被抑制，" >&2
            echo "::error::下游守卫（issue 自动关闭 / 乱码扫描 / lockfile 重建）会静默失效（#2799）。" >&2
            echo "::error::配置方式：Settings → Secrets and variables → Actions →" >&2
            echo "::error::New repository secret → 名称 AUTO_MERGE_PAT → 值填用户 PAT" >&2
            echo "::error::（权限：contents:write + pull-requests:write，够用即可）。" >&2
            exit 1
          fi
          # 确认这个 PAT 真是「用户凭据」：GITHUB_TOKEN 的 API 身份是 github-actions，
          # 而 PAT 的身份是它的主人。归因看的就是这个身份。
          actor=$(gh api user --jq .login 2>/dev/null || echo "")
          if [ -z "$actor" ]; then
            echo "::error::AUTO_MERGE_PAT 无效或已过期（gh api user 失败）——请更新该 secret。" >&2
            exit 1
          fi
          echo "启用 auto-merge 的凭据身份：$actor（合并将归因到它，事件才会被投递）"
          if gh pr merge --auto --merge "$PR_URL" 2>/tmp/automerge.err; then
            echo "已为 $PR_URL 启用 auto-merge（质量门禁汇总转绿后自动合入 dev，归因到 $actor）"
          else
            # 常见：当前仍有冲突或门禁未绿。属预期，不标红——下次 synchronize 会重试。
            echo "auto-merge 暂未启用（可能仍有冲突或门禁未绿），将在后续推送时重试："
            cat /tmp/automerge.err
          fi

# FeedLog ↔ GitHub Issues 双向桥接工作流
#
# 三条通道：
#   1. FeedLog → GitHub（定时）：每 3 小时检查 FeedLog PostgreSQL 新帖子 → 创建 GitHub Issue（原每 15 分钟，降频省私有库 Actions 分钟）
#   2. GitHub → FeedLog（事件）：Issue 新建 → 建帖子；打标/关闭/重开 → 更新 FeedLog 帖子状态（真正双向）
#   3. GitHub Release → FeedLog Changelog：发布新版本 → 创建 FeedLog 更新日志
#
# 前置条件（需在仓库 Settings → Secrets 中配置）：
#   - FEEDLOG_DATABASE_URL: FeedLog PostgreSQL 直连串（不是 Cloudflare Hyperdrive ID）
#   - GH_PAT (可选): 用于 commit bridge_state.json 的 PAT（默认用 GITHUB_TOKEN）

name: FeedLog ↔ GitHub Bridge

# 降频护栏（2026-09-02）：issue 事件每发生一次都会对整个 workflow 发起一次运行，
# 今天批量打标/关闭/重开导致 179 次运行绕过降频。按 issue 编号分组并取消进行中的旧运行，
# 杜绝同 issue 并发放大；schedule/dispatch/release 无 issue 编号时回退 run_id，互不取消。
concurrency:
  group: bridge-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

on:
  # 通道 1：定时同步 FeedLog → GitHub Issues
  schedule:
    - cron: '0 */3 * * *'  # 每 3 小时（原每 15 分钟，约降为 1/5 频率，省私有库 Actions 分钟）
  workflow_dispatch:
    inputs:
      command:
        description: '手动运行模式'
        required: true
        type: choice
        default: 'feedlog-to-github'
        options:
          - feedlog-to-github
          - release-to-changelog
          - sync-github-issue
      update:
        description: 'sync-github-issue 时是否回灌覆盖已映射帖子的内容（修复乱码）'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'sync-github-issue 时指定 Issue 编号（留空同步全部）'
        required: false
        type: string
        default: ''

  # 通道 2：GitHub Issue 事件 → FeedLog（新建建帖子 + 状态回写）
  # 注意：去掉 edited —— 编辑标题/正文触发频率最高、价值最低，是今天 issue 事件放大的主要来源。
  # edited 的内容回灌能力已移至 bridge-edited-sync.yml（每日限频一次，最长延迟约一天），
  # 即编辑同步改为每日回灌而非实时，业务需接受该时效性；避免实时高频触发。
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]

  # 通道 3：GitHub Release 发布 → FeedLog Changelog
  release:
    types: [published]

jobs:
  # ============================================
  # 通道 1 & 手动：FeedLog 帖子 → GitHub Issues
  # ============================================
  feedlog-to-github:
    # 仅在定时触发或手动选择 feedlog-to-github 时运行
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'feedlog-to-github')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # ⚠️ 必须显式取 `dev`（源 CNB #586，2026-10-19）：`schedule` 只读默认分支上的
          # workflow 定义，`actions/checkout` 默认也落在默认分支 —— 而本仓 `main` 只由
          # 发版 PR（`dev` → `main`）推进，实测落后 `dev` 上百个提交。
          # 不写这一行 ⇒ 定时跑的 `scripts/bridge/feedlog_bridge.py` 是很久以前那版。
          # 判据 `guard_schedule_checkout_ref.py`。
          ref: dev


      # 恢复上一次的状态文件（必须在跑脚本之前）：脚本读它判断「哪条已同步过」。
      # 状态文件已不再 commit 回仓库（见下方 save 段与 composite action 的文件头），
      # 仓库里那份会停在最后一次提交、越来越旧——靠 cache 传递才是最新的。
      - name: 恢复上一次的状态文件
        uses: ./.github/actions/save-bridge-state
        with:
          mode: restore
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 固定大版本上限，避免上游 3.0 破坏性升级导致意外失败（保证可复现）。
        run: pip install "psycopg2-binary>=2.9,<3" "PyGithub>=2,<3"

      - name: 运行桥接脚本
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/bridge/feedlog_bridge.py feedlog-to-github

      - name: 存档状态文件（cache 传递 + artifact 审计）
        # ⚠️ 原实现是 `git commit "[skip ci]"` + **无参数** `git push`。而 schedule /
        #   issues / workflow_dispatch 事件下 `actions/checkout` 检出的是**默认分支
        #   `main`**（已核实），三件事叠加成死锁：
        #     ① `main` 是保护分支，要求 required check「质量门禁汇总」；
        #     ② `[skip ci]` 让 CI 不跑 -> required check 永远等不到结论；
        #     ③ -> `GH006: Protected branch update failed for refs/heads/main`。
        #   已实测复现：run 38499077160 的 `github-to-feedlog`。
        #   去掉 `[skip ci]` 也不行——那会让每次桥接都触发一整轮质量门禁，为一个状态
        #   文件烧掉十几分钟 Actions 分钟数。
        #
        # 状态文件可以安全地不落 Git：**防循环靠的是 FeedLog DB 里的 `system` 作者
        #   哨兵**，不是这个 json —— `feedlog_bridge.py:144-151` 的注释已写明「这比
        #   bridge_state.json 更可靠：state 靠 git 提交在并发 job 间传递，时序竞争会
        #   丢映射，而作者字段在 DB 里不会丢」。所以 cache 丢失的代价只是多建一次卡。
        uses: ./.github/actions/save-bridge-state
        with:
          mode: save
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
  github-to-feedlog:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          # ⚠️ 必须显式取 `dev`（源 CNB #586，2026-10-19）：`schedule` 只读默认分支上的
          # workflow 定义，`actions/checkout` 默认也落在默认分支 —— 而本仓 `main` 只由
          # 发版 PR（`dev` → `main`）推进，实测落后 `dev` 上百个提交。
          # 不写这一行 ⇒ 每夜跑的是很久以前的 `scripts/`。判据 `guard_schedule_checkout_ref.py`。
          ref: dev


      # 恢复上一次的状态文件（必须在跑脚本之前）：脚本读它判断「哪条已同步过」。
      # 状态文件已不再 commit 回仓库（见下方 save 段与 composite action 的文件头），
      # 仓库里那份会停在最后一次提交、越来越旧——靠 cache 传递才是最新的。
      - name: 恢复上一次的状态文件
        uses: ./.github/actions/save-bridge-state
        with:
          mode: restore
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 固定大版本上限，避免上游 3.0 破坏性升级导致意外失败（保证可复现）。
        run: pip install "psycopg2-binary>=2.9,<3" "PyGithub>=2,<3"

      - name: 解析 Issue 事件
        id: parse
        run: |
          # 提取当前 issue 的所有标签名
          LABELS=$(echo '${{ toJSON(github.event.issue.labels.*.name) }}' | jq -r '.[]' | tr '\n' ' ')
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT
          echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "action=${{ github.event.action }}" >> $GITHUB_OUTPUT

      - name: Issue 新建 → FeedLog 帖子（opened 双向补全）
        if: steps.parse.outputs.action == 'opened'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ steps.parse.outputs.labels }}
        run: |
          python scripts/bridge/feedlog_bridge.py issue-opened-to-feedlog \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --labels $ISSUE_LABELS

      - name: Issue 编辑 → 覆盖 FeedLog 帖子内容（edited 修复乱码镜像）
        # GitHub 上手动修正标题/正文（如乱码修复）后，把最新内容同步回 FeedLog
        if: steps.parse.outputs.action == 'edited'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/bridge/feedlog_bridge.py issue-edited-to-feedlog \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY"

      - name: 回写 FeedLog 状态（labeled/unlabeled/closed/reopened）
        if: steps.parse.outputs.action != 'opened' && steps.parse.outputs.action != 'edited'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          LABELS="${{ steps.parse.outputs.labels }}"
          # 如果 issue 被关闭，追加 done 标签
          if [ "${{ steps.parse.outputs.action }}" = "closed" ]; then
            LABELS="$LABELS done"
          fi
          python scripts/bridge/feedlog_bridge.py issue-to-feedlog \
            --issue-number ${{ steps.parse.outputs.issue_number }} \
            --labels $LABELS \
            --action "${{ steps.parse.outputs.action }}"

      - name: 存档状态文件（cache 传递 + artifact 审计）
        # ⚠️ 原实现是 `git commit "[skip ci]"` + **无参数** `git push`。而 schedule /
        #   issues / workflow_dispatch 事件下 `actions/checkout` 检出的是**默认分支
        #   `main`**（已核实），三件事叠加成死锁：
        #     ① `main` 是保护分支，要求 required check「质量门禁汇总」；
        #     ② `[skip ci]` 让 CI 不跑 -> required check 永远等不到结论；
        #     ③ -> `GH006: Protected branch update failed for refs/heads/main`。
        #   已实测复现：run 38499077160 的 `github-to-feedlog`。
        #   去掉 `[skip ci]` 也不行——那会让每次桥接都触发一整轮质量门禁，为一个状态
        #   文件烧掉十几分钟 Actions 分钟数。
        #
        # 状态文件可以安全地不落 Git：**防循环靠的是 FeedLog DB 里的 `system` 作者
        #   哨兵**，不是这个 json —— `feedlog_bridge.py:144-151` 的注释已写明「这比
        #   bridge_state.json 更可靠：state 靠 git 提交在并发 job 间传递，时序竞争会
        #   丢映射，而作者字段在 DB 里不会丢」。所以 cache 丢失的代价只是多建一次卡。
        uses: ./.github/actions/save-bridge-state
        with:
          mode: save
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
  sync-github-issue:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'sync-github-issue'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # ⚠️ 必须显式取 `dev`（源 CNB #586，2026-10-19）：`schedule` 只读默认分支上的
          # workflow 定义，`actions/checkout` 默认也落在默认分支 —— 而本仓 `main` 只由
          # 发版 PR（`dev` → `main`）推进，实测落后 `dev` 上百个提交。
          # 不写这一行 ⇒ 定时跑的 `scripts/bridge/feedlog_bridge.py` 是很久以前那版。
          # 判据 `guard_schedule_checkout_ref.py`。
          ref: dev


      # 恢复上一次的状态文件（必须在跑脚本之前）：脚本读它判断「哪条已同步过」。
      # 状态文件已不再 commit 回仓库（见下方 save 段与 composite action 的文件头），
      # 仓库里那份会停在最后一次提交、越来越旧——靠 cache 传递才是最新的。
      - name: 恢复上一次的状态文件
        uses: ./.github/actions/save-bridge-state
        with:
          mode: restore
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 固定大版本上限，避免上游 3.0 破坏性升级导致意外失败（保证可复现）。
        run: pip install "psycopg2-binary>=2.9,<3" "PyGithub>=2,<3"

      - name: 回灌同步 GitHub Issue → FeedLog
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          UPDATE_FLAG: ${{ inputs.update }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ARGS=""
          if [ "$UPDATE_FLAG" = "true" ]; then
            ARGS="$ARGS --update"
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            ARGS="$ARGS --issue-number $ISSUE_NUMBER"
          fi
          python scripts/bridge/feedlog_bridge.py sync-github-issue $ARGS

      - name: 存档状态文件（cache 传递 + artifact 审计）
        # ⚠️ 原实现是 `git commit "[skip ci]"` + **无参数** `git push`。而 schedule /
        #   issues / workflow_dispatch 事件下 `actions/checkout` 检出的是**默认分支
        #   `main`**（已核实），三件事叠加成死锁：
        #     ① `main` 是保护分支，要求 required check「质量门禁汇总」；
        #     ② `[skip ci]` 让 CI 不跑 -> required check 永远等不到结论；
        #     ③ -> `GH006: Protected branch update failed for refs/heads/main`。
        #   已实测复现：run 38499077160 的 `github-to-feedlog`。
        #   去掉 `[skip ci]` 也不行——那会让每次桥接都触发一整轮质量门禁，为一个状态
        #   文件烧掉十几分钟 Actions 分钟数。
        #
        # 状态文件可以安全地不落 Git：**防循环靠的是 FeedLog DB 里的 `system` 作者
        #   哨兵**，不是这个 json —— `feedlog_bridge.py:144-151` 的注释已写明「这比
        #   bridge_state.json 更可靠：state 靠 git 提交在并发 job 间传递，时序竞争会
        #   丢映射，而作者字段在 DB 里不会丢」。所以 cache 丢失的代价只是多建一次卡。
        uses: ./.github/actions/save-bridge-state
        with:
          mode: save
          path: scripts/bridge/bridge_state.json
          cache-key-prefix: feedlog-bridge
  release-to-changelog:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'release-to-changelog')
    runs-on: ubuntu-latest

    steps:
      # 本 job 不读也不写 bridge_state.json（只往 FeedLog 追 Changelog），
      # 故刻意**不**插入状态文件 restore —— 少一次无意义的 cache 恢复。
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          # ⚠️ 必须显式取 `dev`（源 CNB #586，2026-10-19）：`schedule` 只读默认分支上的
          # workflow 定义，`actions/checkout` 默认也落在默认分支 —— 而本仓 `main` 只由
          # 发版 PR（`dev` → `main`）推进，实测落后 `dev` 上百个提交。
          # 不写这一行 ⇒ 每夜跑的是很久以前的 `scripts/`。判据 `guard_schedule_checkout_ref.py`。
          ref: dev

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        # 固定大版本上限，避免上游 3.0 破坏性升级导致意外失败（保证可复现）。
        run: pip install "psycopg2-binary>=2.9,<3" "PyGithub>=2,<3"

      - name: 同步 Release 到 FeedLog Changelog
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/bridge/feedlog_bridge.py release-to-changelog \
            --tag "${{ github.event.release.tag_name }}" \
            --name "${{ github.event.release.name }}" \
            --body "${{ github.event.release.body }}" \
            --published-at "${{ github.event.release.published_at }}"

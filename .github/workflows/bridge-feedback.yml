# FeedLog ↔ GitHub Issues 双向桥接工作流
#
# 三条通道：
#   1. FeedLog → GitHub（定时）：每 3 小时检查 FeedLog PostgreSQL 新帖子 → 创建 GitHub Issue（原每 15 分钟，降频省私有库 Actions 分钟）
#   2. GitHub → FeedLog（事件）：Issue 新建 → 建帖子；打标/关闭/重开 → 更新 FeedLog 帖子状态（真正双向）
#   3. GitHub Release → FeedLog Changelog：发布新版本 → 创建 FeedLog 更新日志
#
# 前置条件（需在仓库 Settings → Secrets 中配置）：
#   - FEEDLOG_DATABASE_URL: FeedLog PostgreSQL 直连串（不是 Cloudflare Hyperdrive ID）
#   - GH_PAT (可选): 用于 commit bridge_state.json 的 PAT（默认用 GITHUB_TOKEN）

name: FeedLog ↔ GitHub Bridge

# 降频护栏（2026-09-02）：issue 事件每发生一次都会对整个 workflow 发起一次运行，
# 今天批量打标/关闭/重开导致 179 次运行绕过降频。按 issue 编号分组并取消进行中的旧运行，
# 杜绝同 issue 并发放大；schedule/dispatch/release 无 issue 编号时回退 run_id，互不取消。
concurrency:
  group: bridge-issue-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

on:
  # 通道 1：定时同步 FeedLog → GitHub Issues
  schedule:
    - cron: '0 */3 * * *'  # 每 3 小时（原每 15 分钟，约降为 1/5 频率，省私有库 Actions 分钟）
  workflow_dispatch:
    inputs:
      command:
        description: '手动运行模式'
        required: true
        type: choice
        default: 'feedlog-to-github'
        options:
          - feedlog-to-github
          - release-to-changelog
          - sync-github-issue
      update:
        description: 'sync-github-issue 时是否回灌覆盖已映射帖子的内容（修复乱码）'
        required: false
        type: boolean
        default: false
      issue_number:
        description: 'sync-github-issue 时指定 Issue 编号（留空同步全部）'
        required: false
        type: string
        default: ''

  # 通道 2：GitHub Issue 事件 → FeedLog（新建建帖子 + 状态回写）
  # 注意：去掉 edited —— 编辑标题/正文触发频率最高、价值最低，是今天 issue 事件放大的主要来源。
  # edited 的内容回灌能力已移至 bridge-edited-sync.yml（每日限频一次），避免实时高频触发。
  issues:
    types: [opened, labeled, unlabeled, closed, reopened]

  # 通道 3：GitHub Release 发布 → FeedLog Changelog
  release:
    types: [published]

jobs:
  # ============================================
  # 通道 1 & 手动：FeedLog 帖子 → GitHub Issues
  # ============================================
  feedlog-to-github:
    # 仅在定时触发或手动选择 feedlog-to-github 时运行
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'feedlog-to-github')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install psycopg2-binary PyGithub

      - name: 运行桥接脚本
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/bridge/feedlog_bridge.py feedlog-to-github

      - name: 提交状态文件
        # 仅当 bridge_state.json 有变更时提交
        run: |
          if git diff --quiet scripts/bridge/bridge_state.json; then
            echo "📭 状态文件无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/bridge/bridge_state.json
            git commit -m "chore: 更新 FeedLog 桥接状态 [skip ci]"
            git push
            echo "✅ 已提交状态文件"
          fi

  # ============================================
  # 通道 2：GitHub Issue 标签/关闭 → FeedLog 状态
  # ============================================
  github-to-feedlog:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install psycopg2-binary PyGithub

      - name: 解析 Issue 事件
        id: parse
        run: |
          # 提取当前 issue 的所有标签名
          LABELS=$(echo '${{ toJSON(github.event.issue.labels.*.name) }}' | jq -r '.[]' | tr '\n' ' ')
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT
          echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          echo "action=${{ github.event.action }}" >> $GITHUB_OUTPUT

      - name: Issue 新建 → FeedLog 帖子（opened 双向补全）
        if: steps.parse.outputs.action == 'opened'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ steps.parse.outputs.labels }}
        run: |
          python scripts/bridge/feedlog_bridge.py issue-opened-to-feedlog \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY" \
            --labels $ISSUE_LABELS

      - name: Issue 编辑 → 覆盖 FeedLog 帖子内容（edited 修复乱码镜像）
        # GitHub 上手动修正标题/正文（如乱码修复）后，把最新内容同步回 FeedLog
        if: steps.parse.outputs.action == 'edited'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python scripts/bridge/feedlog_bridge.py issue-edited-to-feedlog \
            --issue-number "$ISSUE_NUMBER" \
            --title "$ISSUE_TITLE" \
            --body "$ISSUE_BODY"

      - name: 回写 FeedLog 状态（labeled/unlabeled/closed/reopened）
        if: steps.parse.outputs.action != 'opened' && steps.parse.outputs.action != 'edited'
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          LABELS="${{ steps.parse.outputs.labels }}"
          # 如果 issue 被关闭，追加 done 标签
          if [ "${{ steps.parse.outputs.action }}" = "closed" ]; then
            LABELS="$LABELS done"
          fi
          python scripts/bridge/feedlog_bridge.py issue-to-feedlog \
            --issue-number ${{ steps.parse.outputs.issue_number }} \
            --labels $LABELS \
            --action "${{ steps.parse.outputs.action }}"

      - name: 提交状态文件（记录新建映射）
        if: steps.parse.outputs.action == 'opened'
        run: |
          if git diff --quiet scripts/bridge/bridge_state.json; then
            echo "📭 状态文件无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/bridge/bridge_state.json
            git commit -m "chore: 更新 FeedLog 桥接状态 [skip ci]"
            git push
            echo "✅ 已提交状态文件"
          fi

  # ============================================
  # 手动回灌：GitHub Issue → FeedLog（含 --update 覆盖修复乱码镜像）
  # ============================================
  sync-github-issue:
    if: github.event_name == 'workflow_dispatch' && inputs.command == 'sync-github-issue'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install psycopg2-binary PyGithub

      - name: 回灌同步 GitHub Issue → FeedLog
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          UPDATE_FLAG: ${{ inputs.update }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          ARGS=""
          if [ "$UPDATE_FLAG" = "true" ]; then
            ARGS="$ARGS --update"
          fi
          if [ -n "$ISSUE_NUMBER" ]; then
            ARGS="$ARGS --issue-number $ISSUE_NUMBER"
          fi
          python scripts/bridge/feedlog_bridge.py sync-github-issue $ARGS

      - name: 提交状态文件（记录新建映射）
        run: |
          if git diff --quiet scripts/bridge/bridge_state.json; then
            echo "📭 状态文件无变化，跳过提交"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add scripts/bridge/bridge_state.json
            git commit -m "chore: 更新 FeedLog 桥接状态 [skip ci]"
            git push
            echo "✅ 已提交状态文件"
          fi

  # ============================================
  # 通道 3：GitHub Release → FeedLog Changelog
  # ============================================
  release-to-changelog:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.command == 'release-to-changelog')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install psycopg2-binary PyGithub

      - name: 同步 Release 到 FeedLog Changelog
        env:
          FEEDLOG_DATABASE_URL: ${{ secrets.FEEDLOG_DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/bridge/feedlog_bridge.py release-to-changelog \
            --tag "${{ github.event.release.tag_name }}" \
            --name "${{ github.event.release.name }}" \
            --body "${{ github.event.release.body }}" \
            --published-at "${{ github.event.release.published_at }}"

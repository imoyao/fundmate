# 每日定时调度（#1182 落地 / #1434 修复）
#
# 不引入常驻调度器：由本 workflow 的 schedule 触发器每日跑一次 `pdm run scheduler`，
# 复用 DataSyncOrchestrator 执行全量增量同步（fund_nav 刷新净值）+ 资产快照落账
# （asset_snapshot job 写入 AssetSnapshot，含货基每日收益 #863 P1-5）。
#
# 部署说明：
#   - 本 workflow 直接在 CI runner 上跑 scheduler，需能访问生产 DB（通过 secrets 注入
#     DATABASE_URL / SUPABASE_* / APP_ENV 等）。若生产库不希望对 CI 开放，可改用：
#       a) 系统 cron / SCF cron 在部署服务器上执行 `pdm run scheduler`；或
#       b) 本 schedule 改为 curl 打到部署服务器的受保护 webhook（需自行实现触发端点）。
#   - 单 job 失败不中断整体（Orchestrator 已捕获并继续），但 scheduler 进程遇未捕获异常
#     会以退出码 1 结束，本 workflow 随之标红，并由末尾「失败告警」步骤自动开/更新 issue。
#   - 失败审计：每个 job 的结果已写入 SyncLog（Orchestrator._save_sync_log），可在库内追溯。
#
# ── #1490 修复要点（2026-10-21）──
#   0) **根因**：market 域走 Turso，连接串**必须带 authToken**。此前本 workflow 只注入
#      `DATABASE_URL`，而那条 secret 里的连接串只有 host、没有 `?authToken=` ⇒
#      服务端回 308，调度自 2026-09-04 起 **25 次全红、零成功**（数据新鲜度断了一个多月）。
#      现在同时注入 `TURSO_DATABASE_URL`（production 下**优先**用它，见
#      `backend/app/core/db_factory.py::resolve_app_db`），并在 secrets 预检里
#      提前判定「缺 authToken」——一分钟内失败，而不是等装完依赖再撞一个看不懂的 308。
#
# ── #1434 修复要点 ──
#   1) 调度分支：`schedule` 事件只读取**默认分支（main）**上的本文件，而 main 长期落后 dev。
#      故 workflow 定义仍从 main 读取，但 **checkout 显式取 `SCHEDULER_REF`（默认 dev）**，
#      保证实际执行的是 dev 代码，而不是 main 上的旧代码。
#   2) secrets 预检：必需 secrets 缺失时**立即失败并列出缺失项**。此前 workflow 把不存在的
#      secret 展开成**空串**注入 env，覆盖了代码里的默认值 → `create_engine('')` →
#      `sqlalchemy.exc.ArgumentError`，启动即崩且真因不可见（连续 7 天全红无人知）。
#   3) 失败告警：job 失败时自动开/更新一个 tracking issue（见 job 末尾），不再静默。
#   4) 告警生命周期（2026-09-18 补）：**成功运行即自动关闭**仍开着的告警卡——
#      「7 天全红无人知」的另一半是「恢复了也没人收口」，自愈型告警是通行做法。
name: 每日定时调度

on:
  schedule:
    # 每天 UTC 17:00（北京时间次日凌晨 01:00）跑一次
    - cron: '0 17 * * *'
  # 手动触发，便于验证
  workflow_dispatch: {}

concurrency:
  group: daily-scheduler
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # 失败告警需要开/更新 issue

env:
  # 实际执行代码的分支（main 只承载 workflow 定义）——见文件头 #1434 说明 1)
  SCHEDULER_REF: dev

jobs:
  daily-scheduler:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码（ref=${{ env.SCHEDULER_REF }}）
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SCHEDULER_REF }}

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 PDM
        run: pip install pdm

      - name: 安装依赖
        env:
          # backend/pdm.toml 强制 use_uv=true，但 CI runner 上 uv 不支持 PEP 582；
          # 用环境变量覆盖项目配置回退 pip 安装
          PDM_USE_UV: "false"
        run: pdm install -G dev

      - name: 校验必需 secrets（缺失即快速失败）
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          missing=""
          for name in APP_ENV DATABASE_URL SUPABASE_DATABASE_URL; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=缺少必需 secrets::未配置：$missing"
            echo "请在仓库 Settings → Secrets and variables → Actions 配置后重跑（见 #1434）。"
            echo "（APP_ENV=${APP_ENV:-<空>}，执行 ref=$SCHEDULER_REF）"
            exit 1
          fi
          echo "secrets 预检通过（APP_ENV=$APP_ENV）"

          # #1490：缺 authToken 的 Turso 连接串**必然连不上**（服务端回 308/401），
          # 而这两种状态码都看不出「压根没配 token」。此前只注入无 token 的
          # DATABASE_URL ⇒ 每日调度连续 25 天全红、零成功（2026-09-04 起）。
          # 这里提前一分钟失败，而不是等装完依赖再撞 308。
          #
          # 生效优先级：TURSO_DATABASE_URL > DATABASE_URL（backend/app/core/db_factory.py）
          EFFECTIVE_DB_URL="${TURSO_DATABASE_URL:-$DATABASE_URL}"
          case "$EFFECTIVE_DB_URL" in
            turso://*|libsql://*|https://*.turso.io*)
              case "$EFFECTIVE_DB_URL" in
                *authToken=*|*auth_token=*) ;;
                *)
                  echo "::error title=数据库连接串缺 authToken::生效的连接串（${EFFECTIVE_DB_URL%%\?*}）里没有 authToken，必然连不上。"
                  echo "请把 Turso 控制台给出的完整连接串（turso://<host>?authToken=<token>）写进对应 secret（优先 TURSO_DATABASE_URL）。"
                  exit 1
                  ;;
              esac
              ;;
          esac

      - name: 运行每日调度
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # production 下 market 域**优先**用 TURSO_DATABASE_URL（见 db_factory.resolve_app_db），
          # 且它才是 Turso 控制台直接下发的完整连接串（含 authToken）。
          # #1490：此前只注入 DATABASE_URL（当时那条 secret 里没有 authToken），
          # 每日调度自 2026-09-04 起 25 次全红、零成功。
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_ENABLED: ${{ secrets.AUTH_ENABLED }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: pdm run scheduler

      # job 级失败明细（#2457）：调度进程在「有 job 失败」时以退出码 2 结束
      # （EXIT_JOB_FAILED，见 backend/app/tools/scheduler.py），
      # 于是本 workflow 判红、下面那张告警卡会被建/更新。
      # 但卡片正文若只写「运行失败」，排查的人还得自己翻 20 个 job 的日志——
      # 这里把逐 job 状态渲染成可直接贴进卡片正文的片段。
      # 摘要文件不存在时也要如实说「无法确认 job 级结果」，不能当成「无失败」。
      - name: 渲染 job 级失败明细
        if: always()
        id: job-failures
        run: |
          set -euo pipefail
          python3 ../scripts/daily_run_alert.py \
            --summary data/last_run_summary.json \
            --github-output "$GITHUB_OUTPUT"

      - name: 失败告警（自动开/更新 issue）
        if: failure()
        uses: actions/github-script@v7
        env:
          JOB_FAILURE_DETAIL: ${{ steps.job-failures.outputs.job_failure_detail }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '【自动告警】每日调度 daily-snapshot 失败';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              '每日调度 workflow 运行失败（#1434）。',
              '',
              `- 触发事件：\`${context.eventName}\``,
              `- workflow 定义分支：\`${context.ref}\``,
              `- 执行代码 ref：\`${process.env.SCHEDULER_REF || 'dev'}\``,
              `- 时间（UTC）：${new Date().toISOString()}`,
              `- 运行日志：${runUrl}`,
              '',
              '### job 级结果',
              process.env.JOB_FAILURE_DETAIL || '（未取到 job 级明细，请直接看运行日志）',
              '',
              '> 本 issue 由 workflow 自动创建/更新；下次调度成功时会自动关闭（见末尾步骤）。',
            ].join('\n');

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = openIssues.find(
              (it) => it.title === title && !it.pull_request,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              core.notice(`已评论既有告警 issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body,
              });
              core.notice(`已创建告警 issue #${created.data.number}`);
            }

      # 告警生命周期收口（#1434）：「7 天全红无人知」的另一半是「恢复了也没人收口」——
      # 成功运行即自动关闭仍开着的告警卡，避免「已恢复但卡还开着」的假信号（自愈型告警的通行做法）。
      - name: 调度成功则自动关闭告警 issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '【自动告警】每日调度 daily-snapshot 失败';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100,
            });
            const existing = openIssues.find(
              (it) => it.title === title && !it.pull_request,
            );
            if (!existing) {
              core.info('没有开着的告警 issue，无需关闭');
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: [
                '本次每日调度**已成功**，自动关闭本告警卡。',
                '',
                `- 时间（UTC）：${new Date().toISOString()}`,
                `- 运行日志：${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                '> 若再次失败，workflow 会重新开/复用本卡（见 #1434）。',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number,
              state: 'closed', state_reason: 'completed',
            });
            core.notice(`已自动关闭告警 issue #${existing.number}`);

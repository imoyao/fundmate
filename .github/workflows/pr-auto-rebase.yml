# PR 自动变基（保新，一劳永逸机制 Layer 1）
#
# ## 为什么需要它
#
# CNB / agent 分支常基于陈旧 dev 开出，同步到 GitHub 时已落后几十个提交，
# 于是出现「落后 51 提交」的巨无霸分支，合并时冲突爆炸（#450 系列即此典型）。
# 本工作流在 PR 有新推送、或每日定时时，把 PR 分支 rebase 到最新 dev 并 force-push，
# 使分支始终基于最新 dev——冲突在源头就很小甚至没有。
#
# ## 触发
#
# - PR synchronize：CNB/agent 每推一次即变基一次（保持当前）。
# - 每日定时（UTC 02:17，错峰）：把全部 open 且落后 dev 的 PR 变基一遍。
# - workflow_dispatch：手动补跑。
#
# ## 安全闸门（绝不盲目强推）
#
# 1. 仅同仓 PR（head repo = imoyao）；fork PR 无法用本仓 token 推送，跳过。
# 2. 跳过挂 `no-bot-rebase` 标签的 PR（人工接管时用）。
# 3. 仅当分支确实落后 dev（dev 不是其祖先）才变基；已最新则跳过。
# 4. rebase 遇冲突立即 abort，留评论让人处理，绝不 `--abort` 后再强推半成品。
# 5. 推送用 `--force-with-lease`，避免覆盖他人并发推送。
# 6. 变基 push 由 GITHUB_TOKEN 发出 ⇒ 该分支 pull_request 的新 runs 进入
#    approval-required（GitHub 官方递归防护，docs: GITHUB_TOKEN 页），不批准
#    则 CI 挂死零 job。push 后按新 head_sha 轮询并自动批准（#2289）。
#    轮询逻辑在 `scripts/pr_autorebase_approve.py`（#2419）：内联的「3 轮 × 10s +
#    status=action_required」窗口实测太短，且把「还没索引到」读成「无需批准」。
# 7. ⚠️ **生效前提**：`pull_request_target` 的 workflow **定义**取自默认分支 `main`
#    （实测见 docs/dev/github-action.md：main 33/33 行命中日志、dev 的批准循环 0 行），
#    所以本文件合入 `dev` 只是第一步 —— 要等发版 PR（dev → main）才会真正执行。
#    在那之前 bot 推送的分支仍会卡在 approval-required，需人工点 Approve。
#    检出用 `ref: dev` + `git show origin/dev:<脚本>`，只能保证**执行内容**是新的，
#    保证不了**定义**是新的。

name: PR 自动变基（保新）

on:
  pull_request_target:
    types: [synchronize]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write  # 变基后自动批准 approval-required 的 CI runs（#2289，已实验证实 GITHUB_TOKEN 可批）

jobs:
  rebase:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.pull_request.base.ref == 'dev'
    steps:
      - uses: actions/checkout@v5
        with:
          # `schedule` 下 `checkout` 默认落在**默认分支 `main`**（只由发版 PR 推进，
          # 落后 dev 上百个提交），而本 job 现在要跑 `scripts/pr_autorebase_approve.py`。
          # 显式写 dev：否则每夜那次跑的是很久以前的脚本（源 CNB #586，
          # 判据 scripts/guard_schedule_checkout_ref.py）。
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 变基 PR 分支到最新 dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ⚠️ 表达式一律先落 env，再用 $VAR 引用 —— 直接写进 run: 块会与 shell 代码拼接。
          # pull_request_target 下 head.ref 由外部用户控制（分支名可由任意人建），
          # 曾被 CodeQL 判为 critical 注入。event_name 同块统一处理，避免一半内插一半引用。
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev

          # 自动批准（#2419）的两项前置：解释器在、逻辑脚本在。
          # 两者缺任一个都是「机制完全没跑」，不是「偶尔查不到」——显式红，别静默降级。
          command -v python3 >/dev/null 2>&1 || {
            echo "::error::runner 上没有 python3 —— 变基后的自动批准无法执行，该 PR 的 CI 会挂死"
            exit 1
          }
          # 脚本从**基分支 dev** 取一份落盘：下面的循环会 checkout 到各 PR 分支，
          # 老分支上可能根本没有这个文件，不能就地引用。
          APPROVE_SCRIPT=$(mktemp)
          if ! git show "origin/dev:scripts/pr_autorebase_approve.py" > "$APPROVE_SCRIPT" 2>/dev/null; then
            echo "::error::origin/dev 上缺 scripts/pr_autorebase_approve.py —— 变基后的自动批准无法执行，该 PR 的 CI 会挂死"
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            BRANCHES="$PR_HEAD_REF"
          else
            # schedule / workflow_dispatch：列出所有 base=dev 的 open PR 头部分支
            BRANCHES=$(gh pr list --base dev --state open --json headRefName --jq '.[].headRefName')
          fi

          [ -z "${BRANCHES:-}" ] && { echo "无可变基分支"; exit 0; }

          for b in $BRANCHES; do
            echo "---- 处理 $b ----"
            # 1) fork 跳过
            HEAD_OWNER=$(gh pr view "$b" --json headRepositoryOwner --jq '.headRepositoryOwner.login' 2>/dev/null || true)
            if [ "$HEAD_OWNER" != "imoyao" ]; then
              echo "跳过 $b（fork 分支，本仓 token 无法推送）"; continue
            fi
            # 2) 人工接管标签跳过
            if gh pr view "$b" --json labels --jq '.labels[].name' | grep -qx "no-bot-rebase"; then
              echo "跳过 $b（no-bot-rebase 标签）"; continue
            fi
            # 3) 已最新则跳过
            git fetch origin "$b"
            if git merge-base --is-ancestor origin/dev "origin/$b"; then
              echo "$b 已包含最新 dev，跳过"; continue
            fi
            # 4) 变基，冲突即 abort 并留言
            git checkout -B "$b" "origin/$b"
            if git rebase origin/dev "$b"; then
              git push --force-with-lease origin "$b"
              echo "✅ $b 已变基到最新 dev"
              # 自动批准变基产生的 approval-required runs（#2289；逻辑抽到脚本见 #2419）：
              # 旧实现内联在此，3 轮 × sleep 10 + `status=action_required` 过滤 —— 窗口太短，
              # 且过滤后为空时「没有待批」与「还没索引到」长得一模一样（AGENTS.md「空 ≠ 没拿到」）。
              # 脚本改为取全量 runs 再筛、窗口 180s、命中即收工，并按失败态分码：
              #   rc 2 拿不到输入 / rc 3 批准失败 / seen=0 打 ::warning:: 注解。
              NEW_SHA=$(git rev-parse HEAD)
              set +e
              python3 "$APPROVE_SCRIPT" --repo "$REPO" --sha "$NEW_SHA"
              APPROVE_RC=$?
              set -e
              # 2 / 3 不把整个变基判红（分支已经推好了，报「变基失败」是失实），
              # 但必须以注解浮到 run 页面上 —— 只写进日志就等于没写。
              if [ "$APPROVE_RC" -ne 0 ]; then
                echo "::warning::变基后自动批准未完成（rc=$APPROVE_RC）——$b 的 CI 可能挂死，请到 Actions 页人工批准"
              fi
            else
              git rebase --abort || true
              echo "⚠️ $b 与 dev 存在冲突，放弃自动变基"
              gh pr comment "$b" --body "🤖 自动变基失败：本分支与 \`dev\` 存在冲突，未能自动 rebase。请手动处理：\`\`\`bash\ngit fetch origin dev && git rebase origin/dev\n\`\`\` 解决冲突后强推本分支。" || true
            fi
          done

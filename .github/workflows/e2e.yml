# 前端 E2E（Playwright）——**不进 per-PR 门禁**，定时 / 手动触发（#1568）
#
# 为什么不挂在 PR 上：
#   1) 浏览器运行时要下 ~130MB 的 Chromium（缓存命中前），且要跑一次完整 dev server；
#   2) 本仓 CI 的定位是「快速红灯」（ci.yml 的 gate 是合并必需检查），把 E2E 塞进去
#      会把每次 PR 的等待时间显著拉长，收益却只在「改了守卫 / 布局 / store 联动」时才体现。
#   因此本 workflow 只做两件事：**每夜跑一次**（捕捉悄悄回归）+ **手动触发**（改动相关文件后自证）。
#   真要把某类 PR 也纳入，建议按 label 触发（如 `e2e`），不要全量开。
#
# 本地跑法：`cd frontend && pnpm test:e2e`（自带 dev server，端口 8849，不依赖后端与真实 Supabase）。

name: 前端 E2E（Playwright）

on:
  # 手动触发：改动路由守卫 / 布局 / store 后自证
  workflow_dispatch: {}
  # 每夜 19:00 UTC（＝北京次日 03:00），与 daily-snapshot（17:00 UTC）错开
  schedule:
    - cron: "0 19 * * *"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: 前端 E2E（Chromium）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与根 package.json 的 packageManager 一致（#1520）
          version: 9.15.9

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（frozen-lockfile）
        run: pnpm install --frozen-lockfile

      # 浏览器缓存：key 跟随 @playwright/test 的版本（browser build 与版本强绑定），
      # 未命中时才下载（~130MB），命中后本步只做存在性校验。
      - name: 解析 Playwright 版本
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 安装 Chromium（缓存未命中时）
        run: pnpm exec playwright install --with-deps chromium

      - name: 跑 E2E
        run: pnpm test:e2e

      - name: 上传失败现场（报告 + 截图 + trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

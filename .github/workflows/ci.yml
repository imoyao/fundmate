# 质量门禁 CI（PR 自动触发）
#
# 覆盖本机常漏跑的命令（前端 husky 因 ignore-scripts 未装、后端 pre-commit 偶崩）：
#   - 后端：ruff 检查 + 格式化检查 + pytest（排除需联网的 slow 测试）
#   - 前端：typecheck + lint(检查模式) + build
#
# 路径过滤：仅当对应目录改动时才跑对应 job，节省私有库 Actions 分钟数。
# 建议：在仓库 branch protection 中将本工作流的两个 job 设为 required status check，
#       这样 merge 前强制卡人（光有 workflow 不卡 merge）。
#
# 注意：后端依赖走阿里云镜像且含 gitee 上的 xalpha，海外 runner 安装可能偏慢；
#       若 install 超时，可将 PDM 源改为官方 PyPI 提速（不影响本项目配置）。

name: 质量门禁 CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 防直推卡点：直接 push 到受保护分支 M 时，下方 guard-direct-push job 会拦截。
  # 通过 PR 合并的 push 属于 pull_request 事件，不会触发本 push 卡点。
  push:
    branches:
      - M

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter 需要 pull-requests:read 才能通过 GITHUB_TOKEN 拉取 PR 改动文件列表，
  # 否则报 "Resource not accessible by integration"
  pull-requests: read

jobs:
  # 计算哪些目录有改动，决定下方 job 是否运行
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: 后端测试 + Lint
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 PDM
        run: pip install pdm

      # dev 组含 ruff / pytest / invoke 等
      - name: 安装依赖
        env:
          # backend/pdm.toml 强制 use_uv=true，但 CI runner 上 uv 不支持 PEP 582；
          # 用环境变量覆盖项目配置回退 pip 安装
          PDM_USE_UV: "false"
        run: pdm install -G dev

      - name: Ruff 检查
        run: pdm run ruff check .

      - name: Ruff 格式化检查
        run: pdm run ruff format --check .

      # 守卫：禁止 @bp.input() 自动范式回潮（#973 / tech-debt.md §57）
      - name: 守卫:禁止 @bp.input 自动范式
        run: python ../scripts/forbid_bp_input.py

      # 单进程（避 OOM），排除需联网的 slow 测试
      - name: 运行测试
        run: pdm run python -m pytest -p no:xdist -m "not slow"

  # 乱码守卫（mojibake）：防止任何绕过本地 pre-commit 钩子的提交（--no-verify、
  # 或经 gh api / MCP 直推导致本地钩子不执行）把 GBK 乱码合进 PR。
  # 仅扫描 PR 变更文件，避免误伤 legacy/ 中已存档的 26 个历史乱码文档。
  mojibake-guard:
    name: 乱码守卫 (mojibake)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 检查 PR 变更文件编码
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$base" "$head" -- '*.md' '*.py' '*.vue')
          echo "PR 变更文本文件数：${#files[@]}"
          if [ ${#files[@]} -gt 0 ]; then
            pip install ftfy >/dev/null
            python scripts/guard_mojibake.py "${files[@]}"
          fi

  frontend:
    name: 前端类型检查 + Lint + 构建
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（frozen-lockfile 校验 lock 一致性）
        run: pnpm install --frozen-lockfile

      # 守卫：lock 文件与 package.json 必须同步（#974 / tech-debt.md §62 收尾）。
      # pnpm v9 的 frozen-lockfile 在 lock 落后于 package.json 时会自动降级为普通安装，
      # 此处显式比对 specifier 与解析版本，杜绝「本地能跑、CI 装到不同版本」。
      - name: 守卫:lock 与 package.json 一致性
        run: node ../scripts/check_lock_consistency.mjs

      - name: 类型检查
        run: pnpm typecheck

      # 检查模式（不带 --fix），有问题即失败，确保门禁有效
      - name: Lint 检查
        run: |
          pnpm exec eslint "{src,mock,build}/**/*.{vue,js,ts,tsx}" --max-warnings 0
          pnpm exec prettier --check "src/**/*.{js,ts,json,tsx,css,scss,vue,html}"
          pnpm exec stylelint "**/*.{html,vue,css,scss}" --cache-location node_modules/.cache/stylelint/

      - name: 构建
        run: pnpm build

  # 防直推卡点（替代 GitHub Pro 才有的 branch protection）
  # 私有仓库无 branch protection，用此 job 拦截「直接 push 到 M」的行为：
  # 正常流程是 fork/分支 → PR → merge，merge 产生的 push 属 pull_request 事件不触发本 job；
  # 只有「本地直接 git push origin M」才会触发并失败。
  guard-direct-push:
    name: 禁止直接 push 到 M（请走 PR）
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/M' }}
    runs-on: ubuntu-latest
    steps:
      - name: 拦截直推
        run: |
          echo "::error::检测到直接向主分支 M 推送。请改用 PR 流程：从 M 切出分支 → 提交 → 开 PR → review 后合并。"
          echo "::error::Direct push to main branch M is blocked. Use a PR instead."
          exit 1

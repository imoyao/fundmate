# 质量门禁 CI（PR 自动触发）
#
# 覆盖本机常漏跑的命令（前端 husky 因 ignore-scripts 未装、后端 pre-commit 偶崩）：
#   - 后端：ruff 检查 + 格式化检查 + pytest（排除需联网的 slow 测试）
#   - 前端：typecheck + lint(检查模式) + build
#
# 路径过滤：仅当对应目录改动时才跑对应 job，节省私有库 Actions 分钟数。
#
# 合并门禁（2026-09-11 实开）：本工作流的 `质量门禁汇总`（job id `gate`）已设为
#   dev / main 的 required status check —— merge 前强制卡人。光有 workflow 不卡 merge，
#   必须配 branch protection；而 protection 仅在仓库为 public（或账户为付费计划）时可用，
#   切回 private 后会失效（届时门禁退回「可见但不阻止」，须人工把关，见 AGENTS.md 项目概述）。
#
# 依赖源（#1628 → #2031 根治）：pyproject.toml 不再声明 [[tool.pdm.source]]。
#   本机开发者用机器级 `pdm config pypi.url` 配阿里云（国内快，见 AGENTS.md）；
#   CI runner 无此配置 → PDM 默认官方 PyPI（海外 runner 实测 81.99 MB/s vs 阿里云 0.08 MB/s，
#   冷启动若走阿里云会拖到 20+ 分钟并撞下方 30 分钟 job 上限），无需任何改写步骤。

name: 质量门禁 CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # 预算保护：仅在 PR 目标为 dev / main 时跑质量门禁，避免 feature 分支间 PR 重复消耗分钟数。
    branches:
      - dev
      - main
  # 防直推卡点：直接 push 到受保护分支 main 时，下方 guard-direct-push job 会拦截。
  # 重要事实修正（#1771）：GitHub 合并 PR 到 main 时【同时】发出 push 事件
  #   （github.event.push），故本工作流在 push 到 main 时【也会触发】；
  #   guard-direct-push 已用「是否关联已合并 PR」区分：PR 合并产生的 push 放行，
  #   真正的本地直推（无关联 PR）才拦截。
  #   质量门禁类 job（changes / backend / frontend / layout_guard）已限定仅
  #   pull_request 事件运行，故 push 场景只跑 guard-direct-push，不会误跑全量门禁。
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter 需要 pull-requests:read 才能通过 GITHUB_TOKEN 拉取 PR 改动文件列表，
  # 否则报 "Resource not accessible by integration"
  pull-requests: read

jobs:
  # 计算哪些目录有改动，决定下方 job 是否运行
  changes:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # 镜像/回写脚本的回归网住在 backend/tests/ 下（镜像侧源 #118，回写侧源 #2）：
              # 脚本本身改了、或对应 workflow 改了，都必须把后端 job 唤起，
              # 否则「只改脚本 / 只改 workflow」的 PR 会让那份回归网静默不跑。
              - 'scripts/bridge/**'
              - 'scripts/guard_no_duplicate_pie.py'
              - '.github/workflows/cnb-github-backfill.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: 后端测试 + Lint (${{ matrix.shard }})
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    # 分片并行 + xdist（激进试跑，源 PR #2266）：2 片 × 每片 -n auto（4 worker）≈ 8 路。
    # 线上 runner 4C/16G/14G盘：两片各在独立 runner（独立内存/磁盘）+ 每片 4 worker 跑不相交子集；
    # 磁盘合计≈单跑（#1821 的 TEMP 爆盘是「保留全部×3 会话」所致，已被 retention 治住，非 xdist 之过）。
    # 本地 OOM/磁盘顾虑 ≠ 线上成立——先激进跑通，有报错再按实际调（真 OOM 就 -n 2 / 加细片）。
    # 用 matrix 而非新增 job：**job 数不变 ⇒ 不用动下面 gate.needs**（#1559/#1560 两次都是
    # 合并冲突把 gate.needs 里的 job 弄丢）。fail-fast:false 让另一片跑完再判，别早停。
    strategy:
      matrix:
        shard: [services, rest]
      fail-fast: false
    # 防 pytest 偶发 hang 卡满 GitHub 默认 6h 兜底：单进程后端测试正常 ~19min，给 30min 余量（#1596 排查 CI 卡死）
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.12
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 PDM
        run: pip install pdm

      # 依赖缓存：避免每次 PR 全量重装 akshare/playwright/pypinyin 等重型依赖
      # （此前无缓存，仅安装就占 6~8 分钟，是 CI 耗时大头）。
      # 锁文件变则 key 失效，restore-keys 回退到旧锁缓存后由 pdm install 增量更新。
      # 注意：强制 in-project venv（backend/.venv）才能被缓存命中。
      - name: 缓存 PDM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pdm
            backend/.venv
          key: pdm-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/pdm.lock') }}
          restore-keys: |
            pdm-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-
            pdm-${{ runner.os }}-

      # 依赖源（#1628 → #2031 根治）：pyproject.toml 不再声明 [[tool.pdm.source]]，
      # runner 也无机器级 pypi.url 配置 → PDM 默认走官方 PyPI，无需任何改写步骤。
      # dev 组含 ruff / pytest / invoke 等
      - name: 安装依赖
        env:
          # backend/pdm.toml 强制 use_uv=true，但 CI runner 上 uv 不支持 PEP 582；
          # 用环境变量覆盖项目配置回退 pip 安装
          PDM_USE_UV: "false"
          # 强制 in-project venv（backend/.venv），使其可被上方缓存命中；
          # 用环境变量局部设置，避免 `pdm config` 改写 runner 全局配置
          PDM_VENV_IN_PROJECT: "true"
        run: pdm install -G dev

      # CI 并行（激进试跑，源 PR #2266）：把 pytest-xdist 装进同一 venv，测试用 -n auto 多 worker。
      # 不写进 pyproject/pdm.lock（免锁重算）：这是 CI 提速实验，稳了再决定是否固化成项目依赖。
      - name: 安装 pytest-xdist（CI 并行用）
        run: pdm run python -m pip install -q pytest-xdist

      - name: Ruff 检查
        run: pdm run ruff check .

      - name: Ruff 格式化检查
        run: pdm run ruff format --check .

      # 守卫：禁止 @bp.input() 自动范式回潮（#973 / tech-debt.md §57）
      - name: 守卫:禁止 @bp.input 自动范式
        run: python ../scripts/forbid_bp_input.py

      # 守卫：错误响应三字段信封（#1610）——视图内自建错误响应必须带 error_code。
      # 不新增 job（同 layout_guard 的教训）：不新增 job 就不必改 gate.needs
      - name: 守卫:错误信封 error_code
        run: python ../scripts/guard_error_envelope.py

      # 守卫：API 约定（#1611）——尾斜杠（含明文豁免清单）+ api.md 全量端点段一致性。
      # 零依赖 AST，可直接用裸 python 跑（不 import app）
      - name: 守卫:API 约定（尾斜杠 + api.md）
        run: python ../scripts/check_api_conventions.py

      # 守卫：后端分层依赖方向（#1607：core ← domains ← services ← domains.views）。
      # 不新增 job（同 layout_guard 的教训）：不新增 job 就不必改 gate.needs，
      # 少动一次少一次「合并冲突把 needs 弄丢」的风险。
      - name: 守卫:分层依赖方向
        run: python ../scripts/guard_layer_direction.py

      # 守卫：视图层厚度（#1606：视图只做 HTTP 编排，业务规则与事务下沉 services）。
      # 同样并入本 job 而不新增 job——不新增 job 就不必改 gate.needs。
      - name: 守卫:视图层厚度
        run: python ../scripts/check_view_thickness.py

      # 守卫：跨域模型同语句（#1643：双库「零外键、零 SQL join」）。
      # **本 job 是这条约束唯一的机器化拦截层**：门禁与全部单测都跑单库
      # （conftest 把 engine / user_engine patch 成同一个内存引擎），跨域 join 在两域
      # 同库时不报错，结构上测不出；生产每日调度（daily-snapshot.yml）跑真双库，
      # 缺陷只在无人值守的凌晨调度里炸（#1605 就是这么漏的）。
      # 不新增 job：不新增 job 就不必改 gate.needs。
      - name: 守卫:跨域模型同语句
        run: python ../scripts/check_cross_domain_query.py

      # 守卫：禁止在 AssetAllocationDonut 之外新写 pie option（#2164）。
      # 规范（components.md「强制复用」）此前只落在文档里、无机器化拦截，于是同类实现
      # 长到 4 套并存。本守卫扫 frontend/src 全量，白名单仅 AggregationHero（hero 横向
      # 布局放不下表格，其 HTML 折叠图例属信息分层；理由已写进 components.md）。
      - name: 守卫:资产分布图统一复用
        run: python ../scripts/guard_no_duplicate_pie.py

      # 排除需联网的 slow 测试；按 matrix.shard 只跑本片（两片不相交），片内 -n auto 多 worker 并行
      - name: 运行测试 (${{ matrix.shard }})
        run: |
          if [ "${{ matrix.shard }}" = "services" ]; then
            pdm run python -m pytest -n auto -m "not slow" tests/services
          else
            pdm run python -m pytest -n auto -m "not slow" tests --ignore=tests/services
          fi

      # 总资产聚合守卫（源 CNB duoduobei/fundmate#478 / GitHub #2154 → imoyao/fundmate#2179）：`family_totals`
      # 被立为唯一聚合出口之后，账户级的 `get_ledger_distributions` 仍把同一套累加
      # 逐字重写了一遍 —— 那正是本卡要杀的形态本身（口径再变时就是「下次漏改的一处」），
      # 当时只靠 `test_account_snapshots.py` 里一条埋着的断言兜着，靠人找。
      # 现两处共用 `_per_ledger_buckets`（家庭桶 = 各账户桶按位相加），本守卫把「不许再写
      # 一份」机械化：`total_assets/liabilities/net_worth +=` 出现在允许的出口之外即报红。
      # 纯 AST、零依赖（不需装依赖），但**并入 backend job 而非另起 job** ——
      # 不新增 job 就不必改 gate.needs（#1559/#1560 两次事故都是合并冲突弄丢 needs）。
      # 判据边界与首版误报（已删掉的第二判据）见脚本 docstring；
      # 回归网在 scripts/tests/guard_summary_aggregation.test.js（含真实文件的回退探针）。
      - name: 守卫:总资产聚合唯一出口
        run: python ../scripts/guard_summary_aggregation.py

  # 布局宽度守卫（#1506）：容器宽度曾有 1280px / 1400px 两套硬编码散落 13+ 个文件，
  # 导致页头 / 页脚与内容区左右边缘错开。已收口为 --layout-* 令牌，本 job 防止再次写死。
  # 断点守卫（#1571）并入本 job 而非另起 job：两者同属「布局宽度」一类，
  # 且**不新增 job 就不必改动下面 gate 的 needs 列表**——#1559 / #1560 两次事故
  # 都是合并冲突把 gate.needs 里的 job 弄丢，少动一次就少一次风险。
  layout_guard:
    name: 布局宽度守卫 (layout-width)
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 密钥引用位置守卫（guard_secret_imports.py）要解析 .cnb.yml，依赖 pyyaml；
      # 本 job 只用 setup-python 裸环境，故在此显式安装（不拉其他依赖）。
      - name: 安装 pyyaml（密钥守卫解析 .cnb.yml 需要）
        run: python -m pip install pyyaml

      - name: 扫描容器宽度字面量
        run: python scripts/guard_layout_widths.py

      - name: 扫描裸断点媒体查询
        run: python scripts/guard_breakpoints.py

      # 分段控制器守卫（#1717）：禁止再挂 el-segmented / 页面自写 .xxx-segmented 样式块。
      # 与上两条同属「前端设计语言回潮」一类，故并入本 job 而不另起 job（不新增 job 就不必改 gate.needs）。
      - name: 扫描分段控制器回潮
        run: python scripts/guard_segmented.py

      # 输入焦点守卫（#1815）：禁止把 --focus-ring（无障碍双环）拼进输入框焦点表达式——
      # 那会让一个聚焦输入框叠出三层描边（用户反馈的「描边好几层」）。同属本 job 的「回潮」范畴。
      - name: 扫描输入焦点回潮
        run: python scripts/guard_input_focus.py

      # job 调度覆盖守门（#1934）：编排器注册的 job 必须出现在「每日调度」或
      # 「明确不调度」两张表之一。加 job 的人只改 orchestrator 而忘了调度表时，
      # 数据会静默永不更新（index_valuation / convertible_bond / market_asset_daily /
      # dividend_split 都曾如此，真库从未执行过）。故用静态 ast 解析交叉校验两张清单。
      - name: 校验 job 调度覆盖
        run: python scripts/guard_job_schedule_coverage.py

      # 交互可达性守卫（#1842）：纯图标按钮无可访问名称 / div@click 当按钮 /
      # hover 显隐无 focus-within 与 hover:none 兜底——前端交互排查里 P1 的主体三类。
      # 2026-10-05 起**阻断**：存量已清零（初报 109 处，其中规则一有 53 处是守卫
      # 自身误报——`_has_text` 先剥标签再要求 `>…<` 两步互斥；规则三早期把
      # `@keyframes` 的 from、`.is-folded` 折叠态误当 hover 显隐，4 处命中零真问题）。
      # 六个判据 bug 修完 + 24 条回归样本 + 逐条反向验证后，守卫精度才可信到
      # 拿来阻断。**新增违规一律挂 PR**，要豁免就在元素上方写 a11y-allow 并注理由。
      - name: 扫描交互可达性回潮（阻断）
        run: python scripts/guard_a11y_interaction.py

      # 控件裁切守卫（2026-10-09 自选页圆按钮「又大又被切」）：拦两类回潮——
      # ① 容器挂 max-height+overflow:hidden 给子控件盖盖子；② 用 content-box+padding
      # 撑热区（padding 会画进可见框，28px 的圆被撑成 42px）。两条各自看都像在
      # 「收紧 / 补偿」，叠加才把圆切扁，散文规范拦不住，故并入本 job 阻断
      # （同属「前端设计语言回潮」一类；不新增 job 就不必改 gate.needs）。
      # 判据边界与豁免方式见脚本 docstring；回归样本在 scripts/tests/guard_control_clip.test.js。
      - name: 扫描控件裁切回潮（阻断）
        run: python scripts/guard_control_clip.py

      # 栏间竖向分割线守卫（#2157）：同一根 1px 线曾被手写 5 份（3 处中 2 处贴住邻栏文字、
      # 且在 lg 以下两栏已堆叠后变成孤线），收口为全局工具类 .soft-col-divider 后，
      # 本守卫防第 5 份拷贝再长出来。存量 4 处冻结在 BASELINE 里（逐处理由见脚本 docstring），
      # 只减不增；语义强调条（3px/4px）与选中指示条（2px）有意放行，不属本判据。
      # 同属「前端设计语言回潮」一类，故并入本 job（不新增 job 就不必改 gate.needs）。
      - name: 扫描裸栏间分割线回潮（阻断）
        run: python scripts/guard_col_divider.py

      # 密钥引用位置守卫（源 CNB #148，2026-10-12，两个形态都踩过）：
      # git-sync 凭据必须挂**插件任务级 `imports`**（与 image 平级），
      # ① 挂流水线级 imports ⇒ 死在 Prepare（`declares allow_images … plugin tasks`）；
      # ② 挂 settingsFrom 却写 ${VAR} ⇒ 推不上去（`could not read Username for github.com`）——
      #    settingsFrom 只加载插件参数、不注入环境变量。
      # 两个报错都不指向真正的原因（前者指向读不到的 Secret 仓库，后者指向一个空凭据）。
      # 同属「配置回潮」一类，故并入本 job 而不另起 job（不新增 job 就不必改 gate.needs）。
      # 判据边界（含「不拉网络、只读仓库内 .cnb.yml」）见脚本 docstring；
      # 回归网在 scripts/tests/guard_secret_imports.test.js（含变异回退探针）。
      - name: 扫描密钥引用位置回潮（阻断）
        run: python scripts/guard_secret_imports.py

      # 数据库/备份文件必须受 gitignore 保护（2026-10-19 实测事故）：
      # `*.db` 只匹配「以 .db 结尾」的文件名 ⇒ `invest.db.bak_20261018_anchor`
      # 这类备份**不被任何规则命中**（实测 git check-ignore 退出码 1），
      # 而一个 145MB 的备份曾以未跟踪文件躺在 backend/，一次 `git add -A`
      # 就会把**用户私有数据**（持仓 / 流水 / 账户）提交进公开仓库。
      # 本步骤做两件事：① 合成探针必须全部被忽略；② 工作区里不得有漏网的未跟踪 db 文件。
      # 回归网在 scripts/tests/test_guard_db_backup_ignored.py（含回退探针）。
      - name: 校验数据库备份文件受 ignore 保护（阻断）
        run: python scripts/guard_db_backup_ignored.py

      # .cnb.yml 重复键守卫（源 CNB #458，2026-10-15）<!-- cross-repo-ref-allow -->：跨仓收敛合并把两侧各写一份的
      # `main:` / `dev:` / `pull_request:` 并进了同一层 ⇒ 两个 `dev:` 键、两个 `pull_request`
      # 键。YAML 规范允许重复键（后者覆盖前者），所以 PyYAML safe_load 与本仓全部
      # .cnb.yml 守卫**全绿**，而 CNB 平台用严格解析器直接拒绝：
      #     YAMLException: duplicated mapping key (240:3)
      # 构建死在 Prepare、stage 都没进（duration: 0）。这正是「本地判据与平台判据之间
      # 差一行解析严格度」的形态，故补上：用保留重复键的加载器解析，任一层同名键即报红。
      # 不新增 job —— 并入本 job，也就不必动 gate.needs（#1559/#1560 两次事故都是
      # 合并冲突弄丢 needs）。
      - name: 扫描 .cnb.yml 重复键（阻断）
        run: python scripts/guard_cnb_yml_duplicate_keys.py

      # python 脚本任务必须自带镜像（源 CNB #461，2026-10-15 实测）：<!-- cross-repo-ref-allow -->
      # 「跨仓同步（机器分支 + PR 通道）」上线时只写了 imports/env/script、没写 image，
      # 脚本任务不声明 image 时 runner 落在**默认镜像**上，而默认镜像里没有 python ——
      # 构建 cnb-nii-1k4ua02j8 的 stage-0 原文 `sh: line 10: python: command not found`
      # （code 127）。于是机器分支通道自上线起一次都没跑成：不是分叉没解、不是冲突没解，
      # 是**解释器不存在**，而报错指向「脚本第 10 行」而非「容器里没有 python」。
      # 仓库里其它脚本任务（.mirror-job / &claim-job）都写了 docker.image，只漏这一处，
      # 此前没有任何判据在管「这个 job 跑得起来吗」。不新增 job，并入本 job。
      - name: 扫描 python 脚本任务是否自带镜像（阻断）
        run: python scripts/guard_cnb_script_task_python.py

      # git 脚本任务必须自带 git 供给（源 CNB #517，2026-10-16 实测）：
      # #461 补了 `docker.image: python:3.12-slim`，却没人问「这个镜像里有没有 git」——
      # 官方 slim 镜像**不含 git**，而 `machine_branch` / `check_branch_divergence` 等
      # 都是 `subprocess.run(['git', …])` 驱动的 ⇒ 报 `FileNotFoundError: 'git'`，
      # 报错指向脚本内部某行、**不指向容器**（与 #461 同类，只是深了一层）。
      # 两种失败形态：dev push 是硬红；镜像 job 的「分支分叉自检」因 `exit 0` **报假绿**
      # ——自检从未真正跑过（#171 / #450 同族）。判据从源码推导「哪些脚本真调 git」，
      # 不手写名单（手写的会随新脚本失效）。不新增 job，并入本 job。
      - name: 扫描 git 脚本任务是否供给 git（阻断）
        run: python scripts/guard_cnb_script_task_git.py

      # 「同一个 git 询问不许问两遍」守卫（源 CNB #573，2026-10-18）：
      # `machine_branch.py` 的演练路径曾写 `code, _, _ = _git(merge-tree)` 取退出码、
      # `if code == 1:` 再跑一遍取输出 —— 两次独立进程被当成「同一个答案的两半」。
      # 第二遍一旦读空，冲突清单就**恒为空**，报告照样打印「✅ 无冲突，两侧内容可合」，
      # 而它更响亮、更像结论 ⇒ 没人会怀疑「冲突清单为什么总是空的」。
      # 判据按**结构形状**比对 `_git` 的参数（只认字面量的版本在真实代码上恒绿，
      # 这是实测踩过的第一版）；并拿 `origin/dev` 上修复前的真实代码当回归锚点。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      - name: 扫描「同一 git 询问问两遍」形态（阻断）
        run: python scripts/guard_ask_git_once.py

      # git-sync 分支范围守卫（源 CNB #167 / #172 / #269，2026-10-13 ~ 10-14）：
      # ① 插件不写 `branch` 时执行 `git push target --all`，会把 CNB 的 `main` 一并推给
      #    GitHub；而 GitHub 是权威源（`main` 只由发版 PR 推进）⇒ 两侧 `main` 各自长出
      #    独有提交（实测 CNB 31 / GitHub 27，**交集 0**），分叉由此产生。
      # ② （#269）判据 5：`branch: dev` 写对了、但作业**挂在 `main:` 键下**时，runner 只检出
      #    挂载分支键对应的分支（`git checkout -f -B "main"`），插件拿着 `branch: dev`
      #    找不到 ⇒ 打一行 `Warning: Branch dev does not exist locally, skipping push`
      #    就跳过，**而构建仍报 success**；`dev` 的 push 构建里更是**根本不含这个 job**。
      #    实测绿了三天（2026-10-11 ~ 10-14），一次都没推成 —— 判据 1~4 全是「配置形状」，
      #    这一条判「跑在哪个工作区」。
      # 同属「配置回潮」一类，故并入本 job 而不另起 job（不新增 job 就不必改 gate.needs）。
      # 判据边界见脚本 docstring；回归网在 scripts/tests/git_sync_push_scope.test.js
      # （含 5 个变异回退探针）。
      - name: 扫描 git-sync push 目标分支回潮（阻断）
        run: python scripts/guard_git_sync_push_scope.py

      # 机器分支「单写者」守卫（源 CNB #574，2026-10-19）：
      # `bridge/github-dev` 上有两个写者 —— GitHub `.github/workflows/dev-reconcile.yml`
      # 每日 `--force-with-lease` 重建并开 PR + automerge，而 CNB 的「跨仓同步」stage
      # 每次推 `dev` 都换一个 base 重新合再普通 push。后果是结构性的：
      # ① 归一化 base 变了 ⇒ 非快进 ⇒ `! [rejected] … (fetch first)`，推 dev 的构建天天红；
      # ② 侥幸快进成功也会改写 reconcile 铺好的合并结果，而**它开的那张 PR 还开着**
      #    ⇒ 内容与分支不符（外观一切正常，比红灯危险）。
      # 处置：写权归 GitHub reconcile，CNB 降级为**只读探针**（默认 `DEFAULT_WRITER=github`）。
      # 三条判据：不设 `MACHINE_BRANCH_WRITER=cnb` / 默认值不得翻转 / 对侧必须仍在推。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      - name: 扫描机器分支是否被两侧同时写（阻断）
        run: python scripts/guard_bridge_machine_branch_single_writer.py

  # 乱码守卫（mojibake）：防止任何绕过本地 pre-commit 钩子的提交（--no-verify、
  # 或经 gh api / MCP 直推导致本地钩子不执行）把 GBK 乱码合进 PR。
  # 扫描 PR 变更的全部文本类型文件 + 逐提交校验中文提交信息（两层兜底）。
  mojibake_guard:
    name: 乱码守卫 (mojibake)
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 检查 PR 变更文件编码（扩展文本类型）
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$base" "$head" -- \
            '*.md' '*.py' '*.vue' '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' \
            '*.yml' '*.yaml' '*.html' '*.htm' '*.css' '*.scss' '*.sass' \
            '*.sh' '*.ps1' '*.bat' '*.toml' '*.xml' '*.svg' '*.mjs' '*.cjs')
          echo "PR 变更文本文件数：${#files[@]}"
          if [ ${#files[@]} -gt 0 ]; then
            pip install ftfy >/dev/null
            python scripts/guard_mojibake.py "${files[@]}"
          fi

      - name: 检查 PR 各提交的中文提交信息
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          pip install ftfy >/dev/null
          for sha in $(git rev-list "$base..$head"); do
            # 历史豁免（清单在 scripts/guard_mojibake.py 的 EXEMPT_COMMIT_MESSAGES，单一来源）：
            # 仅豁免「已验证内容干净但提交信息乱码」的历史提交，别处照旧零容忍
            if python scripts/guard_mojibake.py --is-exempt "$sha"; then
              continue
            fi
            git log -1 --format=%B "$sha" > /tmp/msg_$$.txt
            if ! python scripts/guard_mojibake.py --check-message /tmp/msg_$$.txt; then
              echo "  -> 提交 ${sha:0:8} 的中文提交信息疑似乱码"
              rm -f /tmp/msg_$$.txt
              exit 1
            fi
            rm -f /tmp/msg_$$.txt
          done
          echo "OK: PR 各提交的中文提交信息编码正常"

  frontend:
    name: 前端类型检查 + Lint + 构建
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与根 package.json 的 packageManager 保持一致（#1520）：pnpm ≥12 不再读
          # package.json 的 pnpm.overrides，钉住版本才能保住安全 pin。
          version: 9.15.9

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖（frozen-lockfile 校验 lock 一致性）
        run: pnpm install --frozen-lockfile

      # 守卫：lock 文件与 package.json 必须同步（#974 / tech-debt.md §62 收尾）。
      # pnpm v9 的 frozen-lockfile 在 lock 落后于 package.json 时会自动降级为普通安装，
      # 此处显式比对 specifier 与解析版本，杜绝「本地能跑、CI 装到不同版本」。
      - name: 守卫:lock 与 package.json 一致性
        run: node ../scripts/check_lock_consistency.mjs

      # 守卫：路由死链（#936）—— `to="/x"` / `router.push("/x")` / `{ name: "X" }` 指向
      # 未登记路由。这类缺陷**完全静默**：点击无反应、控制台不报错、构建与类型检查全绿，
      # `/asset/entry` 因此从 v1.2 活到 #936 近 7 周才被人肉点出。纯 Node 静态扫描
      # frontend/src，零依赖秒级；与上一条 node 守卫同属「前端静态检查」，故并入本 job
      # 而不新增 job（不新增 job 就不必改 gate.needs）。
      - name: 守卫:路由死链
        run: node ../scripts/check_router_links.mjs

      - name: 类型检查
        run: pnpm typecheck

      # 检查模式（不带 --fix），有问题即失败，确保门禁有效
      - name: Lint 检查
        run: |
          # e2e / playwright.config.ts 也纳入（#1568）：E2E 用例不进 per-PR 门禁地跑，
          # 但**静态检查必须进**——否则那批文件会成为唯一无人检查的角落。
          pnpm exec eslint "{src,mock,build,e2e}/**/*.{vue,js,ts,tsx}" "playwright.config.ts" --max-warnings 0
          pnpm exec prettier --check "src/**/*.{js,ts,json,tsx,css,scss,vue,html}" "e2e/**/*.ts" "playwright.config.ts"
          pnpm exec stylelint "**/*.{html,vue,css,scss}" --cache-location node_modules/.cache/stylelint/

      # 单测（#1792 引入 vitest，首批覆盖导入形态判定 / 撤销快照等纯逻辑）。
      # 不进 CI 就等于把「有测试」降级为「本地曾经跑过」——重构会静默弄坏测试契约
      # 而无人察觉；纯逻辑用例秒级，进本 job 不新增 job、不必改 gate.needs。
      - name: 单元测试
        run: pnpm test:unit

      # 页面规模门禁（#980 治本项）：扫描 .vue 文件行数，**只减不增**。
      #
      # 2026-10-24 从 warn 切 fail（源 #980 实测）：warn 模式只打印不拦截，本卡拆过的
      # 9 个页面里有 8 个在涨、4 个已重新越过 400 行（WatchlistFilterBar 332→497 /
      # welcome 370→440 / reconcile-workbench 336→405 / watchlist/index 369→403）。
      # 口径改为「存量登记基线 + 增量判红」：基线内涨一行、或新增超阈文件即红；
      # 拆小了不判红（否则谁拆谁被拦，闸门会被绕开）。基线只能下调，脚本拒绝上调。
      # 回归网 `scripts/tests/check_vue_size.test.js`（17 条，含 GROW/NEW 变异探针）
      # 由 scripts_test job 的 `node --test "scripts/tests/*.test.js"` 收进来。
      # 不新增 job ⇒ 不必动 gate.needs。
      - name: 页面规模门禁（行数检查）
        run: node ../scripts/check_vue_size.mjs --threshold 400 --mode fail --baseline ../scripts/vue-size-baseline.json

      # 详情页表格约定守卫（源 CNB #553）：产品详情页 5 处手写 <table> 曾各写各的
      # padding / 分隔线 / 表头 / 数字列对齐，收进 `style/_detail-table.scss` 后，本守卫
      # 负责让「第六处」长不出来。存量另 5 个文件按基线冻结（只减不增）。
      # 并入本 job 而非新增 job：不新增 job 就不必动 gate.needs。
      - name: 详情页表格约定守卫
        run: python ../scripts/guard_detail_tables.py

      # 上面那条守卫的回归网（含 4 个变异探针：摘共享类 / 删 RULE 3 / 短路详情页判定 /
      # 新增第二份基线，均已实测转红）。本 job 的 defaults 把 cwd 设成 frontend/，
      # 故 work-directory 显式回到仓库根——否则 `python -m unittest scripts.tests...`
      # 会找成 `frontend/scripts/`，报的却是「模块不存在」，与真失败容易混淆。
      - name: 详情页表格守卫回归网
        if: ${{ always() }}
        run: python -m unittest scripts.tests.test_detail_tables_guard -v
        working-directory: ${{ github.workspace }}

      # 价格 / 净值精度契约守卫（用户实测：走势图 y 轴没设 formatter，净值 4.8124
      # 在轴上只剩 4.8）。契约 `pricePrecision` 早就在，问题是只有表格类组件遵守，
      # 其它出口各写各的 `.toFixed(n)`——写进 AGENTS.md 的软约束管不住，故做成判据：
      # 新增硬编码一律拦，存量 13 处冻结为基线（只减不增）。
      - name: 守卫:价格/净值精度契约
        run: node ../scripts/guard_price_precision.mjs

      # 上条的回归网（含反向验证：喂一处新增硬编码必须转红）。
      # 与表格守卫同理，cwd 要回到仓库根。
      - name: 价格精度守卫回归网
        if: ${{ always() }}
        run: node --test scripts/tests/guard_price_precision.test.js
        working-directory: ${{ github.workspace }}

      - name: 构建
        run: pnpm build

  # 合并门禁汇总（2026-09-11 新增）：把上面各 job 的结论收敛为**单一** required status check。
  #
  # 为什么不直接 require 上面几个 job，而要多一个汇总 job：
  #   backend / frontend 由 dorny/paths-filter 决定是否运行——不跑时 GitHub 报的是
  #   「skipped」，而 required check 遇到 skipped 的判定容易变成「Expected 永远等待」，
  #   把「本次没改该目录」的正常 PR 卡死。汇总 job 无条件执行，只把**失败 / 取消**判为
  #   不通过，skipped 视为通过，语义唯一、不会误卡。
  #
  # 维护约定：**新增需要卡人的 job，必须同时加进本 job 的 `needs`**；汇总逻辑本身遍历
  #   全部 needs，不需要改脚本。

  # pnpm overrides 守卫（#1520）：把「安全 pin 被静默丢弃」变成显式红灯。
  #
  # 背景：pnpm 从 v12 起不再读取 package.json 的 `pnpm` 字段，`pnpm.overrides` 被忽略，
  # 症状只有一行 WARN、构建照绿，唯一可见信号是依赖悄悄退回有漏洞版本（实测
  # decode-uri-component 0.5.0 → 0.2.2，即 Dependabot 报的那条）。
  # 本 job 只做静态校验（读 package.json + pnpm-lock.yaml），不安装依赖，故轻到可常开。
  pnpm_overrides_guard:
    name: 守卫:pnpm overrides 生效
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: 校验安全 override 在锁中真实生效
        run: node scripts/check_pnpm_overrides.mjs

  # 缓存目录单一真相源守卫（#1540 治本项）：把「新增未经 resolve_cache_file_dir() /
  # resolve_cache_subdir() 路由的硬编码缓存目录」变成显式红灯，杜绝 #1531 → #1537 → #1539 →
  # #1540 连犯四次的回潮。纯 AST + 标准库扫描 backend/app，秒级、零依赖，故轻到可常开。
  cache_dir_guard:
    name: 守卫:缓存目录单一真相源
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 校验无未经路由的硬编码缓存目录
        run: python scripts/guard_cache_dir.py

  # CSS 令牌守卫（#1545 T1.4）：把「被 var() 引用、源码里却没定义」的幽灵令牌
  # 变成显式红灯。背景：--bg-subtle 曾被 6 处引用却全仓零定义，导致
  # `color-mix(..., var(--bg-subtle))` 整条声明静默失效（市场机会卡只剩左边框有颜色），
  # 而构建 / 类型检查 / lint 全绿——没有任何机制能发现。本守卫冻结存量基线、拦截新增。
  # 纯 Node 静态扫描 frontend/src，零依赖、秒级，故轻到可常开。
  css_token_guard:
    name: 守卫:CSS 令牌引用定义一致
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: 校验无幽灵令牌（引用但未定义）
        run: node scripts/check_css_vars.mjs

  # 守卫脚本单测（#1584）：`scripts/ai_review_verify_guard.js` 被 ai-review workflow **直接驱动**，
  # 且它同时决定「本轮审查算不算真产出（否则 core.setFailed → job 红）」「要不要清理协议信封泄漏评论」
  # 「生成标记幻觉计数」——写错就是把 job 带红或带绿（假红灯 / 假绿），故给它一份回归网。
  # 零新依赖（只用 Node 内置 node:test / node:assert），纯离线 mock，无需 LLM 额度。
  # 2026-09-24（#1683）起本 job 同时跑 `scripts/close_linked_issues.js` 的单测：它被
  # close-linked-issues workflow 直接驱动，且带**外部副作用**（关闭 issue）——解析错一次
  # 就是误关别人的卡，比假红灯更贵，同样必须有回归网。
  # 2026-10-11（CNB #123）起一并跑 `scripts/pr_base_rule.js` 的单测：它把「功能分支 PR 的
  # base 必须是 dev、只有发版 PR 才用 main」这条判据机械化。此前该规矩只写在 AGENTS.md 里
  # （且只写了前半句），实际执行中出现连续多个以 main 为 base 的功能 PR，导致 main / dev
  # 互不包含。判据的价值在于**base 对不对是可以算的**，不靠每个人各自的理由。
  # 2026-10-11（#120）再补一层 Python 侧：`scripts/bridge/` 的镜像脚本同样带外部副作用
  # （建卡 / 写更正评论），且与 Node 侧是两套解释器，故上面那条 node --test 覆盖不到。
  # untested。两个脚本都是纯标准库 + 纯函数可测，故直接在这里跑 python -m unittest。
  scripts_test:
    name: 守卫:脚本单测 (scripts)
    if: ${{ github.event_name == 'pull_request' && github.head_ref != 'bridge/github-dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 探针测试（branch_structure 回退验证）钉在历史不可变 SHA 上，
          # 浅克隆缺对象会把探针误判成红（#2255 实测）——全量克隆兜底。
          fetch-depth: 0

      - name: 设置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # 引号是必须的：bash 不展开双引号内的 glob，交给 Node 自己的测试发现（跨平台一致）
      - name: 跑 scripts/ 下的守卫脚本单测
        run: node --test "scripts/tests/*.test.js"

      # workflow `inputs` 插值守卫（源 CNB #148，2026-10-12）：`inputs` 只有
      # workflow_dispatch / workflow_call 才定义，`schedule` 下写进 `run:` 会留**字面量**
      # ⇒ `bash: bad substitution`，步骤首行即挂。`cnb-github-backfill.yml` 因此
      # **每一天都红**且只花 9 秒（run 38179858075），回写路径从未真正跑过；
      # `mojibake-dev-guard.yml` 同型但在惰性分支里，185 次 push 全绿、一次 dispatch 就会挂。
      # 同属「配置回潮」一类，故并入本 job 而不另起 job（不新增 job 就不必改 gate.needs）。
      # 判据边界见脚本 docstring；回归网在 scripts/tests/guard_workflow_inputs_interpolation.test.js
      # （含两处回退变异探针）。
      - name: 扫描 workflow inputs 插值回潮（阻断）
        run: python scripts/guard_workflow_inputs_interpolation.py

      # 跨仓引用守卫（源 CNB 卡）：CNB 的正文/评论里裸 `#N` 会被解析成**本仓**编号，
      # 于是「见 GitHub 的某号」点进去落到 cnb.cool 的同号（要么 404、要么撞上另一张卡）。
      # 用户实测撞到，故规则是「提到 GitHub 的编号必须挂源」。不新增 job——并入本 job，
      # 也就不必动 gate.needs（#1559/#1560 两次事故都是合并冲突把 needs 弄丢）。
      # 判据边界与豁免方式见脚本 docstring；回归网在 scripts/tests/guard_cross_repo_refs.test.js。
      - name: 扫描跨仓引用是否挂源（阻断）
        run: node scripts/guard_cross_repo_refs.mjs

      # 付费卡违规占用 NOW 档位（源 #1288 实测）：付费里程碑上的卡带了 `Q1-RED`。
      # 首次上线时违规项**已经存在**且不是 PR 作者能修的（要改的是 owner 的优先级判断），
      # 故当前为**报告模式**（BLOCKING=false），待 owner 在 #2416 裁定后转阻断。
      # 判据与转阻断条件见脚本 docstring；回归网 scripts/tests/guard_paid_q1.test.js。
      - name: 付费卡占用 NOW 档位（报告）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/guard_paid_q1.mjs

      # NOW 容量记账（源 #2410）：Q1-RED open > 5 时给每张打 `NOW-超额`，回落自动撤销。
      # **刻意只报告不阻断**——超容是看板的债，不是登记者的错；
      # 判据连 PR 上下文都不接收，就是不给「有 PR 就豁免」留后门。
      - name: NOW 容量记账（报告）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/guard_now_capacity.mjs

      # PR 四问格式（被 pr-four-questions-guard.yml 调用）。此处在 CI 里**显式跑一遍自测**，
      # 只为让「它属于哪条通道」在日志里看得见——真正的拦截发生在 PR 事件上。
      # 判据边界（只校验有无、不判断好坏）见脚本 docstring。
      - name: PR 四问格式守卫可用性（自检）
        run: node scripts/guard_pr_four_questions.mjs --body-file .github/ISSUE_TEMPLATE/README.md || true

      # 认领同步（源 2026-10-19 两个 agent 同时改 #2406 的撞车事故）。
      # 由 issue-claim-sync.yml 在 PR 事件上调用；此处显式跑一遍解析自检，
      # 保证「PR 正文 → 关联 issue」的解析在 CI 里可见（解析失效会让整套认领静默失灵）。
      - name: 认领同步解析自检
        # 样本里**不写反引号**：bash 会把 `...` 当命令替换执行（本轮已在 commit message
        # 上踩过一次），守卫因此拿到被 shell 吃空的字符串——那又是「静默失灵」。
        # 样本也不带 GitHub 标记词：自检行本身不该被 guard_cross_repo_refs 判红
        # （`GitHub #N` 与裸 `#N` 同行即视为「该挂源却裸写」），限定形态由
        # scripts/tests/claim_in_progress.test.js 覆盖。
        # ⚠️ 整个值必须用双引号包成 YAML **双引号标量**：plain scalar 里
        # 「空格 + #」会被 YAML 当成注释起点，把 run 从 `'closes` 处截断
        # → bash 双引号永不闭合 → exit 2（本 PR 首轮 CI 实测，此前一直
        # 被上游红灯挡住没跑到这步，故此前从未暴露）。双引号标量内 `#` 是字面量。
        run: "node -e \"const{parseLinkedIssues}=require('./scripts/claim_in_progress.mjs');const r=parseLinkedIssues('closes #1 关联 #2','imoyao/fundmate');if(JSON.stringify(r)!=='[1,2]'){console.error('解析自检失败:',r);process.exit(1)}console.log('OK:',r)\""

      - name: 设置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 本 job 的 setup-python 裸环境不含 pyyaml，而 check_cnb_events.py /
      # guard_secret_imports.py 解析 .cnb.yml 依赖它。
      # pytest：test_machine_branch.py（源 CNB #450，#2255 收敛带回）顶层
      # `import pytest`，不装则 unittest discover 导入即 ERROR（CI 实测红灯）；
      # 该文件是 pytest 风格（fixture + 裸函数，无 TestCase），discover 装上后
      # 只导入不执行——与同 job 其余 unittest 用例互不影响。
      - name: 安装 pyyaml + pytest
        run: python -m pip install pyyaml pytest

      # dependabot 锁重生成通道（#2434）：dependabot 不跑 pnpm，文本级重写锁会丢
      # peer-suffixed 条目 ⇒ `--frozen-lockfile` 报 MISSING_DEPENDENCY（一天三连踩）。
      # 判据只查「通道会不会真的发生」：workflow 是否执行脚本、带 --apply、推回、
      # 不吞失败态、按 dependabot + base=dev 设闸。放在 pyyaml 安装之后（守卫要解 YAML）。
      # 回归网 scripts/tests/test_dependabot_lockfile_regen.py（6 个变异探针）。
      - name: dependabot 锁重生成通道（阻断）
        run: python scripts/guard_dependabot_lockfile_regen.py

      # 迁移 PG-aware 守卫（#2534，源 #2469 / #2532 两次生产停摆）：迁移里再出现
      # 「非 SQLite 就跳过」早退即红——本仓没有 Alembic、create_all 不给存量表加列，
      # 生产 user 域是 Supabase PG，那句「由 ORM 模型/迁移工具负责」是假前提。
      # 存量 4 个函数（整表重建 / SQLite 专属 SQL）按指纹基线冻结，收敛一个删一个；
      # 「已无早退但条目还在」同样红，逼基线与代码同一个 PR 贴合。自带变异探针
      # （--self-test）；回归网 scripts/tests/test_guard_migrations_pg_aware.py。
      # 不新增 job——并入本 job，也就不必动 gate.needs。
      - name: 迁移 PG-aware 守卫（阻断）
        run: python scripts/guard_migrations_pg_aware.py

      - name: 跑 scripts/ 下的 Python 守卫/桥接脚本单测
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      # CNB 事件结构守卫（源 CNB #152）：`.cnb.yml` 的顶层**只认分支名**，而 PR #150 把
      # `push:` 与两条 `"crontab: ..."` 写在了顶层 —— 平台读成三个**不存在的分支**，随后
      # 7 条流水线全红，报错却是 `GetFileContent: not found` 与 `parse yaml failed` 两种
      # 与「写错位置」毫不相干的形态（完整推导见回归网文件头）。
      # 不新增 job：并入本 job 即可，也就不必动 gate.needs。
      # 判据边界（含「不拉网络、不校验 URL 可达性」）见脚本 docstring；
      # 回归网在 scripts/tests/branch_structure.test.js。
      - name: 检查 .cnb.yml 的顶层事件是否挂在分支之下（阻断）
        run: python scripts/check_cnb_events.py

      # 定时作业可及性（源 CNB #578，2026-10-18）：构建 `cnb-ri6-1k57q4k9b` 每小时红一次，
      # `! [rejected] dev -> dev (fetch first)` —— 而那条 cron 挂在 `main:` 段里、却推 `dev`。
      # runner 的检出口径是 `git fetch origin refs/heads/<分支键>` +
      # `git checkout -f -B "<分支键>" <sha>` ⇒ 作业挂在哪、推哪条必须一致，否则要么静默跳过
      # （源 CNB #269 的假绿），要么拿一条注定推不上去的 ref 去推（本卡的恒红）。
      # 与上一条（`check_cnb_events.py`）是一对：那条管「事件挂在分支之下吗」，
      # 这条管「挂对了之后，作业的目标分支在不在自己的检出里」。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（不拉网络、不判断两侧是否真的分叉）见脚本 docstring；
      # 回归网在 scripts/tests/test_cron_job_reachability.py（含 2 个变异探针 + 缺陷形态 fixture）。
      - name: 检查定时作业的目标分支是否在它自己的检出里（阻断）
        run: python scripts/guard_cron_job_reachability.py

      # 回流 / 认领两条通道的可及性（源 CNB #552，2026-10-19）：用户原话「分诊侧不用做，
      # 回流侧需要做。就是说你关卡或者是说留下评论的时候，一定要判有判据」。
      # 分诊侧已有 `guard_triage_reachable.py`；这条管的是**有副作用的另一半**：
      #   ① `dev:` 的 cron 与 `$:` 的 `web_trigger` 必须跑**同一套** `scripts/` 脚本
      #      （`.cnb.yml` 现状是 `$:` 下只有 `web_trigger`、没有 push，建卡/回流/分诊
      #      全在 18:00 UTC 那条 cron 里；段落一旦挪错，跑的会是默认分支上的旧配置，
      #      而构建一律报绿）；
      #   ② `mirror_state_sync` / `claim_detect` 的「数据不完整 ⇒ 非 0 退出」必须还在
      #      —— 删掉它没有任何测试会红，而那是 #171 假绿的唯一起点；
      #   ③ `GITHUB_TOKEN` 的第一次赋值必须来自 `GITHUB_PAT`（空串占位会静默盖掉 PAT）。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（不拉网络、不判结论对不对）见脚本 docstring；
      # 回归网在 scripts/tests/test_bridge_sync_reachable.py（含真实源码回退探针）。
      - name: 检查回流 / 认领通道是否可及（阻断）
        run: python scripts/guard_bridge_sync_reachable.py

      # 定时作业挂错**整整一个分支**（源 CNB #564，2026-10-18）：用户问「直接在 DEV 分支上面
      # 进行分诊不行吗？为什么非得在 main 分支上面？」——当时整组 cron（建卡 / 状态回流 /
      # 分诊 / 三节自检）都挂在 `main:` 下，理由只有一句「cron 只能挂具体分支，故这里显式写 main」。
      # 那句话说的是「必须是个**具体**分支」，从没说「必须是 `main`」；读偏一格的代价是
      # ① 在 `dev` 上验过的脚本修复要等下一次发版才执行；② 为「让它生效」而逼出以 `main`
      # 为 base 的提交（CNB #114 / #122 / #124 / #126），把两侧 `main` 岔成互不包含。
      # 与上一条是一对：那条管「挂对了之后目标分支在不在检出里」，这条管「挂对分支了吗」。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（不判作业内容、不判 push/PR 事件）见脚本 docstring；
      # 回归网在 scripts/tests/test_cron_covers_active_branch.py（含回退探针：
      # 拿修复前的真实 `.cnb.yml` 喂守卫，确认它真的转红）。
      - name: 检查定时作业是否挂在活跃分支上（阻断）
        run: python scripts/guard_cron_covers_active_branch.py

      # 「分诊到底会不会跑」（源 CNB #564，2026-10-19）：用户问过两次「做了没有」，
      # 两次答案都是「没做」——脚本合进 `dev`、单测全绿，而**看板上一张标签都没落**。
      # 根因不是判据错，是分诊 stage 不在 cron 里（PR #584 搬迁时只搬了建卡），
      # 而那次唯一的 cron 运行里三个自检还全崩在 slim 镜像缺 git 上、外层 `exit 0` 报绿。
      # 「脚本在仓库里 + 有测试」都不等于「会跑」——这条把它机械化：活跃分支的 cron 里
      # 必须真的有 job 调用 `scripts/triage/issue_triage.py`，stage 必须带 name（#167），
      # 且 GitHub 兜底通道必须有自己的 `schedule`。
      # 与上面三条是一组：那条管 cron 挂哪个分支、这条管「挂对了之后会不会真跑到它」。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（不判作业成功与否、不判结论对不对）见脚本 docstring；
      # 回归网在 scripts/tests/test_triage_reachable.py（12 条，含 3 个回退探针）。
      - name: 检查分诊作业是否真的会跑（阻断）
        run: python scripts/guard_triage_reachable.py

      # 定时作业的**检出分支**（源 CNB #586，2026-10-19）：`schedule` 只读默认分支上的
      # workflow 定义，`actions/checkout` 默认也落在默认分支 —— 而本仓 `main` 只由发版 PR
      # 推进，实测落后 `dev` **124 个提交**。于是「每夜捕捉回归」捕捉的是很久以前的代码。
      #
      # 实证：前端 E2E 连续三夜（10-16 / 10-17 / 10-18）失败，`head_sha` 全是 `1068135f`
      # （`main` 的 tip），而那几天 `dev` 上已经合了两轮 E2E 修复 —— **每夜都在重跑同一个
      # 已被修好的失败**。同一形态在 `daily-snapshot.yml`（#1434）记过一次，那次只是手工修好
      # 一条、没有判据，于是换了个文件又犯。本条把它机械化。
      #
      # 与上两条是一组：那条管「cron 挂对分支了吗」，这条管「checkout 检出对分支了吗」。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（只判定时作业；不猜 `${{ … }}` 的运行时值）见脚本 docstring；
      # 回归网在 scripts/tests/test_schedule_checkout_ref.py（含回退探针：拿修复前的真实
      # `e2e.yml` 喂守卫，确认它真的转红）。
      - name: 检查定时作业是否检出了活跃分支（阻断）
        run: python scripts/guard_schedule_checkout_ref.py

      # 镜像建卡的「扫描不可短路」守卫（源 CNB #450，2026-10-14）：`harvest_existing()`
      # 曾拿状态文件缓存当前置短路（缓存非空就直接返回），于是状态文件没记的镜像卡
      # 在判定时"不存在" ⇒ 每轮 cron/push 都把 ~140 张 GitHub 卡再建一遍，
      # 三天攒出 224 张重复卡，而**日志全绿、零信号**。
      # 这类「缓存被当成全集」的错靠人 review 拦不住（它就是漏过 review 的那一版），
      # 故机械化：`harvest_existing()` 必须在函数体里真的调用 `list_cnb_issues()`，
      # 且扫描之前不得有 `return`。
      # 不新增 job：并入本 job，也就不必动 gate.needs（#1559/#1560 两次事故都是合并冲突弄丢 needs）。
      # 判据边界见脚本 docstring；回归网在 scripts/tests/test_dup_mirror_guard.py
      # （含 3 个变异探针，其中一个是拿**修复前的真实代码**喂给守卫确认它转红）。
      - name: 检查镜像建卡是否真扫 CNB 侧（阻断）
        run: python scripts/bridge/harvest_scan_guard.py

      # 跨仓同步新增的 Python 回归网（源 CNB #450，2026-10-14）：`machine_branch.py`  <!-- cross-repo-ref-allow -->
      # 是「推一次性机器分支 → 开 PR → 门禁绿 → 合并」这条通道的执行体，
      # 它的核心承诺是「有冲突时一个字节都不推」与「拿不到输入退 2 且声明结论不可信」。
      # `scripts_test` 的 unittest discover 只收 `test_*.py`，本文件按仓库惯例命名
      # 为 `test_machine_branch.py`，其实**已被上一条 `unittest discover` 覆盖**；
      # 此处显式再跑一遍，是为了让「它属于哪条通道」在 CI 日志里看得见
      # （失败时不必再推断归属）。**不新增 job**，也就不必动 `gate.needs`。
      - name: 跨仓同步通道回归网（阻断）
        run: python -m pytest scripts/tests/test_machine_branch.py -q -p no:cacheprovider

      # PR 兜底通道的回归网（源 CNB #586）：合并成功、直推被分支保护拒绝时，
      # 合并结果落到一次性分支后由 `branch_protection_pr.py` 幂等地开 PR。
      # 三条最容易写反的事：同 head 有 open PR 必须复用（否则每轮一张卡）、
      # 列 PR 失败必须退 2（不得读成「不需要开」）、没 token 要说清「结果已在分支上」。
      # `unittest discover` 已覆盖本文件，此处显式再跑一遍只为让归属在日志里看得见。
      - name: PR 兜底通道回归网（阻断）
        run: python -m pytest scripts/tests/test_branch_protection_pr.py -q -p no:cacheprovider

      # 「同一 git 询问问两遍」守卫的回归网（源 CNB #573）：最重的一条用例拿
      # `origin/dev` 上**修复前的真实代码**喂守卫，确认它真的转红——不加这条，
      # 「守卫绿」只能证明「代码里没有它不认识的东西」，证明不了它能认出那个 bug。
      - name: 「同一 git 询问问两遍」守卫回归网（阻断）
        run: python -m pytest scripts/tests/test_ask_git_once_guard.py -q -p no:cacheprovider

      # 机器分支单写者守卫的回归网（源 CNB #574）：含 3 个变异探针
      # （只读闸门被删 / 默认写者翻转 / `.cnb.yml` 设写者），均已实测转红。
      # `unittest discover` 已覆盖本文件，此处显式再跑一遍，让「它属于哪条通道」在
      # CI 日志里看得见。**不新增 job**，也就不必动 `gate.needs`。
      - name: 机器分支单写者回归网（阻断）
        run: python scripts/tests/test_bridge_single_writer.py

      # Pro 端点权益接线（#2324 验收第 2 条「新增 Pro 端点未登记权益位 → CI 报错」）。
      #
      # WHY：`@require_pro_feature` 只在**被调用**时拦未登记 feature；一个**根本没挂装饰器**
      # 的新 Pro 端点不会报任何错，它会安静地对未付费用户返回完整数据——付费墙又只剩 UI 层。
      # 本步骤静态扫路由：Pro 形路由必须挂装饰器、feature 必须在 PRO_FEATURES、
      # 公开端点必须在白名单里写明理由（当前只有 /pro/ 状态位）。
      # 回归网在 scripts/tests/test_guard_pro_endpoint_registry.py（含真实代码变异探针）。
      - name: 校验 Pro 端点权益接线（阻断）
        run: python scripts/guard_pro_endpoint_registry.py

      # 规则登记与生命周期守卫（源：用户问「写进 AGENTS.md 的规则，别的 Agent 不遵守怎么办」）。
      #
      # WHY：本仓有 30+ 个守门脚本，但**从没有人问过「AGENTS.md 里那些『强制 / 禁止』
      # 到底有几条真的有人在执行」**。实测普查（2026-10-16）：91 条硬约束条目里只有 3 条
      # 挂了判据，其余 88 条只靠「读到的人愿意遵守」；更贵的一类是**写了守卫却没接进会
      # 拦住合并的地方**——比没有守卫更像已治理。
      # 本守卫把「登记（rule / runner / tests / 边界）+ 生命周期（挂的钩子真的会跑）
      # + 纯文字预算（只减不增）」机械化。判据边界见脚本 docstring；
      # 回归网在 scripts/tests/test_rule_registry_guard.py（含 4 个变异探针）。
      # 不新增 job：并入本 job，也就不必动 gate.needs（#1559/#1560 两次事故都是合并冲突弄丢 needs）。
      - name: 守卫:规则登记与生命周期（阻断）
        run: python scripts/guard_rule_registry.py

      # Issue 分诊的派活闸门（源 CNB #564，2026-10-18）：`issue_triage.py` 算出的
      # `next=dispatch_npc` 是「可以交给 AI 自动推进」的唯一凭据。判据一旦松掉，
      # AI 就会去动需要人拍板的卡 / 大车汇总卡——那比少做十张卡贵得多。
      # 本步骤跑的是 `scripts/triage/issue_triage.py` 的回归网（纯离线、不打网络），
      # 并入本 job，不新增 job 也就不必动 gate.needs。
      - name: Issue 分诊闸门回归网（阻断） scripts/triage/issue_triage.py
        run: python -m unittest scripts.tests.test_issue_triage -v

      # 每日调度开关与 `.env.example` 一致（源 #1186，2026-10-19）：`daily_scheduler._JOB_TEMPLATES`
      # 与 `backend/.env.example` 是两张**互不引用**的清单，忘了同步不会报错。实证：
      # 清单已有 15 个 job、示例只登记了 8 个，漏掉的 7 个里包含 **`price_history`
      # （场内日线 OHLC）**——正是 #1186 点名要的那一项：本机**天天在跑**，
      # 而用户既调不了它的开关、也看不出它被调度了。
      # ⚠️ 失败态是重点（AGENTS.md 三之二）：解析不到 `_JOB_TEMPLATES` / 常量表 /
      # `.env.example` 变量时**必须报红**，不得退化成「没有可检查的项 ⇒ 绿」。
      # 不新增 job：并入本 job，也就不必动 gate.needs。
      # 判据边界（只做「变量名出现没出现」）见脚本 docstring；
      # 回归网在 scripts/tests/test_scheduler_env_example_guard.py
      # （12 条，含失败态 + 真实文件删行探针 + 修复前 baseline 回退探针）。
      - name: 检查每日调度开关是否都登记在 .env.example（阻断）
        run: python scripts/guard_scheduler_env_example.py

      # 硬编码密钥守卫（源 #2486，2026-10-21）：接 MCP（Wind / 且慢）后 Token 会以三种
      # 最平常的方式进仓库——适配器常量、测试夹具、文档示例——而现有守卫没有一条看**值**：
      # `guard_secret_imports.py` 管 `.cnb.yml` 的引用**方式**，`guard_mojibake.py` 管编码，
      # `guard_scheduler_env_example.py` 管开关有没有登记。于是那条红线此前只有一道防线：
      # 「记得别写」——而它失败时不可逆（Token 进了历史就得改写历史或轮换）。
      # 白名单只认语义（占位值、Supabase `anon` JWT），不按路径开口子；
      # 拿不到输入（不是 git 仓库 / 跟踪文件读不了）退 2，**不得**当成通过。
      # 不新增 job：并入本 job，也就不必动 gate.needs（#1559/#1560 两次事故都是合并冲突弄丢 needs）。
      # 判据边界（不覆盖提交信息 / PR 正文 / 历史提交 / 拆分拼接的密钥）见脚本 docstring；
      # 回归网在 scripts/tests/test_no_hardcoded_secrets.py（含临时仓库灵敏度探针 + 失败态用例）。
      - name: 检查仓库里是否写死了密钥（阻断）
        run: python scripts/guard_no_hardcoded_secrets.py

      # 前端 env 的 Supabase 凭证（#1028）：开发/生产共用同一个 Supabase 项目时，
      # 开发期注册的测试账号会写进**生产** Auth 用户表，而当时没有任何一处会报错。
      # 本守卫只管**入库文件**（CI 看得见的那些）：`.env.production` / `.env.staging`
      # 必须给出完整的 URL + anon key（缺项 ⇒ 浏览器里才炸，构建期就该红），
      # `.env.example` 只允许占位值（它是新人抄配置的入口）。
      # ⚠️ 「dev 与 prod 是否同项目」这条**不在本守卫范围内**——它要读**不入库**的
      # `frontend/.env.development`，CI 看不到，由 `frontend/build/supabase-env-guard.ts`
      # 在 dev server 启动时兜。两条规则不重叠、各有唯一实现。
      # 不新增 job：并入本 job，也就不必动 gate.needs（#1559/#1560 两次事故都是合并冲突弄丢 needs）。
      # 判据边界见脚本 docstring；回归网在 scripts/tests/test_supabase_env_separation.py
      # （含 3 个变异探针，均已实测转红）。
      - name: 检查前端 env 的 Supabase 凭证（阻断）
        run: python scripts/guard_supabase_env_separation.py

      - name: 前端 env 凭证守门回归网（阻断）
        if: ${{ always() }}
        run: python -m unittest scripts.tests.test_supabase_env_separation -v
        working-directory: ${{ github.workspace }}

  gate:
    name: 质量门禁汇总
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [changes, backend, frontend, mojibake_guard, pnpm_overrides_guard, cache_dir_guard, css_token_guard, layout_guard, scripts_test]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各 job 结论（失败 / 取消 → 不通过）
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS"])
          ok = {"success", "skipped"}
          print("各 job 结论：")
          for name, body in needs.items():
              print(f"  {name}: {body.get('result')}")
          bad = {n: b.get("result") for n, b in needs.items() if b.get("result") not in ok}
          if bad:
              print("未通过的 job：")
              for name, result in bad.items():
                  print(f"  -> {name} = {result}")
              print("::error::质量门禁未通过：存在失败或被取消的 job，本 PR 不可合并（红灯不许合并）。")
              sys.exit(1)
          print("OK: 质量门禁通过（skipped 视为通过——该目录本次无改动）。")
          PY

  # 防直推卡点（替代 GitHub Pro 才有的 branch protection）
  # 用此 job 拦截「直接 push 到 main」的行为：
  # 正常流程是 分支 → PR → merge，merge 产生的 push 也会触发本 push 事件（#1771 修正：
  #   旧注释称「merge 不触发」是错误的），故此处用 GitHub API 反查本 commit 是否关联
  #   「已合并的 PR」来区分：
  #     - 关联已合并 PR（即 PR 合并产生的 push）→ 放行，不再误红；
  #     - 未关联任何 PR（真正的本地直推）→ 失败红灯，提示走 PR 流程。
  #   覆盖 GitHub 三种合并方式（create a merge commit / squash / rebase）。
  #
  # 重要边界：本 job 不是 required status check（required 是 pull_request 事件的 gate），
  #   它只能「标红提示」，不能硬拦；真正的强制拦截仍靠 branch protection + PR 必经。
  #   故 API 调用异常（限流/网络）时按「放行」处理，宁可漏拦也不误红（符合 #1771 验收）。
  #
  # 历史坑（2026-09-11 修正）：此 job 原写作 branches: [M] / refs/heads/M —— `M` 早已
  # 随分支清理删除，导致守卫**从未真正运行过**，main 长期处于无保护状态。
  guard-direct-push:
    name: 禁止直接 push 到 main（请走 PR）
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: 判断本次 push 是否来自 PR 合并
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          # GitHub 合并 PR 到 main 时会在 push 事件里带上 merge commit；
          # 用 commits/{sha}/pulls 反查是否由已合并 PR 产生（覆盖 merge / squash / rebase）。
          prs_json=$(gh api "repos/${{ github.repository }}/commits/${sha}/pulls" 2>/dev/null) || {
            echo "::warning::无法调用 GitHub API 反查 PR 关联（可能限流/网络），按放行处理，避免误拦 PR 合并。"
            exit 0
          }
          pr_count=$(printf '%s' "$prs_json" | jq 'length')
          if [ "${pr_count:-0}" -gt 0 ]; then
            echo "本次 push 来自 PR 合并（关联已合并 PR 数=${pr_count}），放行。"
            exit 0
          fi
          echo "::error::检测到直接向主分支 main 推送（未关联任何已合并 PR）。请改用 PR 流程：从 dev 切出分支 → 提交 → 开 PR → review 后合并。"
          echo "::error::Direct push to main is blocked. Use a PR instead."
          exit 1

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend/"
    schedule:
      interval: "monthly"
      time: "08:00"

  - package-ecosystem: "docker"
    directory: "/backend/"
    schedule:
      interval: "monthly"
      time: "08:00"

  - package-ecosystem: "github-actions"
    directory: "/backend"
    schedule:
      interval: "monthly"
      time: "08:00"

  - package-ecosystem: "pip"
    directory: "/backend/requirements"
    schedule:
      interval: "monthly"
      time: "08:00"

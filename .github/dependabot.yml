version: 2
updates:
  # 仓库根目录：主站落地页 + 文档站（VitePress）的构建依赖，均由根的 pnpm-lock.yaml 管理
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    commit-message:
      prefix: "chore"
      prefix-development: "fix"
    labels:
      - "dependencies"
    pull-request-branch-name:
      separator: "-"

  # 后端项目内的管理前端（frontend/，即 duobeibao 后台，Vite 项目，独立 pnpm-lock.yaml）
  - package-ecosystem: "npm"
    directory: "/frontend/"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    commit-message:
      prefix: "chore"
      prefix-development: "fix"
    labels:
      - "dependencies"
    pull-request-branch-name:
      separator: "-"

  # 后端 Python（PDM 管理，依赖声明在 pyproject.toml）
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    commit-message:
      prefix: "chore"
      prefix-development: "fix"
    labels:
      - "dependencies"
    pull-request-branch-name:
      separator: "-"

  # 前端 Docker 镜像
  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"

  # 后端 Docker 镜像
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"

  # GitHub Actions 工作流本身
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 99
    labels:
      - "dependencies"

# Issue 模板行为配置
#
# ## 为什么禁掉空白 issue（blank_issues_enabled: false）
#
# 本轮治理诊断实测：**96 张 open issue、14 个里程碑**，
# 且大量卡片正文空缺或只有一句话。这不是「有人偷懒」，
# 而是**提卡成本太低的必然结果**——新建 issue 是零成本的，
# 于是「想到就提」不需要任何权衡。
#
# 空白 issue 禁令把提卡成本从 0 提到「写两句话」，
# 这是本轮唯一能真正改变行为的入口（对比：写进 AGENTS.md 的规则会被绕开）。
#
# 代价要说清：owner 想记个念头也必须选模板并写「谁的什么问题」。
# 我认为这个代价比「看板被 96 张卡淹没」小得多，
# 且**若确实只是记念头，写 bug 模板的「不修会怎样 = 暂时没有，攒着看」是合法用法**。
#
# ## 为什么没有 contact_links
#
# 本仓是单人开发，不存在「去别处问」的去处；
# 放一个指向空地址的链接只会让选项看起来比实际更多。

blank_issues_enabled: false
contact_links: []

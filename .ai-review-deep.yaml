# AI 深度审查自定义配置
#
# 与 .ai-review.yaml 指向同一份共享 prompt（docs/configs/ai-review-prompt.md）。
# 强度差异由 prompt 内「按 review-command 自适应」段落 + AI_REVIEW_CONFIG_FILE_YAML
# 区分的 review-command（run vs run-summary）决定，无需维护两份 prompt 内容。
# 路径相对仓库根目录（Action 在 checkout 后运行，根目录文件可访问）。

prompt:
  summary_prompt_files:
    - docs/configs/ai-review-prompt.md
  context_prompt_files:
    - docs/configs/ai-review-prompt.md
  inline_prompt_files:
    - docs/configs/ai-review-prompt.md
